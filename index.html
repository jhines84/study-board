e a river carving a canyon over thousands of years.", "Wind and water move soil and rock. This is erosion.", "People slow erosion by planting grass and trees and by building walls."], "w": [["Erosion", "Moving soil and rock to a new place."], ["Landslide", "Soil and rock sliding down a hill."], ["Canyon", "A deep valley carved by a river."]]}, "n2water": {"t": "Land and Water on Earth", "ideas": ["Maps show where land and water are. Blue usually means water.", "Most of Earth’s water is salty ocean water.", "Fresh water is in lakes, rivers, ponds, and frozen as ice and snow.", "Landforms include mountains, valleys, hills, and islands."], "w": [["Map key", "Explains what the symbols on a map mean."], ["Island", "Land with water all around it."], ["Glacier", "A huge sheet of ice."]]}, "n3forces": {"t": "Forces and Magnets", "ideas": ["Balanced forces do not change an object’s motion. Unbalanced forces do.", "Some motions follow patterns we can predict, like a swing going back and forth.", "Magnets attract or repel without touching. The force is stronger when they are closer.", "Static electricity can make things stick or pull without touching, like a balloon rubbed on hair."], "w": [["Balanced", "Equal forces in opposite directions."], ["Static electricity", "A charge built up by rubbing."], ["Attract", "Pull together."]]}, "n3life": {"t": "Life Cycles and Traits", "ideas": ["All living things have a life cycle: birth, growth, reproduction, and death.", "Traits are features like eye color or leaf shape.", "Many traits are inherited from parents. Brothers and sisters get different mixes.", "The environment can change traits, like a plant growing short with little water.", "Skills like riding a bike are learned, not inherited."], "w": [["Trait", "A feature of a living thing."], ["Inherited", "Passed down from parents."], ["Learned", "Gained by practice or teaching."]]}, "n3survive": {"t": "Groups, Fossils, and Survival", "ideas": ["Living in groups helps some animals survive, like zebras in herds and wolves in packs.", "Fossils show what plants and animals lived long ago and what their environments were like.", "Traits that help a living thing survive, like speed or camouflage, get passed on more often.", "When an environment changes, some living things survive, some move, and some die."], "w": [["Fossil", "Remains or traces of life from long ago."], ["Extinct", "No longer living anywhere."], ["Adaptation", "A trait that helps a living thing survive."]]}, "n3weather": {"t": "Weather and Climate", "ideas": ["Weather is what the air is like right now. Climate is the usual weather over many years.", "Tools like thermometers and rain gauges collect weather data that show patterns.", "Different places have different climates, like hot, wet rain forests and cold Alaska.", "People reduce damage from weather hazards with designs like lightning rods, levees, and storm shelters."], "w": [["Climate", "The usual weather of a place."], ["Hazard", "Something dangerous, like a flood."], ["Data", "Information we collect."]]}});
Object.assign(REV,{"g1place": {"t": "Tens and Ones", "ideas": ["A two-digit number has tens and ones.", "In 47, the 4 means 4 tens (40) and the 7 means 7 ones.", "A long rod is 10. A small cube is 1.", "To find the number after, count up 1. To find the number before, count back 1.", "To compare, look at the tens first. More tens means a bigger number."], "w": [["Tens", "Groups of 10."], ["Ones", "Single units, 0 to 9."], ["Greater", "Bigger, more."]], "ex": {"q": "What number is 3 tens and 5 ones?", "s": ["3 tens = 30.", "5 ones = 5.", "30 + 5 = 35."]}}, "g1addsub": {"t": "Add & Subtract to 20", "ideas": ["Adding puts groups together. Subtracting takes some away.", "To add, start at the bigger number and count on.", "Make a ten: 8 + 5 → 8 + 2 = 10, then 10 + 3 = 13.", "Use addition to check subtraction: 13 − 5 = 8 because 8 + 5 = 13.", "Doubles help: 6 + 6 = 12, so 6 + 7 = 13."], "w": [["Sum", "The answer when you add."], ["Difference", "The answer when you subtract."], ["Equal (=)", "The same amount on both sides."]], "ex": {"q": "9 + 4 = ?", "s": ["Make a ten: 9 + 1 = 10.", "4 take away the 1 leaves 3.", "10 + 3 = 13."]}}, "g1word": {"t": "Word Problems", "ideas": ["Read the story two times.", "“More,” “in all,” and “altogether” often mean add.", "“Left,” “gave away,” and “how many more” often mean subtract.", "Draw circles or a picture on the whiteboard to show the story."], "w": [["Altogether", "All of them added up."], ["Left", "What is still there after some are gone."]], "ex": {"q": "Sam has 9 stickers. He gets 4 more. How many does he have now?", "s": ["He gets more, so add.", "9 + 4 = 13.", "Sam has 13 stickers."]}}, "g1money": {"t": "Coins", "ideas": ["Penny = 1¢. Nickel = 5¢. Dime = 10¢. Quarter = 25¢.", "A dime is the smallest coin, but it is worth more than a penny or a nickel.", "To count coins, start with the coins worth the most.", "Count dimes by 10s, nickels by 5s, and pennies by 1s."], "w": [["Cent (¢)", "How we count money. A penny is 1 cent."], ["Value", "How much a coin is worth."]], "ex": {"q": "2 dimes, 1 nickel, and 3 pennies", "s": ["Dimes: 10, 20.", "Nickel: 25.", "Pennies: 26, 27, 28.", "Total: 28¢."]}}, "g1skip": {"t": "Skip Counting", "ideas": ["Skip counting means counting by the same jump each time.", "By 2s: 2, 4, 6, 8, 10.", "By 5s: 5, 10, 15, 20, 25.", "By 10s: 10, 20, 30, 40, 50.", "To find what comes next, figure out the jump between the numbers."], "w": [["Pattern", "Something that repeats or grows the same way."], ["Skip count", "Count by 2s, 5s, or 10s."]], "ex": {"q": "15, 20, 25, ___", "s": ["20 − 15 = 5, so each jump is 5.", "25 + 5 = 30."]}}, "g1shapes": {"t": "Shapes", "ideas": ["A triangle has 3 sides and 3 corners (vertices).", "A square has 4 equal sides. A rectangle has 4 sides: 2 long and 2 short.", "A hexagon has 6 sides. A circle has no sides and no corners.", "Solid shapes: a ball is a sphere, a can is a cylinder, a box is a rectangular prism, and a number cube is a cube.", "Halves are 2 equal parts. Fourths are 4 equal parts."], "w": [["Side", "A straight line on a shape."], ["Vertex", "A corner where two sides meet."], ["Equal parts", "Parts that are the same size."]], "ex": {"q": "How many corners does a rectangle have?", "s": ["Touch each corner and count.", "1, 2, 3, 4.", "A rectangle has 4 corners."]}}, "g1time": {"t": "Telling Time", "ideas": ["The short hand is the hour hand. The long hand is the minute hand.", "When the long hand points to 12, it is o’clock, like 3:00.", "When the long hand points to 6, it is half past, like 3:30.", "At half past, the short hand is between two numbers. Use the number it just passed."], "w": [["Hour", "60 minutes."], ["Half hour", "30 minutes."], ["O’clock", "Exactly on the hour, like 7:00."]], "ex": {"q": "The short hand is between 4 and 5. The long hand is on 6.", "s": ["The short hand just passed 4, so the hour is 4.", "The long hand on 6 means 30 minutes.", "It is 4:30."]}}, "g2place": {"t": "Place Value to 1,000", "ideas": ["A three-digit number has hundreds, tens, and ones.", "In 352: 3 hundreds (300), 5 tens (50), and 2 ones (2).", "Expanded form shows each digit’s value: 300 + 50 + 2.", "To compare, look at hundreds first, then tens, then ones. Use > (greater than), < (less than), or = (equal to).", "10 more or less changes the tens digit. 100 more or less changes the hundreds digit."], "w": [["Hundreds", "Groups of 100."], ["Expanded form", "A number written as the sum of its place values."], ["> and <", "The open side faces the bigger number."]], "ex": {"q": "Compare 452 and 425.", "s": ["Hundreds: 4 and 4 are the same.", "Tens: 5 is more than 2.", "So 452 > 425."]}}, "g2addsub": {"t": "Add & Subtract to 100", "ideas": ["Line up the tens and ones.", "Add or subtract the ones first, then the tens.", "Adding: 10 ones make 1 ten. Carry the ten to the tens column.", "Subtracting: if there are not enough ones, trade 1 ten for 10 ones.", "Check subtraction by adding."], "w": [["Regroup", "Trade 10 ones for 1 ten, or 1 ten for 10 ones."], ["Sum", "The answer when you add."], ["Difference", "The answer when you subtract."]], "ex": {"q": "46 + 38 = ?", "s": ["Ones: 6 + 8 = 14. Write 4 and carry 1 ten.", "Tens: 4 + 3 + 1 = 8.", "46 + 38 = 84."]}}, "g2word": {"t": "Word Problems", "ideas": ["Read the problem two times. Highlight the numbers and the question.", "“In all,” “total,” and “more” often mean add.", "“Left,” “how many more,” and “how much taller” often mean subtract.", "Some problems have two steps. Solve the first step, then use that answer.", "Draw a picture or a bar model on the whiteboard."], "w": [["Total", "All of them together."], ["Compare", "Find how much more or less one is than another."]], "ex": {"q": "A tree is 64 feet tall. A house is 29 feet tall. How much taller is the tree?", "s": ["“How much taller” means subtract.", "64 − 29 = 35.", "The tree is 35 feet taller."]}}, "g2money": {"t": "Money", "ideas": ["Penny = 1¢, nickel = 5¢, dime = 10¢, quarter = 25¢.", "Count from the coin worth the most to the coin worth the least.", "100¢ is the same as one dollar ($1.00).", "To find how much is left after buying something, subtract the price."], "w": [["Cent (¢)", "One penny."], ["Dollar", "100 cents."]], "ex": {"q": "1 quarter, 2 dimes, and 1 nickel", "s": ["Quarter: 25.", "Dimes: 35, 45.", "Nickel: 50.", "Total: 50¢."]}}, "g2groups": {"t": "Equal Groups", "ideas": ["Equal groups have the same number in each group.", "3 groups of 4 is 4 + 4 + 4 = 12.", "Sharing equally means every friend gets the same number.", "Skip counting helps you find the total fast."], "w": [["Equal", "The same amount."], ["Array", "Objects in equal rows and columns."]], "ex": {"q": "12 cookies are shared equally by 3 friends.", "s": ["Give each friend 1 cookie at a time.", "Keep going until all 12 are gone.", "Each friend gets 4 cookies."]}, "arr": {"mode": "mult", "r": 3, "c": 4, "t": ["An array shows equal groups in rows.", "3 rows of 4 is 4 + 4 + 4 = 12.", "Tap + and − to build your own!"]}}, "g2evenodd": {"t": "Even and Odd", "ideas": ["Even numbers can be split into pairs with none left over.", "Odd numbers have one left over.", "Even numbers end in 0, 2, 4, 6, or 8.", "Odd numbers end in 1, 3, 5, 7, or 9."], "w": [["Even", "Makes pairs with none left over."], ["Odd", "Has one left over."], ["Pair", "A group of two."]], "ex": {"q": "Is 27 even or odd?", "s": ["Look at the ones digit: 7.", "7 is odd.", "So 27 is odd."]}}, "g2frac": {"t": "Fractions", "ideas": ["Fractions are equal parts of a whole.", "2 equal parts are halves. 4 equal parts are fourths. 8 equal parts are eighths.", "The more parts a whole is cut into, the smaller each part is.", "2 halves, 4 fourths, or 8 eighths make one whole."], "w": [["Half", "One of 2 equal parts."], ["Fourth", "One of 4 equal parts."], ["Eighth", "One of 8 equal parts."]], "ex": {"q": "A pizza is cut into 4 equal slices. You eat 3.", "s": ["Each slice is one-fourth.", "3 slices is three-fourths of the pizza."]}}, "g2time": {"t": "Telling Time", "ideas": ["The short hand shows the hour. The long hand shows the minutes.", "Count by 5s for each number the long hand points to: 1 is 5, 2 is 10, 3 is 15.", "Use the hour number the short hand just passed.", "a.m. is from midnight to noon. p.m. is from noon to midnight."], "w": [["Minute hand", "The long hand."], ["Hour hand", "The short hand."], ["a.m. / p.m.", "Morning / afternoon and night."]], "ex": {"q": "The short hand just passed 7. The long hand is on 5.", "s": ["The hour is 7.", "Count by 5s to the 5: 5, 10, 15, 20, 25.", "It is 7:25."]}}, "g2length": {"t": "Measuring Length", "ideas": ["Line up one end of the object with 0 on the ruler.", "Read the number where the object ends.", "If it does not start at 0, count the spaces between the start and the end.", "Inches and feet are one kind of unit. Centimeters and meters are another."], "w": [["Length", "How long something is."], ["Inch", "A small unit of length."], ["Centimeter", "An even smaller unit of length."]], "ex": {"q": "A crayon starts at 0 and ends at 4.", "s": ["Read where it ends: 4.", "The crayon is 4 inches long."]}}, "s1a": {"t": "Living and Nonliving", "ideas": ["Living things grow, change, need food and water, and make more living things.", "Nonliving things do not grow or need food. Rocks and toys are nonliving.", "Plants need sunlight, water, air, and soil.", "Animals need food, water, air, and shelter."], "w": [["Living", "Grows, needs food and water, and has young."], ["Nonliving", "Does not grow or need food."], ["Shelter", "A safe place to live."]]}, "s1b": {"t": "Plants", "ideas": ["Roots take in water and hold the plant in the soil.", "The stem holds the plant up and carries water.", "Leaves use sunlight to make food.", "Flowers make seeds. Seeds grow into new plants."], "w": [["Root", "Takes in water."], ["Stem", "Holds the plant up."], ["Seed", "Grows into a new plant."]]}, "s1c": {"t": "Animals", "ideas": ["Animals have body parts that help them live. Birds have feathers. Fish have fins and gills.", "Animals live in habitats like oceans, ponds, deserts, and forests.", "Baby animals grow up to look like their parents.", "Life cycles: egg → tadpole → frog, and egg → chick → chicken.", "Food chains show who eats what: grass → rabbit → fox."], "w": [["Habitat", "The place where an animal lives."], ["Life cycle", "How a living thing grows and changes."], ["Gills", "Body parts fish use to breathe."]]}, "s1d": {"t": "Objects and Matter", "ideas": ["We describe objects by size, shape, color, texture, and what they are made of.", "Texture is how something feels: rough, smooth, soft, or hard.", "Some materials bend, some are clear, and some are strong.", "We can put objects together to make something new.", "Heat melts ice into water. Cold freezes water into ice."], "w": [["Texture", "How something feels."], ["Material", "What something is made of."], ["Melt", "Change from solid to liquid."]]}, "s1e": {"t": "Pushes, Pulls, and Magnets", "ideas": ["A push moves something away from you. A pull moves it toward you.", "Pushes and pulls can make things start, stop, or turn.", "A bigger push makes things go faster and farther.", "Magnets stick to some metals, like paper clips and fridge doors. They do not stick to wood, plastic, or paper."], "w": [["Push", "Moves something away."], ["Pull", "Moves something closer."], ["Magnet", "Attracts some metals."]]}, "s1f": {"t": "Light, Heat, and Sound", "ideas": ["The Sun gives us light and heat.", "Shadows form when something blocks light.", "Sound is made when things vibrate (shake back and forth).", "Sounds can be loud or soft."], "w": [["Light", "Lets us see."], ["Shadow", "A dark shape where light is blocked."], ["Vibrate", "Shake back and forth quickly."]]}, "s1g": {"t": "Earth and Sky", "ideas": ["Rocks, soil, and water are natural resources from Earth.", "We see the Sun in the day. We often see the Moon and stars at night.", "Earth spins, which gives us day and night.", "The four seasons are spring, summer, fall, and winter.", "Weather is what it is like outside. A thermometer measures temperature."], "w": [["Natural resource", "Something useful from nature."], ["Season", "A part of the year: spring, summer, fall, or winter."], ["Thermometer", "A tool that measures how hot or cold it is."]]}, "s2a": {"t": "Matter and Its Properties", "ideas": ["Properties describe matter: hard or soft, flexible or stiff, absorbent or not.", "Flexible means it bends. Absorbent means it soaks up water.", "Heating can melt solids. Cooling can freeze liquids.", "Cutting or folding paper changes its size or shape, but it is still paper.", "We choose materials for a job because of their properties."], "w": [["Property", "Something you can observe about matter."], ["Flexible", "Bends without breaking."], ["Absorbent", "Soaks up liquid."]]}, "s2b": {"t": "Forces and Motion", "ideas": ["A force is a push or a pull.", "A stronger push makes things go faster and farther.", "Forces can change an object’s speed, direction, or shape.", "Gravity pulls things down to the ground.", "Rough surfaces slow things down more than smooth ones."], "w": [["Force", "A push or a pull."], ["Gravity", "Pulls things toward Earth."], ["Direction", "The way something moves."]]}, "s2c": {"t": "Sound and Energy", "ideas": ["Sound is made by vibrations.", "Big vibrations make loud sounds. Small vibrations make soft sounds.", "Fast vibrations make high sounds. Slow vibrations make low sounds.", "Sound travels through the air to our ears.", "The Sun gives light and heat. Lamps change electricity into light."], "w": [["Vibration", "A quick back-and-forth movement."], ["Pitch", "How high or low a sound is."], ["Volume", "How loud or soft a sound is."]]}, "s2d": {"t": "Weather and Water", "ideas": ["Weather tools: thermometer (temperature), rain gauge (rain), and wind vane (wind direction).", "Wind is moving air.", "Water cycle: the Sun warms water, it evaporates, clouds form, and rain or snow falls.", "Precipitation is rain, snow, sleet, or hail.", "Go inside when there is lightning."], "w": [["Evaporate", "Change from liquid water to water vapor in the air."], ["Precipitation", "Water falling from clouds."], ["Forecast", "A guess about tomorrow’s weather."]]}, "s2e": {"t": "Earth Materials and Changes", "ideas": ["Rocks, soil, sand, and water are Earth materials.", "Soil is made of tiny bits of rock and old plants.", "Wind and water can move soil and rock. This is erosion.", "Plant roots help hold soil in place.", "Reduce, reuse, and recycle to take care of Earth."], "w": [["Erosion", "Moving soil and rock to a new place."], ["Reuse", "Use something again."], ["Recycle", "Make old things into new things."]]}, "s2f": {"t": "Objects in the Sky", "ideas": ["The Sun is a star. It looks small because it is very far away.", "The Moon reflects light from the Sun.", "The Moon’s shape seems to change. These shapes are called phases.", "It takes about a month to see all the Moon’s phases.", "Stars are in the sky during the day too, but the Sun is too bright to see them."], "w": [["Star", "A giant ball of hot gas that gives off light."], ["Phase", "A shape of the Moon we see."], ["Reflect", "Bounce light back."]]}, "s2g": {"t": "Plants and Animals", "ideas": ["Roots take in water, stems hold the plant up, and leaves make food.", "Bees carry pollen from flower to flower.", "Wind, water, and animals help move seeds to new places.", "Animals have body parts that help them live in their habitats, like webbed feet and thick fur.", "Insects like butterflies and ladybugs grow through egg, larva, pupa, and adult."], "w": [["Pollen", "Yellow dust that helps flowers make seeds."], ["Habitat", "Where a living thing lives."], ["Larva", "The young stage of an insect."]]}});
Object.assign(REV,{"g4place":{"t":"Place Value & Rounding","ideas":["Each place is worth 10 times the place to its right.","Big numbers are read in groups of three: millions, thousands, and ones.","Expanded form shows the value of each digit: 4,305 = 4,000 + 300 + 5.","To compare, line up the places and compare from the left.","To round, look at the digit to the right of the place you are rounding to: 5 or more rounds up."],"ex":{"q":"Round 486,215 to the nearest ten thousand.","s":["The ten thousands digit is 8, so the number is between 480,000 and 490,000.","Look at the digit to its right: 6.","6 is 5 or more, so round up to 490,000."]},"w":[["Place value","What a digit is worth because of its place."],["Expanded form","A number written as the sum of its place values."],["Round","Change to a nearby, simpler number."]]},"g4placecc":{"t":"Place Value & Rounding","ideas":["Each place is worth 10 times the place to its right.","Expanded form shows the value of each digit: 72,408 = 70,000 + 2,000 + 400 + 8.","To compare, line up the places and compare from the left.","To round, look at the digit just to the right of the place you are rounding to."],"ex":{"q":"Is 63,518 or 63,581 greater?","s":["Ten thousands, thousands, and hundreds match.","Compare the tens: 1 and 8.","8 is more, so 63,581 is greater."]},"w":[["Place value","What a digit is worth because of its place."],["Expanded form","A number written as the sum of its place values."],["Round","Change to a nearby, simpler number."]]},"g4dec":{"t":"Decimals","ideas":["A decimal shows part of a whole. Tenths are the first place after the decimal point, and hundredths are the second.","0.4 = 4/10 and 0.47 = 47/100.","On a hundred grid, each small square is 0.01, and each row is 0.1.","To compare decimals, line up the decimal points. 0.7 is the same as 0.70, so 0.7 > 0.65.","A dime is 0.1 of a dollar, and a penny is 0.01."],"ex":{"q":"Which is greater, 0.6 or 0.58?","s":["Write 0.6 as 0.60.","Compare 60 hundredths and 58 hundredths.","0.6 is greater."]},"w":[["Tenth","One of 10 equal parts: 0.1."],["Hundredth","One of 100 equal parts: 0.01."],["Decimal point","The dot that separates wholes from parts."]]},"g4deccc":{"t":"Decimals","ideas":["Tenths are the first place after the decimal point. Hundredths are the second.","3/10 = 30/100, so you can add tenths and hundredths: 3/10 + 4/100 = 34/100.","0.34 means 34 hundredths.","To compare decimals, line up the decimal points: 0.5 = 0.50."],"ex":{"q":"Write 6/10 + 7/100 as a decimal.","s":["6/10 = 60/100.","60/100 + 7/100 = 67/100.","67/100 = 0.67."]},"w":[["Tenth","One of 10 equal parts: 0.1."],["Hundredth","One of 100 equal parts: 0.01."],["Equivalent","Equal in value."]]},"g4frac":{"t":"Fractions","ideas":["Equivalent fractions name the same amount: multiply the top and bottom by the same number.","To compare fractions with different denominators, use a common denominator or a benchmark like 1/2.","To add or subtract fractions with the same denominator, add or subtract the numerators and keep the denominator.","Any fraction can be broken into a sum: 3/5 = 1/5 + 1/5 + 1/5.","On a number line, count the equal parts from 0."],"ex":{"q":"Compare 2/3 and 3/4.","s":["Use 12 as a common denominator.","2/3 = 8/12 and 3/4 = 9/12.","8/12 < 9/12, so 2/3 < 3/4."]},"w":[["Numerator","The top number: how many parts."],["Denominator","The bottom number: how many equal parts in the whole."],["Equivalent fractions","Fractions that name the same amount."]]},"g4fraccc":{"t":"Fractions","ideas":["Equivalent fractions name the same amount.","Add or subtract like denominators by working with the numerators.","Mixed numbers: add the wholes, then add the fractions.","Multiplying a fraction by a whole number means equal groups: 3 × 2/5 = 6/5."],"ex":{"q":"4 × 2/3 = ?","s":["4 groups of 2/3.","4 × 2 = 8, and the denominator stays 3.","The answer is 8/3."]},"w":[["Mixed number","A whole number and a fraction, like 2 1/4."],["Unit fraction","A fraction with 1 on top, like 1/5."],["Denominator","The number of equal parts in the whole."]]},"g4addsub":{"t":"Add & Subtract with Decimals","ideas":["Line up the places (and the decimal points) before you add or subtract.","Regroup when a column adds to 10 or more, or when the top digit is too small.","Write tenths as hundredths if it helps: 2.8 = 2.80.","Check subtraction by adding."],"ex":{"q":"7.2 − 3.45 = ?","s":["Write 7.2 as 7.20 and line up the decimal points.","Subtract, regrouping: 7.20 − 3.45 = 3.75.","Check: 3.75 + 3.45 = 7.20."]},"w":[["Regroup","Trade 10 of one place for 1 of the next."],["Decimal point","The dot between wholes and parts."],["Sum","The answer to an addition problem."]]},"g4addsubcc":{"t":"Add & Subtract","ideas":["Line up the ones, tens, hundreds, and thousands.","Add or subtract one place at a time, starting with the ones.","Regroup when needed.","Check subtraction by adding."],"ex":{"q":"6,005 − 2,348 = ?","s":["Regroup across the zeros: 6,005 becomes 5 thousands, 9 hundreds, 9 tens, and 15 ones.","Subtract each place: 3,657.","Check: 3,657 + 2,348 = 6,005."]},"w":[["Regroup","Trade 10 of one place for 1 of the next."],["Difference","The answer to a subtraction problem."],["Sum","The answer to an addition problem."]]},"g4mult":{"t":"Multiplication","ideas":["To multiply by 10 or 100, each digit moves one or two places to the left.","Break numbers apart into tens and ones, then add the partial products.","An area model shows the parts: 23 × 14 = (20 × 14) + (3 × 14).","Use basic facts with place value: 6 × 400 = 24 hundreds = 2,400."],"ex":{"q":"27 × 34 = ?","s":["Break 34 into 30 + 4.","27 × 30 = 810 and 27 × 4 = 108.","810 + 108 = 918."]},"w":[["Partial products","Smaller products that add up to the full answer."],["Factor","A number being multiplied."],["Product","The answer to a multiplication problem."]]},"g4div":{"t":"Division","ideas":["Division splits a total into equal groups.","Divide one place at a time, starting with the greatest place.","A remainder is what is left over. It must be less than the divisor.","Check division with multiplication."],"ex":{"q":"157 ÷ 6 = ?","s":["6 × 26 = 156.","157 − 156 = 1 left over.","The answer is 26 R1."]},"w":[["Dividend","The number being divided."],["Divisor","The number you divide by."],["Remainder","The amount left over."]]},"g4word":{"t":"Word Problems & Estimating","ideas":["Read carefully and decide what the question is asking.","Two-step problems: solve one step, then use that answer in the next step.","Think about remainders: sometimes you round up (vans needed), and sometimes you only count full groups.","Write an equation with a letter for the unknown, like n = (4 × 12) + 9.","Estimate by rounding or with compatible numbers to check if an answer makes sense."],"ex":{"q":"45 students ride in vans that hold 8 each. How many vans are needed?","s":["45 ÷ 8 = 5 R5.","5 vans are full, but 5 students still need a ride.","So 6 vans are needed."]},"w":[["Estimate","A close answer, found with easier numbers."],["Compatible numbers","Numbers that are easy to compute with."],["Equation","A number sentence with an equal sign."]]},"g4wordcc":{"t":"Word Problems & Comparing","ideas":["“Times as many” means multiply: 3 times as many as 5 is 15.","If you know the bigger amount and how many times, divide to find the smaller amount.","Two-step problems: solve one step at a time.","Think about what a remainder means in the story."],"ex":{"q":"A tree is 32 feet tall. That is 4 times as tall as a bush. How tall is the bush?","s":["The tree is 4 times the bush.","Divide: 32 ÷ 4 = 8.","The bush is 8 feet tall."]},"w":[["Times as many","A comparison that uses multiplication."],["Equation","A number sentence with an equal sign."],["Remainder","The amount left over after dividing."]]},"g4pattern":{"t":"Patterns & Input-Output Tables","ideas":["An input-output table follows one rule for every row.","Test a rule on every row, not just the first one.","Rules can add or multiply: “add 6” or “multiply by 3.”","A pattern can link each position to its value: position 5 → 5 × 4 = 20."],"ex":{"q":"Inputs 2, 3, 5 give outputs 8, 12, 20. What is the rule?","s":["Try “add 6”: 3 + 6 = 9, not 12. It does not work.","Try “multiply by 4”: 2 × 4 = 8, 3 × 4 = 12, 5 × 4 = 20.","The rule is multiply by 4."]},"w":[["Input","The number you start with."],["Output","The number you get after using the rule."],["Rule","What you do to every input."]]},"g4area":{"t":"Perimeter & Area Formulas","ideas":["Perimeter is the distance around a shape. For a rectangle, P = 2l + 2w. For a square, P = 4s.","Area is the space inside, in square units. For a rectangle, A = l × w.","If you know the area and one side, divide to find the other side.","If you know the perimeter and one side, subtract both lengths, then divide by 2."],"ex":{"q":"A rectangle has an area of 56 square feet and a length of 8 feet. What is the width?","s":["A = l × w, so 8 × ? = 56.","56 ÷ 8 = 7.","The width is 7 feet."]},"w":[["Perimeter","The distance around a shape."],["Area","The number of square units that cover a shape."],["Formula","A rule written with letters, like A = l × w."]]},"g4geo":{"t":"Lines, Symmetry & Shapes","ideas":["A line goes on forever both ways. A ray has one endpoint. A line segment has two endpoints.","Parallel lines never cross. Perpendicular lines cross to make right angles.","A line of symmetry folds a figure into two matching halves.","Triangles can be acute (all angles small), right (one square corner), or obtuse (one wide angle).","Shapes can be sorted by parallel sides, perpendicular sides, and right angles."],"ex":{"q":"How many lines of symmetry does a rectangle that is not a square have?","s":["Fold it top to bottom: the halves match.","Fold it left to right: the halves match.","Diagonal folds don’t match, so it has 2 lines of symmetry."]},"w":[["Parallel","Always the same distance apart; never crossing."],["Perpendicular","Crossing at a right angle."],["Line of symmetry","A fold line that makes two matching halves."]]},"g4angle":{"t":"Angles","ideas":["Angles are measured in degrees (°). A full circle is 360°.","1 degree is 1/360 of a circle, so 1/4 of a circle is 90°.","Acute is less than 90°, right is 90°, obtuse is between 90° and 180°, and straight is 180°.","To use a protractor, put the center on the vertex and one ray on 0°, then read where the other ray crosses.","Angles that sit side by side add up: if a 90° angle is split and one part is 35°, the other is 55°."],"ex":{"q":"A straight angle is split into two angles. One is 120°. What is the other?","s":["A straight angle is 180°.","180° − 120° = 60°.","The other angle is 60°."]},"w":[["Degree","The unit for measuring angles."],["Vertex","The point where two rays meet."],["Protractor","A tool for measuring angles."]]},"g4measure":{"t":"Measurement & Conversions","ideas":["To change a larger unit to a smaller unit, multiply: 3 feet = 3 × 12 = 36 inches.","To change a smaller unit to a larger unit, divide: 48 inches = 48 ÷ 12 = 4 feet.","Know key facts: 1 foot = 12 inches, 1 yard = 3 feet, 1 pound = 16 ounces, 1 gallon = 4 quarts, 1 meter = 100 centimeters, 1 kilogram = 1,000 grams, 1 liter = 1,000 milliliters.","For elapsed time, add the hours, then the minutes."],"ex":{"q":"How many ounces are in 5 pounds?","s":["1 pound = 16 ounces.","Pounds are larger, so multiply.","5 × 16 = 80 ounces."]},"w":[["Convert","To change from one unit to another."],["Customary units","Inches, feet, pounds, gallons, and more."],["Metric units","Meters, grams, liters, and more."]]},"g4data":{"t":"Data: Tables & Plots","ideas":["A frequency table shows how many times each answer happened.","A dot plot shows each data point as a dot above a number line.","A stem-and-leaf plot splits each number into a stem (tens) and a leaf (ones). Use the key: 3 | 2 means 32.","To answer questions, count, add, or subtract the data carefully."],"ex":{"q":"A dot plot has 4 dots above 2 and 3 dots above 5. How many more 2s than 5s?","s":["There are 4 dots for 2.","There are 3 dots for 5.","4 − 3 = 1 more."]},"w":[["Frequency","How many times something happens."],["Dot plot","A graph that uses dots above a number line."],["Stem-and-leaf plot","A display that splits numbers into stems and leaves."]]},"g4datacc":{"t":"Line Plots","ideas":["A line plot shows data as X’s or dots above a number line.","Line plots can use fractions, like 1/8, 2/8, and 3/8 of an inch.","To find a difference, subtract the fractions.","To find a total for one size, multiply: 3 pieces of 2/8 inch = 6/8 inch."],"ex":{"q":"The longest piece is 7/8 inch and the shortest is 2/8 inch. What is the difference?","s":["Subtract: 7/8 − 2/8.","7 − 2 = 5, and the denominator stays 8.","The difference is 5/8 inch."]},"w":[["Line plot","A graph with marks above a number line."],["Data","Information collected."],["Difference","How much more or less."]]},"g4money":{"t":"Money Sense","ideas":["A fixed expense costs the same each time, like rent. A variable expense can change, like groceries.","Profit = income − expenses.","Saving in a bank keeps money safe and can earn interest.","A budget can split money into spending, saving, and sharing.","Banks keep money safe, lend money, and charge interest when they lend."],"ex":{"q":"You sell 20 bracelets for $2 each and spend $15 on supplies. What is your profit?","s":["Income: 20 × $2 = $40.","Profit = income − expenses.","$40 − $15 = $25."]},"w":[["Income","Money you earn."],["Expense","Money you spend."],["Profit","Money left after paying expenses."]]},"g4factors":{"t":"Factors, Multiples & Patterns","ideas":["Factors are numbers you multiply to get a product: 3 and 4 are factors of 12.","Multiples are the products of a number and whole numbers: 4, 8, 12, 16 are multiples of 4.","A prime number has exactly two factors: 1 and itself. A composite number has more than two.","Patterns follow a rule, and you can notice other features, like odd and even."],"ex":{"q":"Is 21 prime or composite?","s":["Check for factors: 1, 3, 7, and 21.","That is more than two factors.","21 is composite."]},"w":[["Factor","A number that divides another with no remainder."],["Multiple","The product of a number and a whole number."],["Prime","Having exactly two factors: 1 and itself."]]},"s4a":{"t":"Thinking Like a Scientist","ideas":["Ask a question you can test, then make a prediction.","In a fair test, change only one thing (the variable) and keep everything else the same.","Measure with the right tool and record data in a table.","Use evidence from your data to support a claim.","Engineers define a problem, design, test, and improve."],"ex":{"q":"Does the amount of water change how fast seeds sprout?","s":["Change only the amount of water.","Keep the soil, seeds, light, and temperature the same.","Count sprouts each day and record them in a table."]},"w":[["Variable","Something that can change in a test."],["Evidence","Data or observations that support a claim."],["Prototype","A first model of a design that engineers test."]]},"s4b":{"t":"Properties of Matter","ideas":["Matter is anything that has mass and takes up space.","Solids keep their shape. Liquids take the shape of their container. Gases spread out to fill it.","Objects less dense than water float. Objects more dense than water sink.","Magnets attract objects made of iron, nickel, or cobalt.","Temperature can change the state of matter: ice melts at 0 °C and water boils at 100 °C."],"ex":{"q":"A wooden block floats, and a steel bolt sinks. What does that tell you?","s":["Floating means less dense than water.","Sinking means more dense than water.","The wood is less dense than water, and the steel is more dense."]},"w":[["Mass","How much matter something has."],["Relative density","Whether something sinks or floats compared to water."],["Physical property","A trait you can observe or measure."]]},"s4c":{"t":"Mixtures and Solutions","ideas":["A mixture is two or more kinds of matter that keep their own properties.","A solution is a mixture where one thing dissolves evenly, like salt in water.","Mixtures can be separated with filters, magnets, sieves, or evaporation.","Matter is conserved: the mass of a mixture equals the masses of its parts added together."],"ex":{"q":"200 g of water is mixed with 20 g of salt. What is the total mass?","s":["The salt dissolves, but it is still there.","Add the masses: 200 g + 20 g.","The total is 220 g."]},"w":[["Mixture","Matter mixed together that keeps its own properties."],["Solution","A mixture in which something dissolves evenly."],["Dissolve","To break into pieces too tiny to see."]]},"s4d":{"t":"Forces","ideas":["A force is a push or a pull.","Gravity pulls objects toward Earth’s center, even without touching.","Magnetism can push or pull at a distance. Like poles repel, and opposite poles attract.","Friction is a contact force that slows moving objects. Rough surfaces make more friction.","Magnetic force gets weaker as distance grows."],"ex":{"q":"Where does a toy car roll farthest: carpet, wood, or ice?","s":["Friction slows the car.","Ice has the least friction.","The car rolls farthest on ice."]},"w":[["Gravity","The pull of Earth on objects."],["Friction","A force that slows things when surfaces rub."],["Magnetism","A force that attracts or repels magnetic materials."]]},"s4e":{"t":"Energy on the Move","ideas":["Energy can move from one object to another.","A moving object can transfer energy to what it hits, like a bat hitting a ball.","Waves in water carry energy, and the water mostly moves up and down.","Sound is made by vibrations that carry energy through matter.","Faster objects have more energy of motion."],"ex":{"q":"A bowling ball knocks down pins. Where did the pins’ energy come from?","s":["The ball was moving, so it had energy.","When it hit the pins, energy moved to them.","The pins fell because of the transferred energy."]},"w":[["Energy","The ability to cause change or motion."],["Transfer","To move from one place or object to another."],["Vibration","A quick back-and-forth motion."]]},"s4f":{"t":"Conductors, Insulators, and Circuits","ideas":["Conductors let electricity or heat flow easily. Metals are good conductors.","Insulators slow or block electricity and heat. Rubber, plastic, wood, and foam are insulators.","A closed circuit is a complete loop, so electricity can flow.","An open circuit has a gap, so electricity stops.","Electrical energy can change into light and heat, like in a light bulb."],"ex":{"q":"Why does a pot have a plastic handle?","s":["The metal pot conducts heat from the stove.","Plastic is an insulator.","The handle stays cool enough to hold."]},"w":[["Conductor","A material that lets energy flow through it easily."],["Insulator","A material that slows the flow of energy."],["Circuit","A closed path that electricity flows through."]]},"s4g":{"t":"Seasons and Moon Phases","ideas":["In Texas, summer has long days and warm temperatures. Winter has short days and cool temperatures.","Daylight grows from December to June, then shrinks from June to December.","The Moon reflects sunlight. As it orbits Earth, we see different amounts of its lit side.","The phases go: new, waxing crescent, first quarter, waxing gibbous, full, waning gibbous, third quarter, waning crescent.","One full cycle of Moon phases takes about 29.5 days."],"ex":{"q":"Tonight is a first quarter moon. What comes next?","s":["After first quarter, the lit part keeps growing.","More than half lit and growing is waxing gibbous.","Next comes the waxing gibbous moon."]},"w":[["Phase","The shape of the lit part of the Moon we see."],["Waxing","Growing larger."],["Waning","Getting smaller."]]},"s4h":{"t":"Water Cycle, Weather, and Climate","ideas":["The Sun is the energy source that drives the water cycle.","Evaporation turns liquid water into water vapor.","Condensation turns water vapor into drops that form clouds.","Precipitation (rain, snow, sleet, hail) falls back to Earth, then collects or runs off.","Weather is what is happening now. Climate is the usual pattern over many years."],"ex":{"q":"Is “Houston gets about 50 inches of rain a year” weather or climate?","s":["It describes a usual pattern over many years.","It is not about one day.","So it describes climate."]},"w":[["Evaporation","Liquid water changing into a gas."],["Condensation","Water vapor changing into liquid drops."],["Climate","The usual weather pattern in a place over many years."]]},"s4i":{"t":"Weathering, Erosion, and Deposition","ideas":["Weathering breaks rock into smaller pieces.","Erosion moves the pieces to a new place.","Deposition drops the pieces somewhere else.","Water, wind, and ice cause these changes, usually slowly over many years.","Plant roots hold soil and slow erosion."],"ex":{"q":"A river carries sand downstream and drops it at the coast. Which steps happened?","s":["Carrying the sand away is erosion.","Dropping it at the coast is deposition.","Over time, this can build a delta."]},"w":[["Weathering","Breaking down rock."],["Erosion","Moving rock and soil."],["Deposition","Dropping rock and soil in a new place."]]},"s4j":{"t":"Natural Resources","ideas":["Renewable resources, like wind, sunlight, water, plants, and animals, can be replaced.","Nonrenewable resources, like coal, oil, and natural gas, take millions of years to form.","Every energy resource has advantages and disadvantages.","Conserving, reusing, recycling, and throwing trash away properly protect the environment.","Oil, gas, and groundwater are stored in rocks that have tiny spaces, like sandstone."],"ex":{"q":"Name one advantage and one disadvantage of solar power.","s":["Advantage: sunlight won’t run out and makes no smoke.","Disadvantage: it doesn’t work well at night or on cloudy days."]},"w":[["Renewable","Can be replaced in a short time."],["Nonrenewable","Takes so long to form that it can run out."],["Conserve","To use less so it lasts longer."]]},"s4k":{"t":"Producers and Food Webs","ideas":["Producers, like plants, make their own food from sunlight, water, and carbon dioxide.","Consumers eat other living things for energy.","Decomposers break down dead things and return nutrients to the soil.","A food web shows many connected food chains. Arrows point toward the eater.","Energy flows from the Sun to producers to consumers, and matter keeps cycling."],"ex":{"q":"Sun → grass → rabbit → coyote. Where does the coyote’s energy come from?","s":["The coyote eats the rabbit.","The rabbit ate the grass.","The grass got its energy from the Sun."]},"w":[["Producer","A living thing that makes its own food."],["Consumer","A living thing that eats other living things."],["Decomposer","A living thing that breaks down dead matter."]]},"s4l":{"t":"Fossils and Past Environments","ideas":["Fossils are the remains or traces of living things from long ago.","Most fossils form in sedimentary rock, made from layers of mud and sand.","Lower rock layers are usually older than higher layers.","Fossils tell us about past environments. Sea fossils on dry land mean an ocean was once there.","Texas has many fossils, like dinosaur tracks in Glen Rose and seashells in the Hill Country."],"ex":{"q":"Fossil shells are found in a field in Central Texas. What can you infer?","s":["Shells come from sea animals.","The land must once have been covered by the sea.","So the environment has changed over time."]},"w":[["Fossil","Evidence of life from long ago, kept in rock."],["Sedimentary rock","Rock made from layers of sediment."],["Trace fossil","A sign of an animal’s activity, like a footprint."]]},"s4m":{"t":"Plant Structures and Traits","ideas":["Plant structures help plants survive: roots take in water, stems hold the plant up, and leaves make food.","Desert plants have waxy leaves, spines, and deep roots to save and find water.","Inherited traits are passed from parents to offspring, like flower color.","Acquired traits come from the environment or experiences, like a scar or a tree bent by wind."],"ex":{"q":"A plant in the shade grows tall and thin. Is this inherited or acquired?","s":["The shade, part of the environment, caused the change.","It was not passed down from the parent plant.","So it is an acquired trait."]},"w":[["Structure","A part of a living thing."],["Inherited trait","A trait passed from parents."],["Acquired trait","A trait that comes from the environment or experience."]]},"n4energy":{"t":"Energy","ideas":["Faster objects have more energy.","Energy can be transferred by sound, light, heat, and electric currents.","When objects collide, energy moves between them and can change into sound and heat.","Devices change energy from one form to another, like a fan changing electricity into motion."],"ex":{"q":"What energy changes happen in a flashlight?","s":["The battery stores energy.","Electricity flows through the circuit.","The bulb changes it into light and some heat."]},"w":[["Energy","The ability to cause change."],["Collision","When moving objects hit each other."],["Electric current","The flow of electricity through a circuit."]]},"n4waves":{"t":"Waves and Information","ideas":["Waves carry energy from place to place.","Amplitude is a wave’s height. Wavelength is the distance from one peak to the next.","We see objects when light reflects off them and enters our eyes.","Patterns, like codes, can be used to send information over long distances."],"ex":{"q":"Why can you see a red apple on a table?","s":["Light shines on the apple.","The light reflects off the apple.","It enters your eyes, and your brain makes sense of it."]},"w":[["Amplitude","The height of a wave."],["Wavelength","The distance between two peaks."],["Reflect","To bounce off a surface."]]},"n4structures":{"t":"Structures and Senses","ideas":["Plants and animals have inside and outside structures that help them survive, grow, and reproduce.","Hearts pump blood, lungs and gills take in oxygen, and skeletons support the body.","Senses, like eyes and ears, collect information.","The brain processes information and decides how the body responds."],"ex":{"q":"How does a rabbit escape a fox?","s":["Its ears hear the fox coming.","Its brain decides to run.","Its strong back legs help it hop away fast."]},"w":[["Structure","A part of a living thing."],["Sense","A way of getting information, like sight or hearing."],["Brain","The organ that processes information."]]},"n4earth":{"t":"Earth’s Changing Surface","ideas":["Rock layers form one on top of another, so lower layers are older.","Fossils in rock layers show how a place has changed over time.","Water, ice, wind, and plants weather and erode rock and soil.","Maps show patterns, like belts of volcanoes and earthquakes."],"ex":{"q":"A bottom layer has sea fossils and the top layer has land plant fossils. What happened?","s":["The bottom layer is older.","Long ago, the place was under water.","Later, it became land."]},"w":[["Weathering","Breaking rock into smaller pieces."],["Erosion","Moving rock and soil to a new place."],["Fossil","Evidence of life from long ago."]]},"n4resources":{"t":"Energy Resources and Natural Hazards","ideas":["Energy comes from renewable resources (wind, sun, water) and nonrenewable ones (coal, oil, natural gas).","Using resources can affect the environment, like mining or air pollution.","Natural hazards include earthquakes, floods, hurricanes, tsunamis, and volcanic eruptions.","Engineers design ways to reduce the damage, like levees, warning systems, and flexible buildings."],"ex":{"q":"How can a town near a river reduce flood damage?","s":["Build levees to hold back water.","Build homes on higher ground.","Keep wetlands that soak up extra water."]},"w":[["Natural hazard","A natural event that can cause harm."],["Levee","A wall of earth that holds back a river."],["Renewable","Can be replaced in a short time."]]}});
Object.assign(REV,{"g5place":{"t":"Decimals to Thousandths","ideas":["After the decimal point, the places are tenths, hundredths, and thousandths.","Each place is worth 10 times the place to its right.","Expanded form: 4.305 = 4 + 0.3 + 0.005.","To compare or order decimals, line up the decimal points. Writing zeros at the end can help: 0.6 = 0.600.","To round, look at the digit just to the right of the place you are rounding to."],"ex":{"q":"Order 0.5, 0.45, and 0.405 from least to greatest.","s":["Write each with 3 places: 0.500, 0.450, 0.405.","Compare: 405 < 450 < 500.","Order: 0.405, 0.45, 0.5."]},"w":[["Tenths","The first place after the decimal point."],["Hundredths","The second place after the decimal point."],["Thousandths","The third place after the decimal point."]]},"g5placecc":{"t":"Place Value & Powers of 10","ideas":["Each place is worth 10 times the place to its right and 1/10 of the place to its left.","10² = 10 × 10 = 100 and 10³ = 1,000. The exponent tells how many zeros.","Expanded form shows the value of each digit: 4.305 = 4 + 0.3 + 0.005.","Multiplying by 10, 100, or 1,000 moves digits 1, 2, or 3 places to the left.","Dividing by 10, 100, or 1,000 moves digits 1, 2, or 3 places to the right.","Read 4.025 as “four and twenty-five thousandths.”"],"ex":{"q":"3.6 × 10² = ?","s":["10² = 100.","Multiplying by 100 moves each digit 2 places left.","3.6 × 100 = 360."]},"w":[["Exponent","A small raised number that tells how many times to multiply."],["Power of 10","A number like 10, 100, or 1,000."],["Thousandths","The third place after the decimal point."]]},"g5addsub":{"t":"Add & Subtract Decimals","ideas":["Line up the decimal points before you add or subtract.","Write zeros at the end so both numbers have the same number of places.","Add or subtract each place from right to left, regrouping as needed.","Check subtraction by adding the answer to the number you subtracted."],"ex":{"q":"12 − 3.45 = ?","s":["Write 12 as 12.00.","Line up the decimal points and regroup: 12.00 − 3.45.","The answer is 8.55. Check: 8.55 + 3.45 = 12."]},"w":[["Decimal point","The dot that separates wholes from parts."],["Regroup","Trade 1 of a place for 10 of the next place."],["Difference","The answer to a subtraction problem."]]},"g5mult":{"t":"Multiplying Whole Numbers","ideas":["To multiply a 3-digit number by a 2-digit number, multiply by the ones, then by the tens.","When multiplying by the tens digit, the partial product ends in 0.","Add the partial products for the answer.","Estimate first by rounding, so you can check that your answer makes sense."],"ex":{"q":"243 × 36 = ?","s":["243 × 6 = 1,458.","243 × 30 = 7,290.","1,458 + 7,290 = 8,748."]},"w":[["Partial product","Part of the answer from multiplying one place."],["Product","The answer to a multiplication problem."],["Estimate","A close answer found with rounded numbers."]]},"g5div":{"t":"Dividing by 2-Digit Numbers","ideas":["Divide one step at a time: estimate, multiply, subtract, and bring down.","Round the divisor to estimate each digit of the quotient.","A remainder must be less than the divisor.","In word problems, decide whether to round up, round down, or use the remainder."],"ex":{"q":"1,575 ÷ 25 = ?","s":["25 goes into 157 about 6 times: 6 × 25 = 150, and 157 − 150 = 7.","Bring down the 5 to make 75. 25 × 3 = 75.","The answer is 63."]},"w":[["Dividend","The number being divided."],["Divisor","The number you divide by."],["Quotient","The answer to a division problem."]]},"g5decmul":{"t":"Multiplying & Dividing Decimals","ideas":["Multiply decimals as whole numbers, then count the decimal places in the factors.","0.3 × 0.4 = 0.12 because 3 × 4 = 12 and there are 2 decimal places.","On a hundred grid, the overlap of 0.3 and 0.4 is 12 small squares: 0.12.","To divide a decimal by a whole number, divide as usual and line up the decimal point.","Multiplying by 10, 100, or 1,000 moves digits left. Dividing moves them right."],"ex":{"q":"6 × 2.35 = ?","s":["Multiply 6 × 235 = 1,410.","2.35 has 2 decimal places.","So the product is 14.10 = 14.1."]},"w":[["Factor","A number being multiplied."],["Decimal place","A place to the right of the decimal point."],["Area model","A grid picture that shows multiplication."]]},"g5deccc":{"t":"Decimal Operations","ideas":["Add and subtract decimals by lining up the decimal points.","Multiply as whole numbers, then place the decimal point by counting decimal places.","To divide by a decimal, multiply both numbers by 10 or 100 so the divisor is a whole number.","Estimate to check: 4.9 × 3.1 should be close to 5 × 3 = 15."],"ex":{"q":"2.4 ÷ 0.6 = ?","s":["Multiply both by 10: 24 ÷ 6.","24 ÷ 6 = 4.","So 2.4 ÷ 0.6 = 4."]},"w":[["Decimal point","The dot that separates wholes from parts."],["Divisor","The number you divide by."],["Estimate","A close answer found with easier numbers."]]},"g5frac":{"t":"Fraction Operations","ideas":["To add or subtract fractions with unlike denominators, rename them with a common denominator.","Mixed numbers: add or subtract the whole numbers and the fractions.","A whole number times a fraction: 4 × 2/3 = 8/3 = 2 2/3.","Unit fraction ÷ whole number: 1/3 ÷ 4 = 1/12.","Whole number ÷ unit fraction: 4 ÷ 1/3 = 12, because each whole has 3 thirds."],"ex":{"q":"2/3 + 1/4 = ?","s":["Use 12 as a common denominator.","2/3 = 8/12 and 1/4 = 3/12.","8/12 + 3/12 = 11/12."]},"w":[["Common denominator","A shared bottom number for two fractions."],["Mixed number","A whole number and a fraction, like 2 1/4."],["Unit fraction","A fraction with 1 on top, like 1/5."]]},"g5fraccc":{"t":"Adding & Subtracting Fractions","ideas":["Rename fractions with a common denominator before adding or subtracting.","Mixed numbers: work with the whole numbers and the fractions.","Use benchmarks like 0, 1/2, and 1 to check if an answer makes sense.","Never add the denominators: 1/2 + 1/3 is not 2/5."],"ex":{"q":"Is 2/5 + 1/2 = 3/7 reasonable?","s":["2/5 + 1/2 must be more than 1/2.","3/7 is less than 1/2.","So it is not reasonable. The correct sum is 9/10."]},"w":[["Common denominator","A shared bottom number for two fractions."],["Benchmark","An easy number to compare with, like 1/2."],["Unlike denominators","Different bottom numbers."]]},"g5fracmul":{"t":"Multiplying & Dividing Fractions","ideas":["A fraction is a division: 3/4 = 3 ÷ 4.","Multiply fractions by multiplying numerators and multiplying denominators.","Multiplying by a fraction less than 1 makes a smaller product. Multiplying by a fraction greater than 1 makes a larger one.","1/3 ÷ 4 = 1/12, and 4 ÷ 1/3 = 12."],"ex":{"q":"2/3 × 3/4 = ?","s":["Multiply the numerators: 2 × 3 = 6.","Multiply the denominators: 3 × 4 = 12.","6/12 = 1/2."]},"w":[["Numerator","The top number of a fraction."],["Denominator","The bottom number of a fraction."],["Scaling","Resizing a number by multiplying."]]},"g5word":{"t":"Word Problems & Estimating","ideas":["Read carefully and decide what the question asks.","Multi-step problems: solve one step, then use that answer in the next step.","Write an equation with a letter for the unknown, like p = 312 − (18 × 12).","Use compatible numbers to estimate: 4,792 ÷ 61 is about 4,800 ÷ 60 = 80.","Think about remainders: round up when everyone needs a seat."],"ex":{"q":"310 students ride buses that hold 48 each. How many buses are needed?","s":["310 ÷ 48 = 6 R22.","6 buses are full, but 22 students still need seats.","So 7 buses are needed."]},"w":[["Equation","A number sentence with an equal sign."],["Compatible numbers","Numbers that are easy to compute with."],["Remainder","The amount left over after dividing."]]},"g5expr":{"t":"Order of Operations","ideas":["Do operations inside parentheses ( ) and brackets [ ] first, starting with the innermost ones.","Then multiply and divide from left to right.","Then add and subtract from left to right.","Parentheses change the order, so they can change the answer."],"ex":{"q":"3 × [4 + (10 − 6)] = ?","s":["Innermost first: 10 − 6 = 4.","Then the brackets: 4 + 4 = 8.","Then multiply: 3 × 8 = 24."]},"w":[["Parentheses","Symbols ( ) that show what to do first."],["Brackets","Symbols [ ] that group a larger part of an expression."],["Expression","Numbers and operations without an equal sign."]]},"g5exprcc":{"t":"Expressions","ideas":["Do operations inside grouping symbols first: parentheses ( ), then brackets [ ], then braces { }.","Then multiply and divide, then add and subtract, from left to right.","Write expressions from words: “add 8 and 7, then multiply by 2” is (8 + 7) × 2.","3 × (5,000 + 200) is 3 times as large as 5,000 + 200, without calculating."],"ex":{"q":"2 × {5 + [8 − (1 + 3)]} = ?","s":["1 + 3 = 4.","8 − 4 = 4, then 5 + 4 = 9.","2 × 9 = 18."]},"w":[["Braces","Symbols { } that group the outermost part."],["Expression","Numbers and operations without an equal sign."],["Evaluate","Find the value of an expression."]]},"g5primes":{"t":"Primes & Patterns","ideas":["A prime number has exactly two factors: 1 and itself.","A composite number has more than two factors.","Additive pattern: y = x + a (add the same number each time).","Multiplicative pattern: y = ax (multiply by the same number each time).","Test a rule on every row of a table, not just the first."],"ex":{"q":"Is 51 prime or composite?","s":["Check small factors: 51 ÷ 3 = 17.","So 51 = 3 × 17.","51 has more than two factors, so it is composite."]},"w":[["Prime","Having exactly two factors."],["Composite","Having more than two factors."],["Rule","What you do to each input to get the output."]]},"g5volume":{"t":"Volume","ideas":["Volume is the number of unit cubes that fill a solid, measured in cubic units.","V = l × w × h for a rectangular prism.","V = B × h, where B is the area of the base.","For a cube, V = s × s × s.","Volume of two boxes together: find each volume, then add."],"ex":{"q":"A box is 5 cm long, 3 cm wide, and 4 cm tall. What is its volume?","s":["Base area: 5 × 3 = 15 square cm.","There are 4 layers.","15 × 4 = 60 cubic centimeters."]},"w":[["Volume","The amount of space inside a solid."],["Cubic unit","A cube that is 1 unit on each side."],["Base","The bottom face of a prism."]]},"g5shapes":{"t":"Classifying Shapes","ideas":["Quadrilaterals have 4 sides.","Parallelograms have 2 pairs of parallel sides.","Rectangles are parallelograms with 4 right angles. Rhombuses are parallelograms with 4 equal sides.","Squares are both rectangles and rhombuses.","A shape belongs to every group above it in the hierarchy."],"ex":{"q":"Is every square a rectangle?","s":["A rectangle needs 4 right angles.","Every square has 4 right angles.","So yes, every square is a rectangle."]},"w":[["Parallel","Always the same distance apart."],["Right angle","A square corner, 90 degrees."],["Hierarchy","Groups arranged from general to specific."]]},"g5convert":{"t":"Measurement Conversions","ideas":["To change to a smaller unit, multiply. To change to a larger unit, divide.","Customary: 1 ft = 12 in., 1 yd = 3 ft, 1 mi = 5,280 ft, 1 lb = 16 oz, 1 T = 2,000 lb, 1 gal = 4 qt = 16 cups.","Metric: 1 m = 100 cm, 1 km = 1,000 m, 1 kg = 1,000 g, 1 L = 1,000 mL.","Metric conversions just move digits: 2.5 kg = 2,500 g."],"ex":{"q":"How many inches are in 4 yards?","s":["1 yard = 36 inches.","Yards are larger, so multiply.","4 × 36 = 144 inches."]},"w":[["Convert","Change from one unit to another."],["Customary units","Inches, feet, pounds, gallons, and more."],["Metric units","Meters, grams, liters, and more."]]},"g5coord":{"t":"Coordinate Plane","ideas":["The x-axis is horizontal and the y-axis is vertical. They meet at the origin, (0, 0).","An ordered pair (x, y) tells how far to move right (x), then up (y).","The x-coordinate always comes first.","Points from a rule or table can be graphed as ordered pairs."],"ex":{"q":"How do you graph (4, 7)?","s":["Start at the origin.","Move 4 units right along the x-axis.","Move 7 units up and mark the point."]},"w":[["Origin","The point (0, 0) where the axes meet."],["Ordered pair","Two numbers (x, y) that name a point."],["Axis","One of the two number lines on a coordinate plane."]]},"g5coordcc":{"t":"Coordinate Plane & Patterns","ideas":["An ordered pair (x, y) means move right x, then up y, from the origin.","Two patterns can be compared term by term.","If Pattern A adds 3 and Pattern B adds 6, each term in B is 2 times the matching term in A.","Matching terms from two patterns make ordered pairs you can graph."],"ex":{"q":"A: 0, 2, 4, 6. B: 0, 6, 12, 18. What is the relationship?","s":["Compare 2 and 6, 4 and 12, 6 and 18.","Each B term is 3 times the A term.","The ordered pairs are (0, 0), (2, 6), (4, 12), (6, 18)."]},"w":[["Ordered pair","Two numbers (x, y) that name a point."],["Term","One number in a pattern."],["Origin","The point (0, 0)."]]},"g5data":{"t":"Data: Graphs & Plots","ideas":["Bar graphs and frequency tables show categories, like favorite sports.","Dot plots and stem-and-leaf plots show number data, including decimals and fractions.","Scatterplots show pairs of data, like day and plant height.","Read the scale carefully, then add or subtract to answer two-step questions."],"ex":{"q":"Soccer has 12 votes, Swim has 8, and Track has 5. How many more chose Soccer or Swim than Track?","s":["Soccer and Swim: 12 + 8 = 20.","Subtract Track: 20 − 5 = 15.","15 more students."]},"w":[["Bar graph","A graph that uses bars to compare categories."],["Scatterplot","A graph of points that shows paired data."],["Frequency","How many times something happens."]]},"g5datacc":{"t":"Line Plots","ideas":["A line plot shows data as marks above a number line.","Line plots can use fractions like 1/8, 1/4, and 1/2.","Add the measurements to find a total. Multiply when several marks have the same value.","To share a total equally, divide it by the number of items."],"ex":{"q":"Three beakers hold 1/4, 1/2, and 3/4 liter. Shared equally, how much is in each?","s":["Total: 1/4 + 1/2 + 3/4 = 6/4 liters.","Share among 3: 6/4 ÷ 3 = 2/4.","Each beaker holds 1/2 liter."]},"w":[["Line plot","Marks above a number line that show data."],["Total","The sum of all the values."],["Equal share","The same amount for each."]]},"g5money":{"t":"Money Sense","ideas":["Income tax is paid on what people earn. Payroll tax comes out of paychecks for Social Security and Medicare. Sales tax is added to purchases. Property tax is paid on land and buildings.","Gross income is total pay. Net income is what is left after taxes and deductions.","Debit cards take money from your account now. Credit cards borrow money that must be paid back, sometimes with interest.","Keep records of income and spending.","To balance a budget, cut expenses or increase income."],"ex":{"q":"Gross pay is $1,500. Taxes of $210 are taken out. What is the net pay?","s":["Net pay = gross pay − deductions.","$1,500 − $210 = $1,290.","The net pay is $1,290."]},"w":[["Gross income","Total pay before taxes."],["Net income","Pay after taxes and deductions."],["Budget","A plan for earning and spending money."]]},"s5a":{"t":"Thinking Like a Scientist","ideas":["Ask a question you can test, then make a prediction.","In a fair test, change only one variable and keep everything else the same.","A control group is not changed, so you can compare results with it.","Measure carefully, repeat trials, and record data in tables and graphs.","Base conclusions on evidence, and share results so others can check them."],"ex":{"q":"Does the amount of salt change how fast ice melts?","s":["Change only the amount of salt.","Use the same size ice cubes, cups, and room temperature.","Time how long each cube takes to melt, and repeat each test 3 times."]},"w":[["Variable","Something that can change in an investigation."],["Control group","The group that is not changed, used for comparing."],["Evidence","Data or observations that support a claim."]]},"s5b":{"t":"Properties of Matter","ideas":["Matter can be described by mass, volume, magnetism, relative density, and physical state.","Solubility tells whether a substance dissolves in water, like salt or sugar.","Conductors let thermal energy or electricity flow easily. Metals are good conductors.","Insulators slow the flow of thermal energy or electricity. Plastic, wood, rubber, and foam are insulators.","Objects less dense than water float, and objects more dense than water sink."],"ex":{"q":"Why is a pot made of metal but its handle made of wood?","s":["Metal conducts heat from the stove to the food.","Wood is an insulator.","The handle stays cool enough to hold."]},"w":[["Solubility","How well a substance dissolves."],["Conductor","A material that lets energy flow through it easily."],["Relative density","Whether an object sinks or floats compared to water."]]},"s5c":{"t":"Mixtures, Solutions, and Particles","ideas":["In a mixture, each substance keeps its own properties, like iron filings and sand.","Mixtures can be separated with magnets, filters, sieves, or evaporation.","In a solution, one substance dissolves evenly into another, like salt in water.","Matter is conserved: the mass of a solution equals the masses of its parts.","All matter is made of particles too small to see, like the air in a balloon."],"ex":{"q":"100 g of water and 10 g of salt are mixed. What is the mass of the solution?","s":["The salt dissolves, but it is still there.","Add the masses: 100 g + 10 g.","The solution has a mass of 110 g."]},"w":[["Mixture","Substances combined that keep their own properties."],["Solution","A mixture in which a substance dissolves evenly."],["Particle","A tiny piece of matter too small to see."]]},"s5d":{"t":"Forces and Motion","ideas":["Balanced forces are equal and opposite. They do not change an object’s motion.","Unbalanced forces change motion: an object can start, stop, speed up, slow down, or turn.","The net force is the difference between opposite forces, in the direction of the stronger force.","Forces can transfer energy, like a bat hitting a ball.","In an experiment, test one variable, like ramp height, and keep everything else the same."],"ex":{"q":"A box is pushed right with 50 N and left with 30 N. What happens?","s":["The forces are unbalanced.","Net force: 50 − 30 = 20 N to the right.","The box moves to the right."]},"w":[["Balanced forces","Equal forces in opposite directions."],["Unbalanced forces","Forces that change an object’s motion."],["Newton","The unit used to measure force."]]},"s5e":{"t":"Energy Transformations","ideas":["Energy changes from one form to another, but the total amount stays the same.","A flashlight: chemical energy (battery) → electrical energy → light energy.","Devices change electrical energy into light, sound, heat, or motion.","Living things change the chemical energy in food into motion and heat.","The energy in food first came from the Sun."],"ex":{"q":"What energy changes happen in a wind turbine?","s":["Moving air has mechanical energy.","The spinning blades turn a generator.","The generator makes electrical energy."]},"w":[["Energy transformation","A change of energy from one form to another."],["Chemical energy","Energy stored in substances like food, fuel, and batteries."],["Mechanical energy","Energy of motion or position."]]},"s5f":{"t":"Electric Circuits","ideas":["A circuit needs an energy source, wires, and a complete (closed) path.","An open circuit has a gap, so current stops.","Switches open and close a circuit.","Electrical energy can change into motion (motor), light (bulb), sound (buzzer), or heat (heater).","Conductors like metal let current flow. Insulators like rubber block it."],"ex":{"q":"A bulb won’t light. What should you check?","s":["Make sure every wire is connected, so there are no gaps.","Make sure the switch is closed.","Check that the battery and bulb work."]},"w":[["Circuit","A closed path that electricity flows through."],["Current","The flow of electricity."],["Switch","A part that opens or closes a circuit."]]},"s5g":{"t":"Light","ideas":["Light travels in straight lines, which is why shadows form.","Reflection is light bouncing off a surface, like a mirror.","Refraction is light bending as it moves from one material into another, like air to water.","Absorption is when an object takes in light, which usually warms it up.","We see objects when light from them enters our eyes."],"ex":{"q":"Why does a spoon in water look bent?","s":["Light travels from the water into the air.","It bends (refracts) as it changes materials.","So the spoon looks broken at the water line."]},"w":[["Reflect","To bounce off a surface."],["Refract","To bend when passing into a new material."],["Absorb","To take in light or energy."]]},"s5h":{"t":"Earth’s Rotation and Shadows","ideas":["Earth rotates on its axis about once every 24 hours.","Rotation causes day and night.","Because Earth rotates west to east, the Sun appears to rise in the east and set in the west.","Shadows point away from the Sun. They are long in the morning and evening and shortest near noon.","In Texas, noon shadows point north."],"ex":{"q":"In the morning the Sun is in the east. Which way do shadows point?","s":["Shadows point away from the Sun.","Away from east is west.","Morning shadows point west, and they are long."]},"w":[["Rotation","Spinning on an axis."],["Axis","An imaginary line through Earth from pole to pole."],["Shadow","A dark area where an object blocks light."]]},"s5i":{"t":"Sun, Ocean, and Weather","ideas":["The Sun’s energy drives the water cycle.","Most evaporation happens over the oceans.","Water vapor cools and condenses into clouds, then falls as precipitation.","Warm ocean water gives hurricanes energy and moisture.","Moist air from the Gulf of Mexico brings humidity and rain to Texas, and the ocean keeps coastal temperatures milder."],"ex":{"q":"How does the Gulf of Mexico affect rain in Houston?","s":["The Sun warms the Gulf, and water evaporates.","Wind carries the moist air inland.","The air cools, clouds form, and rain falls."]},"w":[["Evaporation","Liquid water changing into a gas."],["Condensation","Water vapor changing into liquid drops."],["Humidity","The amount of water vapor in the air."]]},"s5j":{"t":"Sedimentary Rocks and Fossil Fuels","ideas":["Weathering breaks rock into sediment, and erosion moves it.","Sediment settles in layers, usually in water.","Over a long time, pressure and natural cement harden the layers into sedimentary rock.","Lower layers are usually older than the layers above them.","Fossil fuels formed from buried remains of living things: coal from swamp plants, and oil and gas from tiny sea life."],"ex":{"q":"How does sandstone form?","s":["Sand is carried by water or wind and settles in layers.","More layers pile on top and press down.","Minerals cement the sand grains into rock."]},"w":[["Sediment","Small pieces of rock, sand, mud, and remains of living things."],["Sedimentary rock","Rock made from layers of sediment pressed together."],["Fossil fuel","A fuel made from remains of ancient living things."]]},"s5k":{"t":"Landforms","ideas":["Wind, water, and ice change Earth’s surface and form landforms.","Rivers erode rock and carve canyons, like Palo Duro Canyon.","Rivers deposit sediment where they slow down, building deltas.","Wind piles sand into dunes, like at Monahans Sandhills.","Glaciers carve U-shaped valleys and leave rocks behind when they melt."],"ex":{"q":"How did the Mississippi River delta form?","s":["The river carries sediment downstream.","Where it meets the Gulf of Mexico, the water slows.","The river drops its sediment, building land."]},"w":[["Delta","Land built where a river drops sediment at its mouth."],["Canyon","A deep valley carved by running water."],["Sand dune","A hill of sand piled up by wind."]]},"s5l":{"t":"Protecting Natural Resources","ideas":["Conservation means using resources wisely so they last.","Reduce, reuse, and recycle to cut waste.","Dispose of batteries, oil, and chemicals properly so they don’t pollute land and water.","Engineers design solutions like rain barrels, insulation, and solar panels.","Choices like biking or turning off lights reduce pollution."],"ex":{"q":"How can a school save water?","s":["Fix leaky faucets.","Water plants in the cool morning.","Collect rainwater for the garden."]},"w":[["Conservation","Using resources wisely so they last."],["Recycle","To turn used materials into new products."],["Proper disposal","Throwing things away in a safe way."]]},"s5m":{"t":"Ecosystems and Food Webs","ideas":["Organisms survive by interacting with biotic (living) and abiotic (nonliving) factors.","Energy flows from the Sun to producers to consumers.","Decomposers return nutrients to the soil, so matter cycles.","A change to one part of a food web affects other parts.","Human activities can harm ecosystems (pollution, habitat loss) or help them (planting native plants, protecting land)."],"ex":{"q":"Grass → grasshopper → frog → snake. What happens if the frogs disappear?","s":["Snakes lose a food source, so their numbers may drop.","Grasshoppers have fewer predators, so their numbers may grow.","More grasshoppers may eat more grass."]},"w":[["Biotic","Living parts of an ecosystem."],["Abiotic","Nonliving parts of an ecosystem."],["Food web","Connected food chains in an ecosystem."]]},"s5n":{"t":"Structures and Behaviors","ideas":["Structures help organisms survive, like gills, webbed feet, talons, and deep roots.","Different species in the same environment survive in different ways.","Instincts are behaviors animals are born with, like sea turtle hatchlings heading to the ocean.","Learned behaviors come from experience or watching others, like orcas hunting in groups.","Both kinds of behavior help animals survive."],"ex":{"q":"Is a spider spinning a web an instinct or learned?","s":["Spiders are not taught how to spin webs.","They do it the right way the first time.","So it is an instinct."]},"w":[["Structure","A part of a living thing."],["Instinct","A behavior an animal is born with."],["Learned behavior","A behavior that comes from experience."]]},"n5matter":{"t":"Matter and Its Interactions","ideas":["All matter is made of particles too small to see.","Mixing can make a new substance. Signs include gas bubbles, color changes, and temperature changes.","In a closed container, the total mass stays the same during any change.","Properties like solubility, magnetism, and conductivity help identify materials."],"ex":{"q":"Baking soda and vinegar react in a sealed bag. What happens to the mass?","s":["Bubbles of gas form, so a new substance was made.","The bag is sealed, so no matter escapes.","The total mass stays the same."]},"w":[["Particle","A tiny piece of matter."],["Chemical change","A change that makes a new substance."],["Conservation of matter","Matter is not created or destroyed."]]},"n5ecosystems":{"t":"Energy and Matter in Ecosystems","ideas":["The energy in food first came from the Sun.","Plants get the materials they grow from mainly from air and water.","Animals use food energy to grow, move, repair their bodies, and stay warm.","Matter moves among plants, animals, decomposers, and the environment."],"ex":{"q":"Where did the mass of a huge tree come from?","s":["The tree took in carbon dioxide from the air.","It took in water through its roots.","It used sunlight to turn them into food that built its body."]},"w":[["Producer","A living thing that makes its own food."],["Decomposer","A living thing that breaks down dead matter."],["Matter cycle","The movement of matter through an ecosystem."]]},"n5space":{"t":"Gravity, Stars, and Shadows","ideas":["Earth’s gravity pulls objects toward its center.","The Sun looks brighter than other stars because it is much closer.","Earth’s rotation causes day and night and changing shadows.","Different constellations are visible in different seasons as Earth orbits the Sun."],"ex":{"q":"Why do stars look so small and dim?","s":["Stars are huge balls of glowing gas.","Most are very, very far away.","Distance makes them look like function buildRound(s,t){
  const L=topicList(s),chs=t==='all'?L:L.filter(c=>c.id===t);
  if(s==='math'){const pool=[];chs.forEach(c=>partsOf(c).forEach(m=>pool.push([c,m])));const out=[],seen=new Set();let guard=0;
    while(out.length<ROUND&&guard<200){guard++;const [c,m]=pick(pool);const q=finishMath(m.g());if(seen.has(q.q+q.a))continue;seen.add(q.q+q.a);q.topic=c.nm;q.tid=m.id;out.push(q)}return out}
  const its=c=>c.items||c.qs.map(x=>({x,tid:c.id}));let all=[];const dup=new Set();
  chs.forEach(c=>its(c).forEach(o=>{const k=o.x[0]+'|'+o.x[1];if(dup.has(k))return;dup.add(k);all.push({q:o.x[0],a:o.x[1],choices:shuffle([o.x[1],...o.x[2]]),e:o.x[3],tid:o.tid,topic:`${c.ch}: ${c.nm}`})}));
  const seen=SEEN;
  const key=x=>x.q+'|'+x.a;
  let fresh=shuffle(all.filter(x=>!seen[key(x)])),used=shuffle(all.filter(x=>seen[key(x)]));
  if(fresh.length<ROUND){all.forEach(x=>delete seen[key(x)])}
  const out=fresh.concat(used).slice(0,ROUND);out.forEach(x=>seen[key(x)]=1);
  return shuffle(out);
}

function speak(t,btn){try{const ss=window.speechSynthesis;if(!ss)return;
  if(btn&&speakBtn===btn){stopSpeech();return}

  const u=new SpeechSynthesisUtterance(t.replace(/²/g,' to the 2nd power').replace(/³/g,' to the 3rd power').replace(/¹/g,' to the 1st power').replace(/→/g,', then ').replace(/−/g,' minus ').replace(/×/g,' times ').replace(/÷/g,' divided by '));u.rate=.8;u.lang='en-US';
  curU=u;u.onend=u.onerror=()=>{if(curU===u){curU=null;resetSpeakBtn()}};

function board(){
  strokes=[];

  function size(){const r=wrap.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);redraw()}
  function seg(s,from){ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.strokeStyle=s.erase?'#000':css(s.c);ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();const p=s.pts;if(p.length===1){ctx.arc(p[0][0],p[0][1],s.w/2,0,Math.PI*2);ctx.fillStyle=ctx.strokeStyle;ctx.fill();return}
    ctx.moveTo(p[from][0],p[from][1]);for(let i=from+1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.stroke()}
  function redraw(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();strokes.forEach(s=>seg(s,0));ctx.globalCompositeOperation='source-over';hint.hidden=strokes.length>0}
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};

  cv.onpointermove=e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs)cur.pts.push(pos(ev));seg(cur,Math.max(0,cur.pts.length-evs.length-1))};
  const end=()=>{cur=null;ctx.globalCompositeOperation='source-over'};cv.onpointerup=end;cv.onpointercancel=end;cv.onpointerleave=e=>{if(e.buttons===0)end()};
  app.querySelectorAll('.marker').forEach(m=>m.onclick=()=>{color=m.dataset.k;erase=false;upd()});

  pn.onclick=()=>{pencilOnly=!pencilOnly;if(player){player.pencil=pencilOnly;savePlayer()}else{guest.pencil=pencilOnly;try{localStorage.setItem('studyboard-pencil',pencilOnly?'1':'0')}catch(e){}}pu()};

function tone(c,f,t0,dur,type,vol,to){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.05)}
function sfxRight(small){if(!soundOn)return;const c=ac();if(!c)return;const t=c.currentTime+0.02;
  const notes=[523.25,659.25,783.99,1046.5];

  og.gain.setValueAtTime(del?0.09:0.07,t);og.gain.exponentialRampToValueAtTime(0.0001,t+0.03);o.connect(og);og.connect(c.destination);o.start(t);o.stop(t+0.04)}
