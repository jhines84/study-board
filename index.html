const S5=[{"id":"s5a","ch":"TEKS 5.1–5.5","nm":"Thinking Like a Scientist","qs":[["A student tests whether the height of a ramp changes how far a toy car rolls. What should she change on purpose?","Only the height of the ramp",["The car and the floor each time","Everything at once","Nothing at all"],"In a fair test, you change only the one thing you are testing."],["In the ramp test, what should the student measure?","How far the car rolls",["The color of the car","How tall the student is","The size of the classroom"],"She measures the result: the distance the car rolls."],["Why does a fair test keep all the other conditions the same?","So any difference in the results comes from the one thing that was changed",["So the test takes less time","So the results always match the prediction","So no data needs to be recorded"],"If only one thing changes, you know that thing caused the difference."],["Some plants get fertilizer and some do not, so the two groups can be compared. What is the group with no fertilizer called?","The control group",["The prediction","The conclusion","The hypothesis"],"A control group is left unchanged so you can compare it with the group you tested."],["A student tests how the amount of salt affects how fast ice melts. Which variable does she change on purpose?","The amount of salt",["How fast the ice melts","The size of the room","The time of day"],"The variable you change on purpose is the amount of salt. The melting time is what you measure."],["In the salt and ice test, which variable does the student measure?","How fast the ice melts",["The amount of salt","The brand of the cups","The color of the table"],"She measures how long the ice takes to melt."],["Which tool measures force in newtons?","A spring scale",["A thermometer","A graduated cylinder","A hand lens"],"A spring scale stretches when you pull it and shows force in newtons."],["A student puts a rock into a graduated cylinder of water, and the water rises from 50 mL to 65 mL. What is the rock’s volume?","15 mL",["50 mL","65 mL","115 mL"],"The water rises by the rock’s volume: 65 − 50 = 15 mL."],["A student measures an object’s mass three times and gets 52 g, 51 g, and 52 g. What does this show?","Her measurements are consistent",["The balance is broken","The object keeps changing size","She should guess instead of measuring"],"Measurements that are close every time are reliable."],["Which graph is best for showing how the temperature changed every hour during a day?","A line graph",["A pie chart","A map","A Venn diagram"],"Line graphs show how something changes over time."],["Which graphic organizer is best for showing how two things are alike and different?","A Venn diagram",["A line graph","A thermometer","A list of materials"],"A Venn diagram uses two circles. The overlap shows what is the same."],["A student’s results are 5, 6, 5, 40, and 6. What should she do about the 40?","Check whether it was a mistake and repeat that trial",["Change it to 6 without checking","Use only the 40","Throw away all the data"],"An unusual result might be an error. Repeating the trial helps find out."],["What is one limitation of a solar system model made of foam balls?","The sizes and distances are not to scale",["It shows the Sun in the center","It shows the planets in order","It helps you learn the planet names"],"Space is so huge that most models can’t show real sizes and distances."],["Engineers test a prototype bridge, and it bends too much. What should they do next?","Use the results to improve the design and test again",["Hide the results","Give up on the bridge","Build the same design again"],"Engineers improve a design based on test results."],["In an engineering challenge, what are criteria?","The goals a solution must meet",["The materials left over","The mistakes that were made","The names of the engineers"],"Criteria describe what a successful design must do, like hold 500 grams."],["Which statement is a claim that can be tested with evidence?","Plants grow taller with more sunlight.",["Plants are the prettiest living things.","Science is boring.","Blue is the best color."],"A testable claim can be checked with measurements."],["A student says, “If I give a plant more water, then it will grow taller.” What is this statement?","A prediction",["A conclusion","A data table","A measurement"],"A prediction tells what you think will happen before you test it."],["A toy car travels 2 m on carpet, 5 m on wood, and 8 m on tile. What pattern does the data show?","The smoother the surface, the farther the car travels",["The rougher the surface, the farther the car travels","The car always travels the same distance","Surfaces do not affect the car"],"Smoother surfaces have less friction, so the car goes farther."],["Why do scientists repeat an experiment several times?","To make sure their results are reliable",["To use up materials","To change their question","To make the test take longer"],"Similar results each time mean the results can be trusted."],["Why do scientists share their results with other scientists?","So others can review and repeat the work",["So no one can check it","To keep the results secret","Because results never matter"],"Sharing lets others test the work and build on it."],["Which piece of safety equipment protects your eyes during an investigation?","Safety goggles",["An apron","A hand lens","Gloves"],"Goggles protect your eyes from splashes and flying pieces."],["A meteorologist is a scientist who studies…","Weather",["Rocks","Stars","Insects"],"Meteorologists study and forecast the weather."],["Which invention helps doctors see inside the body without surgery?","X-ray machines",["Paper clips","Rubber bands","Pencils"],"X-rays let doctors look at bones and organs."],["Why do scientists use metric units like grams and meters?","Scientists around the world use the same units",["Metric units are always bigger","Metric units are only for liquids","Metric units never change"],"Using the same units lets scientists everywhere compare results."],["A student’s data shows that plants given more light grew taller. What should her conclusion be based on?","The data she collected",["What her friend guessed","Her favorite plant","The title of the project"],"Conclusions must be supported by evidence from the data."]]},{"id":"s5b","ch":"TEKS 5.6A","nm":"Properties of Matter","qs":[["Which property tells how much space an object takes up?","Volume",["Mass","Magnetism","Solubility"],"Volume is the amount of space something takes up."],["What is solubility?","How well a substance dissolves in a liquid such as water",["How heavy a substance is","How well a substance floats","How hot a substance gets"],"A soluble substance dissolves, like sugar in water."],["Which substance is soluble in water?","Salt",["Sand","Pebbles","Iron filings"],"Salt dissolves in water. Sand, pebbles, and iron filings do not."],["Which substance is NOT soluble in water?","Sand",["Sugar","Salt","Drink mix powder"],"Sand settles to the bottom instead of dissolving."],["Which material is a good conductor of electricity?","Copper",["Rubber","Plastic","Wood"],"Metals like copper let electricity flow easily."],["Which material is a good insulator of thermal energy?","Foam",["Aluminum","Copper","Iron"],"Foam slows the flow of heat, so it keeps things hot or cold."],["A ball floats in water. What does this tell you about its relative density?","It is less dense than water",["It is more dense than water","It has no mass","It is magnetic"],"Objects that float are less dense than water."],["A rock sinks in water. Compared to water, the rock is…","More dense",["Less dense","The same density","Not made of matter"],"Objects that sink are more dense than water."],["Which tool measures the volume of a liquid?","A graduated cylinder",["A balance","A spring scale","A hand lens"],"A graduated cylinder has milliliter marks for measuring liquid volume."],["Two blocks are the same size. Block A has more mass than block B. Which statement is true?","Block A is more dense",["Block B is more dense","They have the same density","Block A has less matter"],"More mass packed into the same volume means greater density."],["Which object would a magnet attract?","A steel paper clip",["An aluminum can","A copper penny","A glass marble"],"Magnets attract iron and steel. Aluminum, copper, and glass are not magnetic."],["Which property can be measured with a balance?","Mass",["Volume","Temperature","Magnetism"],"A balance measures mass in grams."],["Which describes a liquid?","It has a definite volume but takes the shape of its container",["It has a definite shape and volume","It has no definite shape or volume","It is always a metal"],"Liquids flow to fit their container but keep the same volume."],["Which describes a gas?","It has no definite shape or volume",["It has a definite shape","It has a definite volume only","It cannot move"],"A gas spreads out to fill whatever container it is in."],["A metal spoon and a plastic spoon sit in hot soup. Which handle gets hot faster?","The metal spoon",["The plastic spoon","They heat up the same","Neither gets hot"],"Metal conducts thermal energy better than plastic."],["Why are electrical wires made of copper covered in plastic?","Copper conducts electricity, and plastic insulates it",["Plastic conducts electricity better","Copper keeps the wire cold","Plastic makes the wire magnetic"],"The copper carries the current, and the plastic keeps it from reaching you."],["Which objects would a magnet attract: a steel nail, a rubber eraser, a steel paper clip, or a copper penny?","The nail and the paper clip",["The eraser and the penny","All four objects","Only the penny"],"Steel contains iron, so magnets attract it."],["Ice floats in a glass of water. What does this show?","Ice is less dense than liquid water",["Ice is more dense than liquid water","Ice has no mass","Ice is a gas"],"Ice is one of the few solids that floats on its own liquid."],["Which property describes whether matter is a solid, a liquid, or a gas?","Physical state",["Magnetism","Solubility","Conductivity"],"Solid, liquid, and gas are physical states of matter."],["Which container would keep soup hot the longest?","An insulated, foam-lined container with a lid",["A thin metal bowl","An open paper plate","A thin glass cup"],"Insulators slow the loss of heat."],["Which object has the greatest volume?","A basketball",["A marble","A golf ball","A grape"],"The basketball takes up the most space."],["A steel paper clip and a plastic paper clip are the same size and shape. Which property is different?","Magnetism",["Volume","Shape","Physical state"],"Only the steel clip is attracted to a magnet."],["Which material is best for the handle of a frying pan?","Wood",["Copper","Aluminum","Iron"],"Wood is an insulator, so the handle stays cool enough to hold."],["Oil floats on water, and a rock sinks in water. Which list goes from least dense to most dense?","Oil, water, rock",["Rock, water, oil","Water, oil, rock","Oil, rock, water"],"Oil floats on water, so it is less dense. The rock sinks, so it is more dense."],["A student wants to sort objects into conductors and insulators of electricity. Which tool is most useful?","A simple circuit with a battery and a bulb",["A balance","A magnet","A thermometer"],"If the bulb lights when an object closes the circuit, the object is a conductor."]]},{"id":"s5c","ch":"TEKS 5.6B–D","nm":"Mixtures, Solutions, and Particles","qs":[["Iron filings and sand are mixed together. How can you separate them?","Pull out the iron filings with a magnet",["Pour the mixture through a filter","Add water and stir","Heat the mixture"],"The iron filings are still magnetic in the mixture."],["Why can a magnet separate iron filings from sand?","The iron filings keep their magnetic property in the mixture",["The sand becomes magnetic","Mixing makes a new substance","The magnet melts the sand"],"In a mixture, each substance keeps its own properties."],["Sand and water are mixed, and after a while the sand sinks to the bottom. What does this show?","The sand kept its own properties in the mixture",["The sand dissolved","The sand turned into water","The water turned into sand"],"Sand does not dissolve, so it settles out."],["What is the best way to separate sand from water?","Pour it through a filter",["Use a magnet","Add more water","Shake it"],"The filter catches the sand and lets the water through."],["Which describes a mixture?","Two or more substances combined that each keep their own properties",["One substance that cannot be separated","A new substance with new properties","Matter that has no mass"],"Mixtures can be separated because each part stays the same."],["Trail mix has nuts, raisins, and seeds. Why is it a mixture?","Each part keeps its own properties and can be separated",["All the parts turned into one new food","It is only one kind of matter","It cannot be separated"],"You can still see and pick out each part."],["Which tool would best separate marbles from sand?","A sieve (a screen with small holes)",["A magnet","A thermometer","A hand lens"],"The sand falls through the holes, and the marbles stay on top."],["Salt and pepper are mixed together. What happens to the properties of the salt?","They stay the same",["The salt turns into pepper","The salt becomes magnetic","The salt disappears"],"In a mixture, the salt is still salt."],["Which mixture could be separated with a magnet?","Steel paper clips and rice",["Salt and sugar","Sand and pebbles","Water and juice"],"Steel is magnetic. Rice is not."],["Salt dissolves in water and forms a solution. Which property of the salt seems to change?","You can no longer see the salt grains",["The salt loses its mass","The salt becomes magnetic","The salt turns into water"],"The salt breaks into particles too small to see, but it is still there."],["A student dissolves 20 g of sugar in 200 g of water. What is the mass of the solution?","220 g",["200 g","180 g","20 g"],"Matter is conserved: 200 g + 20 g = 220 g."],["How can you show that salt is still in the water after it dissolves?","Let the water evaporate and look for salt left behind",["Pour it through a filter","Use a magnet","Shake it"],"When the water evaporates, the salt crystals are left."],["Which is a solution?","Sugar dissolved in tea",["Sand in water","Rocks in a bucket","Oil floating on water"],"In a solution, one substance dissolves evenly in another."],["What happens to the total mass when a solution forms?","It equals the masses of the parts added together",["It becomes zero","It doubles","It gets smaller because the solid disappears"],"No matter is lost or added when something dissolves."],["A student measures 100 g of water and 15 g of salt, then mixes them. The solution has a mass of 115 g. What does this show?","Matter is conserved in solutions",["Salt has no mass","Water loses mass","Mixing creates new matter"],"The total mass stays the same after mixing."],["Lemon juice is stirred into a glass of water. What can you observe?","The water looks pale yellow and smells like lemon",["The water turns into a solid","The water disappears","The glass becomes magnetic"],"The lemon juice mixes evenly into the water."],["Before mixing, water is clear and powdered drink mix is a dry solid. After it dissolves, how is the water different?","It has color and more mass",["It has less mass","It is now a solid","It is now magnetic"],"The dissolved drink mix adds color and its mass to the water."],["Which happens when sugar dissolves in water?","The sugar breaks into particles too small to see",["The sugar turns into air","The sugar is destroyed","The sugar becomes sand"],"The sugar is still there, spread evenly through the water."],["What is all matter made of?","Tiny particles too small to see",["Water","Air only","Nothing at all"],"All matter is made of particles far too small to see."],["When you blow up a balloon, what fills it?","Particles of air",["Nothing","Water","Light"],"Air is matter made of particles. They fill the balloon."],["Why does a balloon get bigger when you blow more air into it?","More air particles take up more space inside it",["The balloon makes new air","Air has no mass","The rubber turns into air"],"Adding particles of air takes up more space."],["You can smell cookies baking from another room. What does this show?","Tiny particles from the cookies move through the air",["Smells travel through walls as light","Cookies make sound","Air has no particles"],"Particles spread out through the air and reach your nose."],["Why can’t you see the particles that make up air?","They are too small to see",["Air has no particles","The particles are hiding","Air is not matter"],"Particles of matter are much too small for our eyes."],["A sealed plastic bag of air is squeezed. What happens to the air particles?","They are pushed closer together",["They disappear","They turn into water","They get larger"],"Gas particles have space between them, so they can be squeezed closer."],["Which shows that air is matter?","A ball pumped full of air has more mass than the same ball when it is flat",["Air is invisible","Air feels cold","Wind can blow"],"Air has mass and takes up space, so it is matter."]]},{"id":"s5d","ch":"TEKS 5.7","nm":"Forces and Motion","qs":[["Two teams pull on a rope with equal force in opposite directions. What happens?","The rope does not move",["The rope moves toward the left team","The rope moves toward the right team","The rope breaks right away"],"Equal forces in opposite directions are balanced, so the motion does not change."],["Equal forces push on an object from opposite sides. What are these forces called?","Balanced forces",["Unbalanced forces","Magnetic forces","Gravity only"],"Balanced forces cancel each other out."],["Which kind of forces can make an object start moving, stop, speed up, or change direction?","Unbalanced forces",["Balanced forces","No forces","Only magnetic forces"],"When forces are unequal, the object’s motion changes."],["A book is resting on a table. Which describes the forces on it?","The forces are balanced, so the book does not move",["There are no forces on it","The forces are unbalanced","Only gravity acts on it"],"Gravity pulls down and the table pushes up with an equal force."],["In a tug-of-war, the red team pulls with 300 newtons and the blue team pulls with 250 newtons in the opposite direction. What happens?","The rope moves toward the red team",["The rope moves toward the blue team","The rope stays still","The rope moves up"],"The forces are unbalanced, so the rope moves toward the stronger pull."],["The red team pulls with 300 newtons and the blue team pulls with 250 newtons in the opposite direction. What is the net force?","50 newtons toward the red team",["550 newtons toward the red team","50 newtons toward the blue team","0 newtons"],"Subtract the opposite forces: 300 − 250 = 50 newtons, toward the stronger side."],["A soccer ball is rolling. A player kicks it from the side. What happens?","It changes direction",["It stops forever","Nothing changes","It rolls backward on the same path"],"An unbalanced force from the side changes the ball’s direction."],["A hockey puck slides across ice and slowly stops. Which force is unbalanced?","Friction acting against its motion",["Magnetism pulling it forward","Gravity pushing it forward","No force at all"],"Friction from the ice slowly stops the puck."],["Two students push a box from opposite sides, each with 40 newtons. What happens to the box?","It stays still",["It moves left","It moves right","It flies up"],"Equal opposite forces are balanced."],["A student pushes a box to the right with 60 newtons. Friction pushes left with 20 newtons. What happens?","The box moves to the right",["The box moves to the left","The box stays still","The box moves up"],"The push is greater than friction, so the forces are unbalanced to the right."],["Balanced forces act on an object. What happens to its motion?","Its motion does not change",["It always speeds up","It always stops","It always changes direction"],"Balanced forces do not change an object’s motion."],["When a bat hits a baseball, what does the force from the bat do?","Transfers energy to the ball and changes its motion",["Takes energy away from the ball","Makes the ball lighter","Has no effect"],"A force can transfer energy and change speed and direction."],["Which shows unbalanced forces?","A ball rolling faster and faster down a hill",["A lamp sitting on a desk","A picture hanging still on a wall","A car parked on flat ground"],"The ball’s speed is changing, so the forces are unbalanced."],["A student pushes the same ball harder. What will most likely happen?","It moves faster and farther",["It moves slower","It does not move","It moves the same as before"],"A larger force transfers more energy to the ball."],["A ball is thrown straight up. Why does it slow down and fall back?","Gravity pulls it down",["Air pushes it up","Magnetism pulls it","There is no force on it"],"Gravity is an unbalanced force pulling the ball toward Earth."],["A wagon is pulled forward with 30 newtons and backward with 30 newtons. The wagon was already rolling. What happens?","It keeps rolling at the same speed",["It speeds up","It moves backward","It stops instantly"],"Balanced forces do not change motion, so it keeps moving the same way."],["A student tests how ramp height affects how far a car rolls. What should stay the same each time?","The car, the release point, and the floor surface",["The ramp height","Nothing","The results"],"Only the ramp height should change."],["A student tests whether a bigger balloon makes a balloon rocket travel farther on a string. What should she change?","How much air is in the balloon",["The length of the string each time","The type of tape each time","Everything at once"],"The amount of air is the one variable she is testing."],["In the balloon rocket test, what should the student measure?","How far the rocket travels along the string",["The color of the balloon","How loud the balloon is","How tall the student is"],"Distance traveled is the result of the test."],["Why should the student test each balloon size three times?","To make sure the results are reliable",["To pop more balloons","To change the question","To make the test shorter"],"Repeated trials show whether results are consistent."],["What pushes a balloon rocket forward along the string?","Air rushing out the back of the balloon",["The string pulling it","Gravity pushing it sideways","A magnet in the balloon"],"As air rushes out one way, the balloon is pushed the other way."],["A car rolls 30 cm from a low ramp and 90 cm from a high ramp. What can the student conclude?","A higher ramp gives the car more energy, so it rolls farther",["Ramp height does not matter","Lower ramps make cars go faster","The car is broken"],"Starting higher gives the car more energy."],["How could a student test the effect of friction on a car rolling down a ramp?","Cover the ramp with different materials, like carpet, wood, and sandpaper",["Use a different car each time","Change the ramp height each time","Paint the car different colors"],"Changing the surface changes the friction while everything else stays the same."],["Which tool best measures how far a toy car rolls?","A meter stick or measuring tape",["A thermometer","A balance","A graduated cylinder"],"Distance is measured with a meter stick or tape."],["A student pushes a toy car with a small force and then with a large force. What pattern will she most likely see?","The larger force makes the car go farther",["The smaller force makes the car go farther","The car goes the same distance","The car will not move with either force"],"More force transfers more energy to the car."]]},{"id":"s5e","ch":"TEKS 5.8A","nm":"Energy Transformations","qs":[["In a flashlight, which energy changes happen?","Chemical energy → electrical energy → light energy",["Light energy → chemical energy → sound energy","Sound energy → light energy","Thermal energy → chemical energy"],"The battery’s chemical energy becomes electrical energy, which the bulb changes into light."],["A battery stores energy as…","Chemical energy",["Sound energy","Light energy","Mechanical energy"],"Chemicals inside a battery store energy until a circuit uses it."],["A toaster changes electrical energy into…","Thermal energy",["Sound energy only","Chemical energy","Magnetism"],"The toaster’s wires get hot and toast the bread."],["A wind turbine changes the energy of moving air into…","Electrical energy",["Chemical energy","Sound energy only","Light energy only"],"Wind spins the blades, and a generator makes electricity."],["When you run, your body changes the chemical energy in food into…","Mechanical energy and thermal energy",["Electrical energy only","Light energy","Sound energy only"],"Food energy lets you move and keeps you warm."],["A solar panel changes light energy into…","Electrical energy",["Chemical energy","Sound energy","Mechanical energy"],"Solar panels turn sunlight into electricity."],["A campfire changes the chemical energy in wood into…","Thermal energy and light energy",["Electrical energy","Mechanical energy only","Chemical energy only"],"Burning wood gives off heat and light."],["A ceiling fan changes electrical energy into…","Mechanical energy (motion)",["Chemical energy","Light energy only","Thermal energy only"],"The fan’s motor spins the blades."],["A radio changes electrical energy mostly into…","Sound energy",["Chemical energy","Mechanical energy only","Light energy only"],"The speaker vibrates to make sound."],["A car engine changes the chemical energy in gasoline into…","Mechanical energy and thermal energy",["Light energy only","Sound energy only","Electrical energy only"],"Burning fuel makes the car move and makes the engine hot."],["Rubbing your hands together changes mechanical energy into…","Thermal energy",["Light energy","Chemical energy","Electrical energy"],"Friction turns motion into heat."],["Plants use sunlight to make food. Which energy change happens?","Light energy → chemical energy",["Chemical energy → light energy","Sound energy → light energy","Thermal energy → sound energy"],"Plants store the Sun’s energy as chemical energy in food."],["A doorbell changes electrical energy into…","Sound energy",["Light energy","Chemical energy","Mechanical energy only"],"The doorbell makes a sound when it gets electricity."],["A hand-crank radio works when you turn the handle. Which energy change happens first?","Mechanical energy → electrical energy",["Light energy → chemical energy","Sound energy → mechanical energy","Thermal energy → light energy"],"Turning the crank spins a generator that makes electricity."],["A stretched rubber band is let go and launches a toy car. Which energy change happens?","Stored (elastic) energy → mechanical energy",["Light energy → sound energy","Chemical energy → light energy","Electrical energy → chemical energy"],"The rubber band’s stored energy becomes motion."],["A gas stove changes the chemical energy in natural gas into…","Thermal energy and light energy",["Electrical energy","Sound energy only","Mechanical energy only"],"Burning gas makes a hot, glowing flame."],["When energy changes from one form to another, what happens to the total amount of energy?","It stays the same; energy is not created or destroyed",["It doubles","It disappears","It always gets bigger"],"Energy only changes form."],["A light bulb gets warm when it is on. What does this show?","Some electrical energy changes into thermal energy",["The bulb is making new energy","Light has no energy","The bulb is broken"],"Bulbs change electricity into light and some heat."],["Which device changes electrical energy into both sound energy and light energy?","A television",["A toaster","A fan","A battery"],"A TV makes pictures (light) and sound."],["Food on your plate has stored chemical energy. Where did that energy first come from?","The Sun",["The refrigerator","The plate","The stove"],"Plants captured the Sun’s energy, and it passed through the food chain."]]},{"id":"s5f","ch":"TEKS 5.8B","nm":"Electric Circuits","qs":[["What does a circuit need in order to work?","A complete (closed) path from an energy source",["A path with a gap in it","Only a light bulb","A magnet"],"Electricity flows only around a complete loop."],["What happens when the switch in a circuit is opened?","The path breaks and the current stops",["The current gets stronger","The battery recharges","The bulb gets brighter"],"An open switch makes a gap in the circuit."],["A bulb in a circuit does not light, but the battery is good. What is the most likely problem?","There is a gap in the circuit",["The wires are too shiny","The circuit is closed","The bulb has too much energy"],"A gap stops the current from flowing."],["Which part of a simple circuit supplies the energy?","The battery",["The wire","The switch","The bulb"],"The battery is the energy source."],["Which device in a circuit changes electrical energy into motion?","A motor",["A bulb","A buzzer","A switch"],"A motor spins when current flows through it."],["Which device in a circuit changes electrical energy into sound?","A buzzer",["A bulb","A battery","A switch"],"A buzzer vibrates to make sound."],["Which device in a circuit changes electrical energy into light?","A light bulb",["A motor","A buzzer","A switch"],"The bulb glows when current flows."],["Which material should be used to connect the parts of a circuit?","Metal wire",["String","Rubber bands","Plastic straws"],"Metal is a conductor, so current can flow through it."],["Why won’t a circuit work if a rubber band is placed in the path?","Rubber is an insulator, so it blocks the current",["Rubber is too stretchy","Rubber makes too much light","Rubber is a conductor"],"Insulators stop electricity from flowing."],["A circuit has a battery, wires, a switch, and a buzzer. When the switch is closed, what happens?","The buzzer makes a sound",["The buzzer stops","The battery melts","Nothing happens"],"Closing the switch completes the path."],["What is an electric current?","The flow of electricity through a path",["A kind of battery","A wire with no metal","A type of switch"],"Current is electricity moving through a circuit."],["Which device changes electrical energy into thermal energy?","An electric heater",["A doorbell","A fan","A flashlight bulb that is off"],"Heaters turn electricity into heat."],["In which setup will a bulb light?","Wires connect both ends of the battery to the bulb in a loop",["Only one wire touches the battery","The wires touch only the glass part of the bulb","The switch is open"],"The current needs a complete loop through the bulb."],["Why is it dangerous to put a metal object into an electrical outlet?","Metal conducts electricity, so current could flow through your body",["Metal blocks electricity","Outlets are cold","Metal is an insulator"],"Never put anything but a plug into an outlet."],["What does a closed switch do?","It completes the path so current can flow",["It breaks the path","It stores energy","It makes light"],"A closed switch connects the circuit."],["A fan, a lamp, and a doorbell all use electrical energy. What does each change it into?","Motion, light, and sound",["Light, sound, and motion","Sound, motion, and light","Heat, heat, and heat"],"The fan moves, the lamp glows, and the doorbell rings."],["Which object could close a gap in a circuit so a bulb lights?","A strip of aluminum foil",["A wooden craft stick","A plastic straw","A rubber eraser"],"Aluminum foil is a conductor."],["A battery is connected to a bulb with only one wire. Why won’t the bulb light?","The circuit is not a complete loop",["The wire is too long","The bulb needs two batteries to work","One wire makes too much current"],"Current needs a path out of the battery and back again."],["In a working circuit, current flows from the battery, through the wires and devices, and then…","Back to the battery",["Out into the air","Into the ground","It stops at the bulb"],"A circuit is a closed loop."],["Which list has everything a simple working circuit needs?","An energy source, wires, a device such as a bulb, and a complete path",["A battery and a bulb with no wires","Wires and a bulb with no battery","A battery, wires, and a bulb with a gap in the path"],"A working circuit needs an energy source and a complete loop of conductors through the device."]]},{"id":"s5g","ch":"TEKS 5.8C","nm":"Light","qs":[["How does light travel?","In straight lines",["In circles","Only around corners","In zigzags"],"Light travels in straight lines until it hits something."],["What happens when light hits a mirror?","It reflects (bounces off)",["It is absorbed completely","It stops existing","It turns into sound"],"Smooth, shiny surfaces reflect light."],["A straw in a glass of water looks bent at the water line. Why?","Light refracts (bends) as it passes from water into air",["The straw really bends","Water absorbs all the light","Light reflects off the straw only"],"Light changes direction when it moves between materials."],["Why does a black shirt get hot in the sun?","It absorbs most of the light",["It reflects most of the light","It refracts all the light","Black is a cold color"],"Absorbed light changes into thermal energy."],["What is refraction?","The bending of light as it passes from one material into another",["Light bouncing off a surface","Light being soaked up","Light making sound"],"Refraction happens when light changes speed in a new material."],["What is reflection?","Light bouncing off a surface",["Light bending in water","Light being soaked up","Light turning into heat"],"Mirrors and shiny surfaces reflect light."],["What usually happens to light that is absorbed by an object?","It changes into thermal energy and warms the object",["It bounces back to your eyes","It bends around the object","It turns into electricity in every object"],"That is why dark objects in sunlight get warm."],["Why do shadows form?","An object blocks light that travels in straight lines",["Light bends around objects","Objects make darkness","Light reflects off the ground"],"Light can’t curve around the object, so a dark shape forms behind it."],["Which surface reflects light best?","A smooth mirror",["Black cloth","A brick","Brown paper"],"Smooth, shiny surfaces reflect the most light."],["A magnifying glass makes small things look bigger. How?","It refracts (bends) light",["It reflects light like a mirror","It absorbs all the light","It makes its own light"],"The curved lens bends light."],["Which material lets almost all light pass through it?","Clear glass",["Wood","Aluminum foil","Cardboard"],"Clear glass is transparent."],["You can see a book because…","Light reflects off the book and enters your eyes",["Your eyes send out light","The book makes its own light","Sound bounces off the book"],"We see objects when light from them reaches our eyes."],["Why do many people wear light-colored clothes on hot days?","Light colors reflect more light, so they absorb less",["Light colors absorb more light","Light colors refract heat","Dark colors reflect heat"],"Less absorbed light means less heat."],["A pencil in a glass of water looks broken at the surface of the water. Which property of light causes this?","Refraction",["Reflection","Absorption","Magnetism"],"Light bends as it passes from water into air."],["Which is an example of light being absorbed?","A dark parking lot getting hot in the sun",["Seeing yourself in a mirror","A rainbow in a sprinkler","A spoon looking bent in water"],"The dark pavement soaks up light and warms up."],["A flashlight beam shines across a dark room. What path does the light take?","A straight path",["A curved path","A circle","A zigzag"],"Light travels in straight lines."],["What does a prism do to white light?","It refracts the light and separates it into colors",["It absorbs all the colors","It reflects all the light back","It turns light into sound"],"Each color bends a different amount, making a rainbow."],["Which is the best example of reflection?","Seeing your face in a calm lake",["A straw looking bent in water","A black car getting hot","A shadow on a wall"],"The smooth water reflects light back to your eyes."],["Light passes from air into water at a slant. What happens to its path?","It bends",["It stops","It turns into heat completely","It reflects straight back every time"],"Light refracts when it enters a new material."],["Which object mostly absorbs light?","A piece of black paper",["A mirror","A clear window","A shiny spoon"],"Dark, dull objects absorb most of the light that hits them."]]},{"id":"s5h","ch":"TEKS 5.9","nm":"Earth’s Rotation and Shadows","qs":[["About how long does it take Earth to rotate once on its axis?","About 24 hours",["About 1 hour","About 7 days","About 365 days"],"One rotation makes one day and one night."],["What causes day and night?","Earth rotating on its axis",["Earth orbiting the Sun","The Moon blocking the Sun","The Sun moving around Earth"],"As Earth spins, each place turns toward and then away from the Sun."],["Why does the Sun seem to move across the sky during the day?","Earth rotates",["The Sun orbits Earth each day","Clouds push the Sun","The Moon pulls the Sun"],"The Sun only looks like it moves because Earth is turning."],["In which direction does the Sun appear to rise?","East",["West","North","South"],"The Sun appears to rise in the east."],["In which direction does the Sun appear to set?","West",["East","North","South"],"The Sun appears to set in the west."],["When are shadows the shortest?","Around noon, when the Sun is highest in the sky",["Early in the morning","Late in the afternoon","At sunset"],"A high Sun makes short shadows."],["When are shadows the longest?","Early in the morning and late in the afternoon",["At noon","At midnight","Shadows never change"],"When the Sun is low in the sky, shadows stretch out."],["In the morning, the Sun is in the east. Which way does a flagpole’s shadow point?","West",["East","Up","It has no shadow"],"Shadows point away from the Sun."],["In the late afternoon, the Sun is in the west. Which way do shadows point?","East",["West","Toward the Sun","Straight down"],"Shadows point away from the Sun."],["What is Earth’s axis?","An imaginary line through Earth from the North Pole to the South Pole",["A road around the equator","The path Earth takes around the Sun","A line on the Moon"],"Earth spins around its axis."],["It is daytime in Texas. What is it like on the side of Earth facing away from the Sun?","It is nighttime there",["It is also daytime","It is always winter there","There is no time there"],"Only the side of Earth facing the Sun has daylight."],["A student measures a tree’s shadow at 9 a.m., noon, and 3 p.m. What pattern will she see?","The shadow gets shorter until about noon, then longer, and it changes direction",["The shadow stays exactly the same","The shadow only gets longer","The shadow disappears at 3 p.m."],"As Earth rotates, the Sun’s position changes, so the shadow changes."],["Earth rotates from west to east. Which way does the Sun appear to move across the sky?","From east to west",["From west to east","From north to south","It does not seem to move"],"Because we spin toward the east, the Sun seems to move west."],["How many times does Earth rotate in one week?","7 times",["1 time","24 times","52 times"],"Earth rotates once each day."],["Which describes Earth’s rotation?","Spinning on its axis",["Moving around the Sun","Changing seasons","The Moon’s phases"],"Rotation means spinning. Moving around the Sun is called revolution."],["A shadow is long and points west. About what time of day is it?","Early morning",["Noon","Late afternoon","Midnight"],"In the early morning the Sun is low in the east, so long shadows point west."],["Which model best shows how day and night happen?","Spinning a globe in front of a lamp",["Holding a globe still in a dark room","Moving a lamp around a table","Shaking a globe up and down"],"The lamp lights one side of the spinning globe at a time."],["Why do the length and direction of your shadow change during the day?","The Sun’s position in the sky changes as Earth rotates",["You grow during the day","The Sun changes size","Shadows move by themselves"],"As Earth turns, sunlight hits you from different angles."],["At noon in Texas, which direction do shadows point?","North",["South","East","West"],"At noon in Texas, the Sun is in the southern part of the sky, so shadows point north."],["Why do we have about 24 hours in a day?","Earth takes about 24 hours to rotate once",["The Moon takes 24 hours to orbit Earth","The Sun rotates every 24 hours","Clocks were set to 24 hours by chance"],"One full spin of Earth is one day."]]},{"id":"s5i","ch":"TEKS 5.10A","nm":"Sun, Ocean, and Weather","qs":[["What provides the energy that drives the water cycle?","The Sun",["The Moon","The wind","Earth’s core"],"The Sun heats water so it evaporates."],["Where does most evaporation on Earth happen?","Over the oceans",["In puddles","In lakes only","In clouds"],"Oceans cover most of Earth, so most water evaporates from them."],["The Sun heats ocean water. What happens to some of it?","It evaporates into water vapor",["It turns into salt","It freezes","It sinks deeper"],"Heat changes liquid water into a gas."],["Water vapor rises, cools, and forms clouds. What is this process called?","Condensation",["Evaporation","Precipitation","Runoff"],"Cooling water vapor condenses into tiny droplets."],["How does warm ocean water affect hurricanes?","It gives hurricanes energy and moisture",["It stops hurricanes","It makes hurricanes colder","It has no effect"],"Warm water evaporates quickly and powers the storm."],["Why is Houston usually more humid than El Paso?","Houston is near the Gulf of Mexico, a source of moisture",["Houston is in the desert","El Paso is near the ocean","Houston gets no sunlight"],"Evaporation from the Gulf adds water vapor to the air."],["What is precipitation?","Water that falls from clouds as rain, snow, sleet, or hail",["Water vapor rising","Water soaking into soil","Water freezing in a pond"],"Precipitation brings water back to Earth’s surface."],["Moist air from the Gulf of Mexico moves over Texas and cools. What is likely to happen?","Clouds form and it may rain",["The air turns into salt","Snow falls in summer","The air gets drier"],"Cooling moist air causes condensation and precipitation."],["How does the ocean affect the weather in coastal cities like Corpus Christi?","It keeps temperatures milder, not as hot or as cold",["It makes them colder than the North Pole","It stops all rain","It makes them the hottest places on Earth"],"Water heats up and cools down slowly, so it evens out temperatures."],["Which is the correct order in the water cycle?","Evaporation, condensation, precipitation, collection",["Precipitation, evaporation, collection, condensation","Condensation, collection, evaporation, precipitation","Collection, precipitation, condensation, evaporation"],"Water evaporates, condenses into clouds, falls, and collects."],["During evaporation, water changes from…","A liquid to a gas",["A gas to a liquid","A solid to a liquid","A liquid to a solid"],"Evaporation turns liquid water into water vapor."],["During condensation, water changes from…","A gas to a liquid",["A liquid to a gas","A solid to a gas","A liquid to a solid"],"Condensation turns water vapor into liquid drops."],["Sea breezes blow from the ocean toward land on sunny afternoons. Why?","Land heats up faster than water, so cooler air moves in from the sea",["Water heats up faster than land","The Moon pulls the air","The ocean makes its own wind"],"Uneven heating by the Sun causes wind."],["What happens to rain that falls on land?","It soaks into the ground or runs off into rivers that flow to the ocean",["It disappears","It turns into rock","It always stays in puddles forever"],"The water keeps moving through the water cycle."],["How does the Sun cause wind?","It heats Earth’s surface unevenly, so air moves from cooler areas to warmer areas",["It blows air from space","It pulls the clouds","It cools all the air evenly"],"Differences in temperature make air move."],["What is humidity?","The amount of water vapor in the air",["The amount of salt in the ocean","How hot the Sun is","How fast the wind blows"],"Humid air holds a lot of water vapor."],["Water evaporates from the ocean every day. Why doesn’t the ocean run out of water?","Precipitation and rivers return water to the ocean",["New water is made in the ocean","The ocean is too salty to evaporate","Evaporation only happens on land"],"The water cycle moves water around in a loop."],["Clouds that formed over the Gulf of Mexico are blown inland by wind. What do they often bring to Texas?","Rain",["Sand","Earthquakes","Volcanoes"],"Moisture from the Gulf brings rain to much of Texas."],["Why do hurricanes usually weaken after they move over land?","They lose their supply of warm, moist ocean air",["Land has more water than the ocean","The Sun stops shining over land","Trees blow them back to sea"],"Hurricanes need warm ocean water for energy."],["Which source of energy heats the ocean water that evaporates?","Sunlight",["Moonlight","Ocean currents","Fish"],"The Sun’s energy warms the water."]]},{"id":"s5j","ch":"TEKS 5.10B","nm":"Sedimentary Rocks and Fossil Fuels","qs":[["How do sedimentary rocks form?","Layers of sediment are pressed and cemented together over a long time",["Lava cools quickly","Rocks melt in a volcano","Ice freezes into stone"],"Sediment piles up, gets buried, and slowly hardens into rock."],["What is sediment?","Small pieces of rock, sand, mud, and remains of living things",["Melted rock","Water vapor","Only large boulders"],"Sediment is made of tiny bits of material that settle in layers."],["In layers of sedimentary rock that have not been disturbed, which layer is usually the oldest?","The bottom layer",["The top layer","The middle layer","All layers are the same age"],"Newer layers settle on top of older ones."],["Which rock is a sedimentary rock?","Sandstone",["Granite","Obsidian","Basalt"],"Sandstone forms from sand grains cemented together."],["Limestone often contains fossil shells. What does this tell you?","It formed from sediment at the bottom of an ocean",["It formed in a volcano","It formed in outer space","It formed in a desert with no water"],"Shells of sea animals collected on the ocean floor."],["How did coal form?","From swamp plants that were buried and pressed for millions of years",["From lava cooling","From melted ice","From sand blown by wind"],"Heat and pressure slowly changed buried plant remains into coal."],["Oil and natural gas formed mostly from…","Tiny ocean organisms buried for millions of years",["Rocks melting","Rain soaking into the ground","Dinosaur bones only"],"Remains of tiny sea life were buried, heated, and pressed."],["Why are fossil fuels called nonrenewable?","They take millions of years to form",["They form in a few days","They can be grown on farms","The wind makes them"],"We use them much faster than they can form."],["What makes layers of sediment harden into rock?","Pressure from the layers above and minerals that cement the pieces",["Sunlight","Wind blowing on top","Freezing for one night"],"Compaction and cementation turn sediment into rock."],["Which process breaks rocks into sediment?","Weathering",["Deposition","Cementation","Evaporation"],"Weathering breaks rock into smaller pieces."],["Which process moves sediment to new places?","Erosion",["Weathering","Cementation","Condensation"],"Water, wind, and ice carry sediment away."],["Where does sediment usually settle and build up in layers?","At the bottom of lakes, rivers, and oceans",["On mountain tops","Inside volcanoes","In the clouds"],"Moving water slows down and drops sediment."],["Which order shows how sedimentary rock forms?","Weathering → erosion → deposition → compaction and cementation",["Deposition → weathering → erosion → melting","Melting → cooling → weathering","Erosion → melting → deposition"],"Rock breaks down, moves, settles, and hardens."],["Layers of coal are found between layers of sedimentary rock. What was the area like long ago?","A swamp with many plants",["A dry desert","A glacier","A volcano"],"Coal forms from lots of swamp plants."],["Why are fossils usually found in sedimentary rock?","Remains were buried in sediment that slowly hardened",["Lava preserves bones","Fossils form in the air","Fossils grow inside rocks"],"Sediment buries remains before they rot away."],["Which is a fossil fuel?","Coal",["Wind","Sunlight","Wood from a tree cut down this year"],"Coal, oil, and natural gas are fossil fuels."],["Texas produces a lot of oil and natural gas. Where are they found?","Deep underground in layers of rock",["In the clouds","In ocean waves","In tree trunks"],"Oil and gas are trapped in rock layers deep underground."],["What has to happen for plant remains to become coal?","Burial, heat, and pressure over millions of years",["A few days of sunlight","Freezing for a winter","Being blown by wind"],"Coal forms very slowly deep underground."],["Conglomerate rock has rounded pebbles cemented together. How did it form?","Pebbles were deposited by water, buried, and cemented",["Lava cooled around the pebbles","Wind glued the pebbles","The pebbles grew together"],"Moving water rounds and deposits pebbles."],["If people used up all the coal in one area, how long would it take for new coal to form there?","Millions of years",["One year","One hundred years","One week"],"That is why coal is nonrenewable."]]},{"id":"s5k","ch":"TEKS 5.10C","nm":"Landforms","qs":[["How does a delta form?","A river slows down and drops sediment where it meets a larger body of water",["Wind piles up sand in the desert","A glacier scrapes a valley","A volcano erupts"],"Slowing water deposits its sediment."],["Which landform is made mainly by wind?","Sand dunes",["Deltas","Canyons","U-shaped valleys"],"Wind blows sand into hills called dunes."],["What carved the Grand Canyon over millions of years?","The Colorado River",["Wind","A glacier","An earthquake"],"Flowing water slowly cut down through the rock."],["Palo Duro Canyon in the Texas Panhandle was carved mainly by…","Water from a river",["Wind blowing sand","A glacier","A volcano"],"A river eroded the canyon over a very long time."],["Where are sand dunes most likely to form?","In deserts and along beaches",["At the bottom of the ocean","Inside caves","On top of glaciers"],"Dunes form where there is loose sand and strong wind."],["How do glaciers change the land?","They scrape and carve valleys and carry rocks",["They make sand dunes","They build deltas at river mouths","They make volcanoes"],"Moving ice is very powerful."],["A wide, U-shaped valley was most likely carved by…","A glacier",["A river","Wind","An earthquake"],"Glaciers carve wide, U-shaped valleys."],["A narrow, V-shaped valley was most likely carved by…","A river",["A glacier","Wind","A volcano"],"Rivers cut narrow, V-shaped valleys."],["The Mississippi River drops sediment where it flows into the Gulf of Mexico. Which landform forms there?","A delta",["A canyon","A sand dune","A glacier"],"Deposition at the river’s mouth builds a delta."],["Monahans Sandhills State Park in West Texas has large hills of sand. What formed them?","Wind",["A river","A glacier","Ocean waves"],"Wind piled the sand into dunes."],["How does a canyon form?","Running water erodes rock over a very long time",["Wind drops sand in one place","A river drops sediment at its mouth","Ice melts in one day"],"Water slowly cuts down through rock layers."],["In a stream table model, water flows over sand into a tray of still water. Where will a delta form?","Where the stream meets the still water",["At the top of the stream","In the middle of the stream","Nowhere"],"The water slows down there and drops its sand."],["Which clue shows that wind formed a landform?","Ripples and hills of fine, loose sand",["A wide river mouth with mud","Scratches on rocks from ice","Layers of lava"],"Wind leaves ripple marks and dunes."],["How can people slow down moving sand dunes?","Plant grasses and build sand fences",["Remove all plants","Pour oil on the sand","Dig the dunes out every day"],"Plants and fences hold sand in place."],["Which process happens when a river drops sediment?","Deposition",["Erosion","Weathering","Evaporation"],"Dropping sediment is called deposition."],["Which landform is formed mainly by deposition?","A delta",["A canyon","A U-shaped valley","A V-shaped valley"],"Deltas are built from dropped sediment."],["Which landform is formed mainly by erosion?","A canyon",["A delta","A sand dune","A beach"],"Canyons are carved by moving water."],["Melting glaciers leave behind piles of rocks and soil. What is this process?","Deposition by ice",["Erosion by wind","Weathering by plants","Condensation"],"When ice melts, it drops what it carried."],["In a model, a hair dryer blows sand into a pile. Which landform is being modeled?","A sand dune",["A delta","A canyon","A glacier"],"The hair dryer acts like wind."],["What carries the sediment that builds a delta?","Water",["Wind","Ice","Magnetism"],"Rivers carry sediment to the delta."]]},{"id":"s5l","ch":"TEKS 5.11","nm":"Protecting Natural Resources","qs":[["Which action helps conserve water?","Fixing leaky faucets",["Running the sprinkler at noon","Taking very long showers","Leaving the hose on"],"Fixing leaks saves gallons of clean water."],["What is the best way to get rid of used batteries?","Take them to a battery recycling drop-off",["Throw them in a lake","Bury them in the yard","Put them in a campfire"],"Batteries contain chemicals that need special disposal."],["How does recycling aluminum cans help the environment?","It saves resources and energy",["It makes more trash","It uses more aluminum ore","It has no effect"],"Making cans from recycled aluminum uses much less energy."],["A school wants to throw away less paper. Which plan works best?","Print on both sides and recycle used paper",["Print extra copies","Use paper only once","Throw paper in the trash"],"Reducing and recycling both cut paper waste."],["Why should motor oil never be poured down a storm drain?","It pollutes rivers and harms living things",["It cleans the drain","Storm drains turn oil into water","Oil helps fish grow"],"Storm drains often flow straight into creeks and rivers."],["Which design would reduce the energy a house uses?","Adding insulation and solar panels",["Leaving windows open with the air conditioner on","Using old, leaky windows","Keeping all lights on"],"Insulation saves heat and cooling, and solar panels make clean electricity."],["What is composting?","Turning food scraps and yard waste into rich soil",["Burning trash","Burying plastic","Throwing food in a river"],"Compost returns nutrients to the soil."],["Which is an example of reusing?","Using an empty glass jar to store pencils",["Throwing the jar away","Breaking the jar","Buying a new jar each day"],"Reusing gives an item a second job."],["Which choice reduces air pollution?","Walking or biking instead of driving on short trips",["Driving to a neighbor’s house","Leaving a car running","Burning trash"],"Fewer car trips mean less exhaust."],["A town is running low on water during a drought. Which plan helps the most?","Limit lawn watering and fix leaks",["Fill more swimming pools","Water lawns every day","Wash cars every day"],"Using less water helps the supply last."],["Why is proper disposal of trash important?","It keeps harmful materials out of the land and water",["It makes more trash","It helps pollution spread","It has no effect on the environment"],"Trash in the wrong place can poison soil, water, and animals."],["How do reusable shopping bags help the environment?","They reduce plastic waste",["They create more trash","They use more plastic","They make stores dirty"],"Fewer plastic bags end up in landfills and waterways."],["Which energy source has the least effect on air quality?","Wind",["Coal","Oil","Natural gas"],"Wind turbines don’t burn fuel, so they don’t make smoke."],["A student designs a rain barrel that collects water from the roof. How does this help?","It saves tap water for watering plants",["It wastes rainwater","It makes the roof leak","It pollutes the water"],"Collected rainwater can replace tap water outdoors."],["Which is a way to conserve electricity?","Turn off lights and unplug devices you are not using",["Leave the TV on all night","Open the refrigerator often","Keep every light on"],"Using less electricity saves energy resources."],["Why do some companies plant new trees after cutting trees down?","To replace the resource and protect habitats and soil",["To make the land bare","To use up more trees","Because new trees make oil"],"Replanting keeps forests renewable."],["Which item belongs in a recycling bin?","A clean plastic bottle",["A banana peel","A used paper towel","A toy with batteries inside"],"Clean bottles can be recycled. Peels go in compost, and batteries need special drop-off."],["What is the main goal of conservation?","To use resources wisely so they last",["To use resources as fast as possible","To waste resources","To make more trash"],"Conservation protects resources for the future."],["How can farmers reduce soil erosion?","Plant cover crops and plow across slopes instead of up and down",["Remove all plants from the fields","Plow straight down hills","Leave fields bare all winter"],"Roots and level rows hold soil in place."],["Which plan sends the least trash to a landfill?","Composting food scraps and recycling cans and paper",["Throwing everything in one bag","Burning trash in the yard","Dumping trash in a creek"],"Composting and recycling keep useful materials out of landfills."]]},{"id":"s5m","ch":"TEKS 5.12","nm":"Ecosystems and Food Webs","qs":[["Which is an abiotic (nonliving) factor in an ecosystem?","Sunlight",["Grass","A rabbit","A mushroom"],"Abiotic factors include sunlight, water, air, soil, and temperature."],["Which is a biotic (living) factor in an ecosystem?","Grass",["Water","Rocks","Sunlight"],"Biotic factors are living things."],["How do plants interact with abiotic factors?","They use sunlight, water, and air to make food",["They eat other animals","They hunt for food","They do not need anything"],"Plants depend on nonliving parts of the ecosystem."],["A prairie dog digs a burrow in the soil. What is it using the soil for?","Shelter",["Food","Water","Light"],"Burrows protect prairie dogs from predators and weather."],["Why do many desert animals come out mostly at night?","To avoid the extreme heat of the day",["Because they can’t see in daylight","Because plants grow at night","Because there is more water at night"],"Cooler nights help them save water and energy."],["What do fish in a pond need from the abiotic part of their ecosystem?","Water with oxygen at the right temperature",["Sunlight to eat","Rocks to eat","Dry soil"],"Fish depend on clean water with oxygen."],["Bees drink nectar from flowers and carry pollen to other flowers. How does this interaction affect them?","Both the bees and the flowers benefit",["Only the flowers are helped","Only the bees are harmed","Neither is affected"],"Bees get food, and flowers get pollinated."],["In a healthy ecosystem, what do animals need to survive?","Food, water, shelter, and space",["Only sunlight","Only food","Nothing from the ecosystem"],"Animals depend on many parts of their ecosystem."],["How does an owl survive in a forest ecosystem?","It hunts mice and nests in trees",["It makes its own food from sunlight","It lives in the water","It eats rocks"],"The owl interacts with both living and nonliving parts of the forest."],["Which abiotic factor most limits which plants can grow in a desert?","Little rainfall",["Too many trees","Too much shade","Too many fish"],"Desert plants must survive with very little water."],["In a food chain, grass → rabbit → hawk. A disease kills most of the rabbits. What will most likely happen to the hawks?","Their numbers may drop because they have less food",["Their numbers will grow","Nothing will change","They will start eating grass"],"Fewer rabbits means less food for hawks."],["In the same food chain, what will most likely happen to the grass if most rabbits die?","The grass may grow more because fewer animals eat it",["The grass will all die","The grass will turn into rabbits","Nothing will change"],"Fewer consumers eating it lets grass grow."],["A drought kills many plants in an ecosystem. How does this affect the food web?","Less energy is available for all the consumers",["Consumers get more food","Nothing changes","Only plants are affected"],"Every food web depends on producers."],["Decomposers break down a dead deer. What happens to the matter in the deer?","Nutrients return to the soil for plants to use",["The matter disappears","It turns into sunlight","It becomes a new deer"],"Matter cycles back into the ecosystem."],["What would happen if all the decomposers in an ecosystem disappeared?","Dead matter would pile up, and nutrients would not return to the soil",["Plants would grow faster","Animals would never die","Nothing would change"],"Decomposers recycle nutrients."],["In a pond, algae → small fish → heron. Pollution kills most of the algae. What happens next?","The small fish and herons lose food",["The herons have more food","The fish grow larger","Nothing changes"],"The loss of producers affects every level of the food chain."],["Which organism is at the start of almost every food web?","A producer, like a plant",["A hawk","A mushroom","A wolf"],"Producers capture energy from the Sun."],["Where does the energy in a food web come from, and where does it go?","It comes from the Sun and moves from producers to consumers",["It comes from consumers and goes to the Sun","It comes from rocks and goes to plants","It comes from decomposers and goes to the Moon"],"Energy flows from the Sun through producers to consumers."],["Snakes eat mice, and hawks eat snakes. What could happen if all the hawks were removed?","The number of snakes may increase, and the number of mice may decrease",["The number of snakes will drop","Mice will disappear right away","Nothing will change"],"Without hawks, more snakes survive and eat more mice."],["A new insect eats nearly all the oak leaves in a forest. Which animals might be affected first?","Animals that eat oak leaves or acorns",["Fish in the ocean","Animals in a desert far away","Animals that eat only grass"],"Changes at one level of a food web affect the animals that depend on it."],["How does matter cycle in an ecosystem?","Plants use nutrients, animals eat plants, and decomposers return nutrients to the soil",["Matter is used once and then disappears","Matter comes only from the Sun","Only animals use matter"],"The same matter is used again and again."],["After a wildfire burns a forest, which living things will most likely return first?","Grasses and small plants",["Huge oak trees","Large bears","Old forest mushrooms"],"Fast-growing plants return first, then animals that eat them."],["Which describes a healthy ecosystem?","Many kinds of organisms with enough food, water, and shelter",["Only one kind of plant","No water at all","Polluted water and soil"],"Healthy ecosystems have a variety of living things and resources."],["Which human activity can harm an ecosystem?","Dumping trash into a river",["Planting native plants","Picking up litter","Building birdhouses"],"Trash can poison or trap animals."],["Which human activity can help an ecosystem?","Planting native plants and removing litter",["Cutting down every tree","Spraying chemicals on a stream","Draining a wetland"],"These actions restore habitats."],["A parking lot is built over a field. How does this affect the ecosystem?","Animals that lived there lose their habitat",["Animals gain more food","More plants can grow there","Nothing changes"],"Paving destroys the plants and shelter animals need."],["Why are wetlands important to healthy ecosystems?","They filter water and provide homes for many animals",["They make water dirtier","No animals live there","They stop all rain"],"Wetlands clean water and support wildlife."],["A state fish hatchery releases young fish into a lake. How might this help the ecosystem?","It can rebuild a fish population that was getting small",["It always harms every lake","It removes all the plants","It makes the water salty"],"Restocking can help a population recover."],["Too much lawn fertilizer washes into a lake. What can happen?","Too much algae grows and uses up oxygen fish need",["The lake becomes cleaner","Fish get more oxygen","Nothing happens"],"Extra nutrients cause algae blooms that harm fish."],["How do state parks and wildlife areas help ecosystems?","They protect habitats for plants and animals",["They remove all the animals","They add pollution","They replace forests with parking lots"],"Protected land gives living things space to survive."]]},{"id":"s5n","ch":"TEKS 5.13","nm":"Structures and Behaviors","qs":[["A jackrabbit in the desert has very large ears. How do its ears help it survive?","They give off body heat to keep it cool",["They store water","They help it swim","They catch insects"],"Blood flowing through the big ears releases heat."],["How does a cactus’s thick, waxy stem help it survive in the desert?","It stores water and keeps the water from escaping",["It catches insects","It helps the cactus move","It makes the cactus taller than trees"],"Desert plants must hold on to water."],["A hummingbird and a woodpecker live in the same forest. How do their beaks help them get different foods?","The hummingbird’s long, thin beak sips nectar; the woodpecker’s strong beak drills into wood for insects",["Both beaks crack seeds","Both beaks catch fish","The beaks are only for singing"],"Different structures let species use different foods in the same place."],["How do webbed feet help a duck survive in a pond?","They help it swim",["They help it climb trees","They keep it warm","They help it see"],"Webbed feet push against the water like paddles."],["Why do deer and rabbits have eyes on the sides of their heads?","To watch for predators all around them",["To see far ahead only","To hunt other animals","To see in the dark only"],"Side-facing eyes give a wide view."],["How do gills help a fish survive?","They take in oxygen from the water",["They help the fish see","They help the fish hear","They store food"],"Gills let fish breathe underwater."],["A Texas horned lizard is brown and spiky. How does its color help it survive?","It blends in with the ground so predators have trouble seeing it",["It attracts predators","It keeps the lizard cool","It helps the lizard swim"],"Camouflage helps it hide."],["In the same pond, a frog has long back legs and a turtle has a hard shell. What does this show?","Different species survive in the same place in different ways",["All animals have the same structures","Only frogs can survive in ponds","Shells are useless in ponds"],"Frogs escape by jumping, and turtles hide in their shells."],["How do the deep roots of a mesquite tree help it survive in dry areas?","They reach water deep underground",["They catch sunlight","They make flowers","They keep the tree cold"],"Deep roots find water when the surface is dry."],["How do an eagle’s sharp talons help it survive?","They help it catch and hold its prey",["They help it swim","They keep it warm","They help it hear"],"Talons grip fish and small animals."],["A giraffe and a zebra live on the same savanna. How does the giraffe’s long neck help it survive?","It reaches leaves high in trees that zebras can’t reach",["It helps it dig burrows","It helps it swim","It keeps it warm at night"],"Different structures let the two species eat different foods in the same place."],["A sea turtle and a shark both live in the ocean. How do the sea turtle’s flippers help it?","They help it swim through the water",["They help it breathe underwater","They help it dig in the desert","They help it fly"],"Flippers push the turtle through the water."],["Why does a polar bear have thick fur and a layer of fat?","To stay warm in the cold Arctic",["To stay cool in the desert","To swim faster in warm water","To hide in the jungle"],"Fur and fat hold in body heat."],["Sea turtle hatchlings crawl to the ocean right after they hatch, without being taught. What kind of behavior is this?","An instinct (inherited behavior)",["A learned behavior","A trick taught by people","An acquired trait"],"Hatchlings are born knowing to head for the sea."],["Young orcas learn to hunt in groups by watching older orcas. What kind of behavior is this?","A learned behavior",["An instinct","An inherited body part","A plant structure"],"Learned behaviors come from experience and from watching others."],["A spider spins a web without ever being taught. This behavior is…","An instinct",["Learned","Taught by its parents","Copied from other spiders"],"Spiders are born knowing how to spin webs."],["A dog learns to sit when its owner says “sit.” This behavior is…","Learned",["An instinct","Inherited from its parents","A body structure"],"The dog learned the behavior through training."],["Many birds fly south when winter comes. This migration is mainly…","An instinctive behavior",["A learned trick","Taught in school","A body structure"],"Many birds are born with the urge to migrate."],["How do instincts help newborn animals survive?","They know what to do without being taught",["They must learn everything first","Instincts slow them down","Instincts only help plants"],"Instincts let animals act right away, like a calf standing to nurse."],["A young lion watches its mother hunt and then practices. This is…","A learned behavior",["An instinct","A structure","A plant trait"],"The cub learns by watching and practicing."],["A bear hibernates in winter. This is an example of…","An instinctive behavior",["A learned trick","A taught skill","A plant structure"],"Hibernation is mostly an inherited behavior."],["A raccoon learns how to open trash can lids to find food. This behavior is…","Learned",["An instinct","Inherited","A body structure"],"The raccoon learned it through experience."],["Which is an instinct?","A baby bird opening its mouth wide when a parent comes near",["A parrot saying words it heard","A dog fetching a ball after training","A chimp using a tool it saw others use"],"Baby birds are born with this feeding behavior."],["Which is a learned behavior?","A sea lion doing tricks for a trainer",["A newborn calf standing up","A baby kangaroo crawling into its mother’s pouch","A spider spinning a web"],"The sea lion learned tricks through training."],["How do learned behaviors help animals survive?","They let animals change what they do based on experience",["They are the same for every animal","They never change","They only help plants"],"Animals that learn can adjust to new situations."]]}];
