<style>@font-face{font-family:'Baloo 2';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Baloo 2';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2')}</style>
<style>
/* Layout: a dry-erase board on an aluminum frame. Question card left, board right (stacks on phones). Marker tray holds the tools. */
:root{
  --bg:#e9edf1; --frame:#cfd6dd; --tray:#b9c2cb;
  --surface:#ffffff; --board:#fcfdfe; --grid:#dfe8f2;
  --ink:#1c232b; --muted:#5b6672; --line:#d5dce3;
  --m-blue:#1d5fc4; --m-red:#d23a2c; --m-green:#16855a; --m-purple:#7442b8;
  --math:#1d5fc4; --math-soft:#e3edfb; --sci:#16855a; --sci-soft:#dff2e8;
  --good:#16855a; --good-soft:#e1f4ea; --bad:#c2372a; --bad-soft:#fbe6e3;
  --shade:#f2b134;--hl:rgba(255,220,30,.62);
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161a; --frame:#2a3138; --tray:#353e47;
  --surface:#1a2026; --board:#182027; --grid:#23303b;
  --ink:#e8edf2; --muted:#9aa7b3; --line:#2f3942;
  --m-blue:#6ea4f5; --m-red:#f17c6f; --m-green:#58c993; --m-purple:#b292ec;
  --math:#6ea4f5; --math-soft:#1c2a3d; --sci:#58c993; --sci-soft:#17302a;
  --good:#58c993; --good-soft:#163026; --bad:#f17c6f; --bad-soft:#3a1f1c;
  --shade:#e6a72e;--hl:rgba(250,204,21,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161a; --frame:#2a3138; --tray:#353e47;
  --surface:#1a2026; --board:#182027; --grid:#23303b;
  --ink:#e8edf2; --muted:#9aa7b3; --line:#2f3942;
  --m-blue:#6ea4f5; --m-red:#f17c6f; --m-green:#58c993; --m-purple:#b292ec;
  --math:#6ea4f5; --math-soft:#1c2a3d; --sci:#58c993; --sci-soft:#17302a;
  --good:#58c993; --good-soft:#163026; --bad:#f17c6f; --bad-soft:#3a1f1c;
  --shade:#e6a72e;--hl:rgba(250,204,21,.4); color-scheme:dark;}

html{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--m-blue);outline-offset:2px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Home */
.home-head{display:flex;flex-direction:column;gap:6px;margin:12px 0 22px}
.home-head h1{font-size:clamp(40px,8vw,64px);font-weight:800;letter-spacing:-.01em}
.home-head h1 span{color:var(--m-blue)}
.home-head p{margin:0;color:var(--muted);max-width:60ch}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.subject{position:relative;text-align:left;border:0;border-radius:18px;padding:22px 22px 20px;background:var(--surface);
  box-shadow:0 0 0 2px var(--line);display:flex;flex-direction:column;gap:14px;min-height:220px;transition:transform .15s, box-shadow .15s}
@media (hover:hover) and (pointer:fine){.subject:hover{transform:translateY(-2px);box-shadow:0 0 0 3px var(--accent)}}
.subject.math{--accent:var(--math);--soft:var(--math-soft)}
.subject.sci{--accent:var(--sci);--soft:var(--sci-soft)}
.subject h2{font-size:38px;color:var(--accent)}
.subject .scribble{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--accent);background:var(--soft);
  border-radius:12px;padding:8px 14px;align-self:flex-start;transform:rotate(-2deg)}
.subject p{margin:0;color:var(--muted);font-size:15px}
.subject .go{margin-top:auto;font-weight:700;color:var(--accent)}

/* Topics */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.back{border:0;background:var(--surface);box-shadow:0 0 0 2px var(--line);border-radius:999px;padding:8px 16px;font-weight:700}
.topic-head h2{font-size:clamp(30px,6vw,44px)}
.topic-head p{margin:4px 0 0;color:var(--muted);font-size:15px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin-top:18px}
.topic{border:0;text-align:left;background:var(--surface);box-shadow:0 0 0 2px var(--line);border-radius:14px;padding:14px 16px;
  display:flex;flex-direction:column;gap:2px;min-height:86px}
@media (hover:hover) and (pointer:fine){.topic:hover{box-shadow:0 0 0 3px var(--accent)}}
.topic .ch{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}
.topic .nm{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.15}
.topic .best{font-size:13px;color:var(--muted);margin-top:auto}
.topic.mix{background:var(--soft);box-shadow:0 0 0 2px var(--accent)}

/* Quiz */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.qbar .back{flex:none}
.qmeta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0;text-align:right}
.qbar .title{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.15;text-wrap:balance}
.pips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pip.now{background:var(--accent);transform:scale(1.25)}
.pip.ok{background:var(--good)} .pip.no{background:var(--bad)}
.quiz{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.quiz{grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);align-items:start}}
.card{background:var(--surface);border-radius:18px;box-shadow:0 0 0 2px var(--line);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.qnum{font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.speak.talking{background:var(--accent);color:var(--surface)}
.speak{border:0;background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.qtext{font-size:clamp(21px,3.6vw,26px);font-weight:700;line-height:1.35;margin:0}
.visual{display:flex;justify-content:center;overflow-x:auto}
.visual svg{max-width:100%;height:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.choice{border:0;text-align:left;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line);border-radius:14px;padding:12px 14px;
  display:flex;gap:12px;align-items:center;font-size:18px;min-height:58px}
@media (hover:hover) and (pointer:fine){.choice:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--accent)}}
.choice .ltr{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;
  background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.choice .tx{min-width:0;font-variant-numeric:tabular-nums}
.choice:disabled{cursor:default}
.choice.right{background:var(--good-soft);box-shadow:inset 0 0 0 3px var(--good)}
.choice.right .ltr{background:var(--good);color:var(--surface);box-shadow:none}
.choice.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 3px var(--bad)}
.choice.wrong .ltr{background:var(--bad);color:var(--surface);box-shadow:none}
.choice.dim{opacity:.55}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)}
.feedback strong{font-family:var(--font-display);font-size:22px}
.feedback.ok strong{color:var(--good)} .feedback.no strong{color:var(--bad)}
.feedback p{margin:0}
.next{border:0;background:var(--accent);color:var(--surface);font-family:var(--font-display);font-weight:800;font-size:20px;border-radius:14px;padding:12px 18px;align-self:flex-end}

/* Board */
.board-wrap{background:var(--frame);border-radius:18px;padding:10px 10px 0;display:flex;flex-direction:column;min-width:0}
.board-label{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px 8px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.board{position:relative;height:360px;border-radius:8px;background-color:var(--board);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;touch-action:none}
@media (min-width:900px){.board{height:min(64vh,560px)}}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.board .hint{position:absolute;left:0;right:0;top:42%;text-align:center;color:var(--muted);font-family:var(--font-display);font-size:22px;pointer-events:none;opacity:.7}
.tray{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 6px 12px;margin:10px -10px 0;background:var(--tray);border-radius:0 0 18px 18px;
  padding-left:14px;padding-right:14px}
.marker{width:44px;height:30px;border:0;border-radius:6px 14px 14px 6px;background:var(--c);position:relative;box-shadow:inset -10px 0 0 rgba(0,0,0,.18)}
.marker.on{transform:translateY(-5px);box-shadow:inset -10px 0 0 rgba(0,0,0,.18),0 0 0 3px var(--surface)}
.tool{border:0;background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;min-height:34px}
.tool.on{box-shadow:0 0 0 3px var(--m-blue)}
.tray .sp{flex:1}

/* Results */
.results{max-width:640px;margin:20px auto;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.results .big{font-family:var(--font-display);font-weight:800;font-size:clamp(64px,16vw,104px);line-height:1;color:var(--accent)}
.stars{display:flex;gap:8px}
.stars svg{width:44px;height:44px}
.stars .on{fill:var(--shade)} .stars .off{fill:var(--line)}
.results p{margin:0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--surface);box-shadow:0 0 0 2px var(--line)}
.btn.primary{background:var(--accent);color:var(--surface);box-shadow:none;font-family:var(--font-display);font-size:19px}
.missed{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.missed div{background:var(--surface);border-radius:12px;padding:10px 14px;box-shadow:0 0 0 2px var(--line);font-size:15px}
.missed b{color:var(--good)}

/* SVG visuals */
.v-dot{fill:var(--m-blue)}
.v-shade{fill:var(--shade);stroke:var(--ink);stroke-width:2}
.v-cell{fill:var(--board);stroke:var(--ink);stroke-width:2}
.v-rect{fill:var(--math-soft);stroke:var(--ink);stroke-width:3}
.v-txt{fill:var(--ink);font-family:var(--font-body);font-weight:700}
.v-coin{stroke:var(--ink);stroke-width:2}
.v-q{fill:#c9ced4}.v-d{fill:#dfe3e7}.v-n{fill:#b8bec5}.v-p{fill:#c98a5a}
.v-ctxt{fill:#1c232b;font-family:var(--font-body);font-weight:700}
.help{margin-top:22px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 2px var(--line);padding:4px 16px}
.help summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;font-weight:700;list-style:none}
.help summary::-webkit-details-marker{display:none}
.help summary>span::before{content:"▸ ";color:var(--m-blue)}
.help[open] summary>span::before{content:"▾ "}
.help .speak{--accent:var(--math);--soft:var(--math-soft)}
.help p{margin:0 0 12px;color:var(--muted);max-width:65ch}
.help .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-bottom:12px}
.help .steps>div{background:var(--bg);border-radius:12px;padding:12px 14px;min-width:0}
.help h3{font-size:20px;color:var(--m-blue)}
.help ol{margin:6px 0 0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.help .note{font-size:14px}

/* Tablet & desktop: question and board side by side, filling the screen */
@media (min-width:700px) and (min-height:520px){
  .wrap.fit{height:100%;display:flex;flex-direction:column;padding-block:12px 14px;box-sizing:border-box;max-width:1400px}
  .wrap.fit .qbar{margin-bottom:10px;flex:none}
  .wrap.fit .quiz{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:minmax(0,1fr);align-items:stretch}
  .wrap.fit .card{overflow-y:auto;padding:16px 18px;gap:12px;overscroll-behavior:contain}
  .wrap.fit .board-wrap{min-height:0}
  .wrap.fit .board{flex:1;height:auto;min-height:220px}
  .wrap.fit .qtext{font-size:clamp(20px,2.5vw,25px)}
  .wrap.fit .choice{min-height:54px}
}
.nextbar{position:sticky;bottom:0;background:var(--surface);padding-top:10px;display:flex;justify-content:flex-end}
/* Highlighter */
html{touch-action:manipulation}
.qtext{touch-action:pan-y;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.qtext .w{border-radius:4px;cursor:pointer;transition:background-color .1s}
.qtext .w.hl{background:var(--hl);box-shadow:.14em 0 0 var(--hl),-.14em 0 0 var(--hl)}
.hlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:-6px}
.hlbar .sw{width:18px;height:12px;border-radius:3px;background:var(--hl);flex:none}
.hlbar button{border:0;background:none;color:var(--accent);font-weight:700;padding:2px 6px;font-size:13px}
/* Review lesson */
.review{border:0;background:var(--surface);color:var(--accent);font-weight:700;border-radius:999px;padding:8px 14px;box-shadow:inset 0 0 0 2px var(--accent);align-self:flex-start;margin-top:4px;text-align:left}
.rv-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,14,24,.5);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;overscroll-behavior:contain;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rv{background:var(--surface);border-radius:24px;max-width:680px;width:100%;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 4px var(--accent);min-width:0}
.rv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rv h2{font-size:clamp(26px,5vw,34px);color:var(--accent)}
.rv h3{font-size:21px;margin-top:6px}
.ideas{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.ex{background:var(--soft);border-radius:16px;padding:14px 16px}
.ex h3{margin:0}.exq{margin:6px 0 0;font-weight:700}
.ex ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px;margin:0}
.words div{background:var(--bg);border-radius:12px;padding:8px 12px}
.words dt{font-weight:700;color:var(--accent)}.words dd{margin:0;font-size:15px}
.rvbar{margin-top:6px;padding-bottom:2px}
/* Arrays in review */
.arr{display:flex;flex-direction:column;gap:8px}
.arr-play{background:var(--bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.arr-play .eyebrow{align-self:flex-start}
.arr-ctrl{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.arr-ctrl>div{display:flex;align-items:center;gap:8px;font-weight:700}
.arr-ctrl span{color:var(--muted);font-size:14px}
.arr-ctrl button{border:0;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--surface);font-size:22px;font-weight:800;line-height:1}
.arr-ctrl b{font-family:var(--font-display);font-size:24px;min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.arr-vis{max-width:100%;overflow-x:auto;display:flex;justify-content:center}
.arr-vis svg{max-width:100%;height:auto}
.arr-eq{margin:0;font-size:19px;text-align:center}
.arr-eq b{color:var(--accent);font-family:var(--font-display);font-size:22px}
.v-sq{fill:var(--math-soft);stroke:var(--math);stroke-width:2}
/* Grade picker + grade 1-2 visuals */
.gradepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.gp{border:0;background:var(--surface);border-radius:16px;padding:8px 18px;font-family:var(--font-display);font-weight:800;font-size:22px;box-shadow:0 0 0 3px var(--line);min-width:80px}
.gp[aria-pressed="true"]{background:var(--math);color:var(--surface);box-shadow:none}
.gp.pressed{transform:scale(.96)}
.v-clock{fill:var(--board);stroke:var(--ink);stroke-width:4}
.v-tick{stroke:var(--muted);stroke-width:1.5}
.v-hh{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.v-mh{stroke:var(--m-blue);stroke-width:4;stroke-linecap:round}
.v-pin{fill:var(--ink)}
.v-shape{fill:var(--math-soft);stroke:var(--math);stroke-width:4;stroke-linejoin:round}
.v-crayon{fill:var(--pop)}
.v-ruler{fill:var(--sci-soft);stroke:var(--ink);stroke-width:2}
.v-g0{fill:var(--board);stroke:var(--muted);stroke-width:1}
.v-g1{fill:var(--shade);stroke:var(--ink);stroke-width:1}
.v-axis{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.v-pt{fill:var(--m-red);stroke:var(--ink);stroke-width:2}
.v-prot{fill:var(--board);stroke:var(--ink);stroke-width:2}
.v-halo{paint-order:stroke;stroke:var(--board);stroke-width:5px;stroke-linejoin:round}
.v-ray{stroke:var(--m-blue);stroke-width:4;stroke-linecap:round}
.v-arc{fill:none;stroke:var(--m-red);stroke-width:3}
.v-arc2{fill:none;stroke:var(--m-purple);stroke-width:3;stroke-dasharray:6 5}
.v-ln{stroke:var(--math);stroke-width:4;stroke-linecap:round;fill:none}
.v-arrow{fill:var(--math)}
.v-th{fill:var(--math-soft);stroke:var(--ink);stroke-width:2}
.v-tbl{fill:var(--board);stroke:var(--ink);stroke-width:2}
@media (max-width:480px){.gradepick .gp{min-width:0;flex:1 1 0;padding:8px 6px}}

    return {...numChoices(s,[dAdd(a,b),s+10,s-10,s+100]),q:`${a} + ${b} = ?`,e:`Add the ones first, then the tens, then the hundreds. When a column makes 10 or more, regroup and carry 1 to the next place. ${a} + ${b} = ${s}.`}}
  let a,b;do{a=rnd(402,950);b=rnd(128,a-60)}while(dSub(a,b)===a-b);const d=a-b;
  return {...numChoices(d,[dSub(a,b),d+10,d-10,d+100]),q:`${a} − ${b} = ?`,e:`Start with the ones. If the top digit is smaller, borrow 1 from the next place. Check: ${d} + ${b} = ${a}.`}}
function gMult(){const a=rnd(2,10),b=rnd(2,10),p=a*b,v=Math.random();
  if(v<.3&&a<=6&&b<=8)return {...numChoices(p,[a*(b+1),a*(b-1),a+b]),q:`There are ${a} rows with ${b} dots in each row. How many dots in all?`,visual:arraySvg(a,b),e:`${a} rows of ${b} is ${a} × ${b} = ${p}.`};
  if(v<.6)return {...numChoices(b,[b+1,b-1,p-a]),q:`${a} × ? = ${p}`,e:`Think: what number times ${a} makes ${p}? ${a} × ${b} = ${p}.`};
  return {...numChoices(p,[a*(b+1),a*(b-1),a+b,p+10]),q:`${a} × ${b} = ?`,e:`${a} groups of ${b} make ${p}. You can skip count by ${b}: ${Array.from({length:a},(_,i)=>b*(i+1)).join(', ')}.`}}
function gDiv(){const b=rnd(2,10),q=rnd(2,10),p=b*q;
  if(Math.random()<.4){const it=pick(['crayons','cookies','marbles','stickers','pencils']);
    return {...numChoices(q,[q+1,q-1,p-b]),q:`${fmt(p)} ${it} are shared equally into ${b} groups. How many ${it} are in each group?`,e:`Divide: ${p} ÷ ${b} = ${q}. Check with multiplication: ${b} × ${q} = ${p}.`}}
  return {...numChoices(q,[q+1,q-1,p-b]),q:`${p} ÷ ${b} = ?`,e:`Use the related fact: ${b} × ${q} = ${p}, so ${p} ÷ ${b} = ${q}.`}}
function gWord(){const n=pick(NAMES),t=rnd(0,4);
  if(t===0){const a=rnd(3,9),b=rnd(3,9),it=pick(['apples','books','toy cars','shells']);return {...numChoices(a*b,[a+b,a*b+a,a*b-b]),q:`${n} has ${a} bags with ${b} ${it} in each bag. How many ${it} does ${n} have in all?`,e:`Equal groups means multiply: ${a} × ${b} = ${a*b}.`}}
  if(t===1){const b=rnd(3,8),q=rnd(3,9);return {...numChoices(q,[q+1,b*q-b,q-1]),q:`${n} has ${b*q} stickers to share equally with ${b} friends. How many stickers does each friend get?`,e:`Sharing equally means divide: ${b*q} ÷ ${b} = ${q}.`}}
  if(t===2){const a=rnd(215,589),b=rnd(126,349);return {...numChoices(a+b,[a-b,dAdd(a,b),a+b+10]),q:`A school library had ${a} books. It got ${b} more books. How many books does it have now?`,e:`"More" means add: ${a} + ${b} = ${a+b}.`}}
  if(t===3){const a=rnd(5,9)*100,b=rnd(112,388);return {...numChoices(a-b,[a+b,dSub(a,b),a-b+10]),q:`${n} had ${a} points in a game and lost ${b} points. How many points are left?`,e:`"Lost" means subtract: ${a} − ${b} = ${a-b}.`}}
  const p=pick([4,5,6,10]),k=rnd(3,6),g=rnd(2,p+3);return {...numChoices(p*k-g,[p*k,p*k+g,p+k-g]),q:`Pencils come in packs of ${p}. ${n} buys ${k} packs and gives away ${g} pencils. How many pencils are left?`,e:`Step 1: ${k} × ${p} = ${p*k} pencils. Step 2: ${p*k} − ${g} = ${p*k-g}.`}}
function gFrac(){const t=rnd(0,3);
  if(t===0||t===1){const d=pick([2,3,4,6,8]),n=rnd(1,d-1),not=t===1&&n!==d-n;const ans=not?`${d-n}/${d}`:`${n}/${d}`;
    return {...strChoices(ans,[not?`${n}/${d}`:`${d-n}/${d}`,`${n}/${d+1}`,`${d}/${n}`,`${n}/${d+2}`,`${n+1}/${d}`].filter(x=>x!==ans)),q:`What fraction of the bar is ${not?'NOT shaded':'shaded'}?`,visual:barSvg(n,d),
      e:`The bar has ${d} equal parts (the bottom number). ${not?d-n:n} ${(not?d-n:n)===1?'part is':'parts are'} ${not?'not shaded':'shaded'} (the top number), so the answer is ${ans}.`}}
  if(t===2){const d=pick([6,8]);const ns=shuffle([1,2,3,4,5,6,7].filter(x=>x<d)).slice(0,4);const big=Math.random()<.6;const tn=big?Math.max(...ns):Math.min(...ns);
    return {a:`${tn}/${d}`,choices:ns.map(n=>`${n}/${d}`),q:`Which fraction is the ${big?'greatest':'least'}?`,e:`All the pieces are the same size (eighths or sixths). The one with the ${big?'most':'fewest'} pieces, ${tn}/${d}, is the ${big?'greatest':'least'}.`}}
  const ds=shuffle([2,3,4,6,8]).slice(0,4),big=Math.random()<.6,td=big?Math.min(...ds):Math.max(...ds);
  return {a:`1/${td}`,choices:ds.map(d=>`1/${d}`),q:`Which fraction is the ${big?'greatest':'least'}?`,e:`When the top numbers are both 1, fewer pieces means bigger pieces. 1/${td} has the ${big?'biggest':'smallest'} pieces.`}}
function gGeo(){let l,w;do{l=rnd(3,12);w=rnd(2,9)}while(l===w);const unit=pick(['cm','in.','ft','m']);
  if(Math.random()<.5){const P=2*(l+w);return {_n:[P,[l*w,l+w,2*l+w]],q:`What is the perimeter of the rectangle?`,visual:rectSvg(l,w,unit),u:unit,
    e:`Perimeter is the distance around. Add all 4 sides: ${l} + ${w} + ${l} + ${w} = ${P} ${unit}.`}}
  const A=l*w;return {_n:[A,[2*(l+w),l+w,A+l]],q:`What is the area of the rectangle?`,visual:rectSvg(l,w,unit),u:`square ${unit==='in.'?'inches':unit==='ft'?'feet':unit==='m'?'meters':'centimeters'}`,
    e:`Area is how many unit squares cover it. Multiply length × width: ${l} × ${w} = ${A} square units.`}}
const tm=m=>{let h=Math.floor(m/60),mm=m%60;h=h>12?h-12:h;return `${h}:${String(mm).padStart(2,'0')} p.m.`};
function gTimeMoney(){const t=rnd(0,2);
  if(t===0){const h=rnd(1,8),m=rnd(0,9)*5,e=pick([15,20,25,30,35,40,45,50,55,65,75]);const s=(h+12)*60+m,end=s+e;const ev=pick(['Soccer practice','A movie','Piano lessons','The science fair']);
    return {...numChoices(end,[end+10,end-10,end+60,end-5],tm),q:`${ev} starts at ${tm(s)} and lasts ${e>=60?`1 hour ${e-60} minutes`:`${e} minutes`}. What time does it end?`,
      e:`Count forward from ${tm(s)}. ${e>=60?`Add 1 hour, then ${e-60} more minutes`:`Add ${e} minutes`} to get ${tm(end)}.`}}
  if(t===1){const h=rnd(1,8),m=rnd(0,6)*5,e=rnd(3,11)*5;const s=(h+12)*60+m;
    return {...numChoices(e,[e+5,e-5,e+10,(s+e)%60],x=>`${x} minutes`),q:`${pick(NAMES)} started reading at ${tm(s)} and stopped at ${tm(s+e)}. How long did ${pick(['she','he','they'])} read?`,
      e:`Count on from ${tm(s)} to ${tm(s+e)} by fives: that is ${e} minutes.`}}
  let q,d,n,p;do{q=rnd(0,3);d=rnd(0,4);n=rnd(0,3);p=rnd(0,4)}while([q,d,n,p].filter(x=>x>0).length<3);
  const tot=q*25+d*10+n*5+p,coins=[...Array(q).fill('q'),...Array(d).fill('d'),...Array(n).fill('n'),...Array(p).fill('p')];
  const money=c=>`$${(c/100).toFixed(2)}`;
  return {...numChoices(tot,[q+d+n+p,tot+n*5,tot-5,tot+10],money),q:`How much money is this?`,visual:coinSvg(coins),
    e:`Count the biggest coins first: ${[q&&`${q} quarter${q>1?'s':''} = ${q*25}¢`,d&&`${d} dime${d>1?'s':''} = ${d*10}¢`,n&&`${n} nickel${n>1?'s':''} = ${n*5}¢`,p&&`${p} penn${p>1?'ies':'y'} = ${p}¢`].filter(Boolean).join(', ')}. Total: ${money(tot)}.`}}

  ["Which force helps a bike slow down when you squeeze the brakes?", "Friction", ["Magnetism", "Light", "Sound"], "Brake pads rub the wheel and create friction."],
  ["A ball rolls across a level floor and no one touches it. What happens?", "It slowly stops because of friction", ["It speeds up forever", "It turns into a magnet", "It rolls uphill"], "Friction from the floor and air slows it down."],
 ]},
 {id:'c4',ch:'Chapter 4',nm:'Everyday Energy',qs:[
  ['Which material lets almost all light pass through?','Clear glass (transparent)',['Wax paper (translucent)','A wooden board (opaque)','A brick (opaque)'],'Transparent materials let light pass straight through.'],
  ['Wax paper lets some light through, but you cannot see clearly through it. It is…','translucent',['transparent','opaque','magnetic'],'Translucent materials let some light pass through.'],
  ['Which material blocks light and makes a shadow?','A wooden door (opaque)',['A clear window','Plastic wrap','Clean water'],'Opaque materials block light. A shadow forms behind them.'],
  ['What makes sound?','Vibrations',['Shadows','Magnets','Gravity'],'Sound is made when something vibrates, or moves back and forth quickly.'],
  ['How can you make a drum sound louder?','Hit it harder',['Hit it softer','Paint it a new color','Put it in the shade'],'Hitting harder makes bigger vibrations, which make a louder sound.'],
  ['Thermal energy always moves from…','a warmer object to a cooler object',['a cooler object to a warmer object','a dark object to a light object','a big object to a small object'],'Heat flows from warm things to cool things until they are the same temperature.'],
  ['A metal spoon sits in hot soup. Why does the spoon get hot?','Thermal energy moves from the soup to the spoon',['Cold moves out of the spoon','Light moves into the spoon','The spoon makes its own heat'],'Thermal energy moves from the hot soup into the cooler spoon.'],
  ['Ice cream melts in your hand. Why?','Thermal energy moves from your hand to the ice cream',['Cold moves into your hand','The ice cream makes heat','Sound melts it'],'Your warm hand transfers thermal energy to the cold ice cream. Cold does not move; heat does.'],
  ['Which of these makes its own light?','The Sun',['The Moon','A mirror','A window'],'The Sun makes its own light. The Moon only reflects sunlight.'],
  ['A traffic light uses which type of energy to send a message to drivers?','Light energy',['Sound energy','Thermal energy','Magnetic energy'],'The colored lights send signals we can see.'],
  ["Which is an example of sound energy?", "A dog barking", ["A sunbeam", "A warm blanket", "A shadow"], "Sound energy is made by vibrations that we hear."],
  ["Which is an example of thermal energy?", "Heat from a campfire", ["A ringing bell", "A rolling marble", "A shadow on the wall"], "Thermal energy is the energy of heat."],
  ["How does light travel?", "In straight lines", ["In circles", "Only in zigzags", "It does not move"], "Light moves in straight lines until it hits something."],
  ["How does a shadow form?", "An opaque object blocks light", ["Light bends around objects", "Sound blocks the light", "Heat makes a dark spot"], "When light cannot pass through an object, a shadow forms behind it."],
  ["When is your shadow longest on a sunny day?", "Early morning or late afternoon", ["At noon", "At midnight", "It never changes"], "When the Sun is low in the sky, shadows stretch out long."],
  ["What travels through the air to your ears so you can hear?", "Sound", ["Shadows", "Magnets", "Fossils"], "Vibrations travel through the air as sound waves."],
  ["A guitar string vibrates faster. What kind of sound does it make?", "A higher sound", ["A lower sound", "No sound", "A colder sound"], "Faster vibrations make higher-pitched sounds."],
  ["You rub your hands together fast and they get warm. What does this show?", "Motion can make thermal energy", ["Cold leaves your hands", "Light goes into your hands", "Sound turns into ice"], "Rubbing makes friction, which produces heat."],
  ["Which would keep hot soup warm the longest?", "A closed thermos", ["A thin metal cup", "An open paper plate", "A bowl of ice"], "A thermos is an insulator. It slows thermal energy from escaping."],
  ["Why do cooks wear oven mitts?", "To protect hands from the thermal energy of hot pans", ["To make food cook faster", "To keep cold air in", "To make light"], "Oven mitts slow heat from reaching your skin."],
  ["Solar panels on a roof use energy from…", "the Sun’s light", ["the sound of wind", "the Moon", "magnets in the ground"], "Solar panels change sunlight into electricity."],
  ["Which object reflects light the best?", "A shiny mirror", ["A black cloth", "A wooden block", "A brown paper bag"], "Smooth, shiny surfaces bounce light back."],
  ["A fire truck’s siren uses which kind of energy?", "Sound energy", ["Thermal energy", "Magnetic energy", "Gravity"], "The siren vibrates to make a loud sound that warns people."],
  ["A flashlight changes energy stored in batteries into…", "light energy", ["sound only", "cold", "magnetism"], "When you turn it on, the flashlight gives off light."],
  ["An ice cube on a sunny sidewalk melts. Why?", "Energy from the Sun warms it", ["Cold leaves the ice", "The ice gives off light", "Sound breaks it apart"], "Thermal energy from the Sun and sidewalk moves into the ice."],
  ["Which window lets in light but keeps people from seeing inside clearly?", "Frosted glass (translucent)", ["Clear glass (transparent)", "A brick wall (opaque)", "A wooden board (opaque)"], "Translucent materials let some light through but blur what is behind them."],
  ["Which object is transparent?", "Clear plastic wrap", ["A cardboard box", "A wooden spoon", "A brick"], "Transparent materials let light pass straight through."],
  ["When you talk, what vibrates to make the sound?", "Your vocal cords in your throat", ["Your hair", "Your shoes", "Your eyes"], "Put your fingers on your throat while you hum to feel it."],
  ["Why do people wear light-colored clothes in hot weather?", "They soak up less of the Sun’s heat", ["They are heavier", "They make more sound", "They are magnetic"], "Dark colors absorb more thermal energy from sunlight."],
  ["A toaster uses electricity to make which kind of energy to brown bread?", "Thermal energy", ["Sound energy", "Magnetic energy", "No energy"], "The glowing wires inside get hot."],
 ]},
 {id:'c5',ch:'Chapter 5',nm:'Mechanical Energy and Speed',qs:[
  ['Mechanical energy is the energy of an object’s…','motion and position',['color','smell','temperature only'],'Moving objects and objects that can fall or spring back have mechanical energy.'],
  ['Which object has mechanical energy because it is moving?','A rolling ball',['A book sitting still on the floor','A sleeping cat','A parked bike'],'Anything in motion has mechanical energy.'],
  ['Two identical balls roll. One is faster. Which has more mechanical energy?','The faster ball',['The slower ball','They always have the same','Neither ball'],'The faster an object moves, the more mechanical energy of motion it has.'],
  ['Speed tells you…','how far something moves in an amount of time',['how heavy something is','how hot something is','what color something is'],'Speed compares distance and time.'],
  ['Maya and Leo both run 50 meters. Maya takes 10 seconds and Leo takes 15 seconds. Who is faster?','Maya',['Leo','They are the same speed','You cannot tell'],'Same distance, less time means faster. Maya finished in less time.'],
  ['In 10 seconds a car goes 30 meters and a bike goes 20 meters. Which is faster?','The car',['The bike','They are the same','Neither one moved'],'Same time, more distance means faster.'],
  ['A ball sits at the top of a ramp. What happens to its energy as it rolls down?','Energy of position changes to energy of motion',['It loses all of its mass','It turns into light','It gets colder'],'Height gives the ball stored energy that changes into motion as it rolls.'],
  ['You make a ramp steeper. How will a toy car most likely move?','Faster',['Slower','It will not move','Backward up the ramp'],'A steeper ramp lets gravity speed the car up more.'],
  ['Wind turns the blades of a windmill. What kind of energy do the moving blades have?','Mechanical energy',['Sound energy only','Light energy','No energy'],'The blades are moving, so they have mechanical energy.'],
  ['To find a toy car’s speed, what two things do you measure?','Distance and time',['Mass and color','Temperature and light','Shape and size'],'Speed = how far it went in how much time.'],
  ["A stretched rubber band has…", "stored energy that can make it move", ["no energy at all", "only light energy", "only sound energy"], "When you let go, the stored energy becomes motion."],
  ["Which has the most mechanical energy?", "A car driving fast on a highway", ["A parked car", "A car with the engine off", "A toy car on a shelf"], "The faster something moves, the more energy of motion it has."],
  ["Which of these moves the fastest?", "A cheetah running", ["A snail", "A turtle", "A sloth"], "A cheetah covers the most distance in the least time."],
  ["Two cars race 100 meters. The red car takes 8 seconds and the blue car takes 12 seconds. Which is faster?", "The red car", ["The blue car", "They are the same", "You cannot tell"], "Same distance, less time means faster."],
  ["A ball rolls 12 meters in 4 seconds. How many meters does it roll each second?", "3 meters", ["4 meters", "8 meters", "16 meters"], "12 ÷ 4 = 3 meters each second."],
  ["A kid pedals a bike harder and goes faster. What happens to the bike’s mechanical energy?", "It increases", ["It decreases", "It becomes zero", "It turns into light"], "More speed means more energy of motion."],
  ["Where does a roller coaster have the most energy of position?", "At the top of the tallest hill", ["At the bottom of a hill", "While parked at the station", "On flat track"], "The higher an object is, the more stored energy of position it has."],
  ["Where is a roller coaster usually fastest?", "At the bottom of the biggest hill", ["At the very top", "While parked", "Before it starts moving"], "Going down, position energy changes into motion energy."],
  ["Which everyday action uses mechanical energy?", "Riding a scooter", ["Looking at a picture", "Smelling a flower", "Watching a shadow"], "Moving your body and the scooter uses mechanical energy."],
  ["What pushes a nail into wood?", "The mechanical energy of the moving hammer", ["Light from the hammer", "The hammer’s color", "Cold air"], "The moving hammer transfers its energy to the nail."],
  ["You wind up a toy. What happens when you let it go?", "Stored energy changes into motion", ["It gets colder", "It turns into light", "Nothing happens"], "Winding stores energy that is released as movement."],
  ["To compare two toy cars’ speeds fairly, you should…", "time each car over the same distance", ["use different ramps", "time only one car", "just guess"], "Keep the distance the same so the times can be compared."],
  ["Ball A rolls 2 meters and Ball B rolls 5 meters in the same amount of time. Which is faster?", "Ball B", ["Ball A", "They are the same", "Neither moved"], "Same time, more distance means faster."],
  ["A skateboarder rides down a taller ramp. What will most likely happen?", "She will go faster at the bottom", ["She will go slower", "She will stop at the top", "Nothing changes"], "Starting higher gives more energy to change into speed."],
  ["Which tool would you use to measure time in a speed test?", "A stopwatch", ["A thermometer", "A pan balance", "A hand lens"], "A stopwatch measures time in seconds."],
  ["Which object has stored energy because of its position?", "A rock at the top of a hill", ["A rock resting on flat ground", "A leaf lying on the ground", "A ball resting in a hole"], "An object up high can fall or roll, so it has energy of position."],
  ["Which of these moves at the slowest speed?", "A snail", ["A car", "A horse", "A bike"], "A snail covers very little distance in a lot of time."],
  ["A car goes 60 meters in 3 seconds. How many meters does it go each second?", "20 meters", ["3 meters", "30 meters", "63 meters"], "60 ÷ 3 = 20 meters each second."],
  ["When does a swing have the most energy of position?", "At its highest point", ["At its lowest point", "When it is parked", "It never has any"], "Higher means more stored energy of position."],
  ["A bouncing ball bounces lower each time. Why?", "Some energy changes into sound and heat each bounce", ["Gravity stops working", "The ball gets heavier", "The floor gets taller"], "Energy is not lost, but it changes into forms that do not lift the ball."],
 ]},
 {id:'c6',ch:'Chapter 6',nm:'Earth’s Surface and Resources',qs:[
  ['What is a landslide?','Soil and rocks sliding quickly down a slope',['A slow change over millions of years','A storm with lots of wind','A wave in the ocean'],'A landslide is a rapid change to Earth’s surface.'],
  ['Which can cause a landslide?','Heavy rain or an earthquake',['A sunny day','A full moon','A quiet night'],'Heavy rain makes soil loose and heavy. Earthquakes shake the land.'],
  ['Which is a RAPID change to Earth’s surface?','A volcano erupting',['A canyon slowly carved by a river','Wind wearing down a rock over years','A mountain slowly wearing away'],'Volcanoes, earthquakes, and landslides change land in minutes or days.'],
  ['What is erosion?','Moving soil and rock from one place to another',['Making new rocks','Plants growing','Water freezing'],'Water, wind, and ice carry soil and rock to new places.'],
  ['Which is a natural resource?','Water',['A plastic toy','A video game','A car'],'Natural resources come from nature, like water, soil, air, and trees.'],
  ['Which resource is renewable?','Sunlight',['Coal','Oil','Natural gas'],'Renewable resources can be replaced, like sunlight, wind, and trees.'],
  ['How can you conserve water?','Turn off the faucet while brushing your teeth',['Take very long showers','Leave the hose running','Water the yard at noon every day'],'Conserving means using less so there is enough for later.'],
  ['Using an old jar to hold crayons is an example of…','reusing',['wasting','polluting','eroding'],'Reusing means using something again instead of throwing it away.'],
  ['Why is soil an important resource?','Plants grow in it, and we get food from plants',['It makes light','It keeps magnets working','It makes sound'],'Soil holds water and nutrients that plants need to grow.'],
  ['Texas ranchers often raise cattle on grassland. Why is grassland useful for cattle?','Cattle eat the grass',['Grass blocks the wind completely','Grass makes rain','Cattle sleep in trees'],'Land and its resources affect how people live and work.'],
  ["What is an earthquake?", "Sudden shaking of the ground", ["A slow breeze", "Rain falling", "The Sun rising"], "Earthquakes can change land quickly and cause landslides."],
  ["What can quickly change land by pouring out hot, melted rock?", "A volcano", ["A breeze", "A puddle", "A rainbow"], "Volcanic eruptions build new land fast."],
  ["Which is a SLOW change to Earth’s surface?", "A river carving a canyon over many years", ["A landslide", "An earthquake", "A volcano erupting"], "Slow changes take many years or even millions of years."],
  ["What is weathering?", "Breaking rocks into smaller pieces", ["Moving soil from place to place", "Building a mountain in one day", "Melting ice into water"], "Weathering breaks rock. Erosion moves the pieces."],
  ["How can people help stop soil from washing off a hill?", "Plant grass and trees", ["Remove all the plants", "Pour more water on it", "Dig holes everywhere"], "Plant roots hold soil in place."],
  ["In a model, you tilt a tray of soil and pour water on it. What will most likely happen?", "Soil slides down the slope", ["Soil moves up the slope", "The soil turns into rock", "Nothing happens"], "This models how heavy rain can cause a landslide."],
  ["Which resource is nonrenewable?", "Coal", ["Wind", "Sunlight", "Trees"], "Coal took millions of years to form, so we cannot replace it quickly."],
  ["Why should we conserve nonrenewable resources?", "They take millions of years to form", ["They grow back quickly", "They are not useful", "We can make more in a factory"], "Once used up, nonrenewable resources are gone for a very long time."],
  ["Which is an example of recycling?", "Putting a can in the recycling bin so it can become something new", ["Throwing a can in the trash", "Burying a can in the yard", "Leaving a can on the ground"], "Recycling turns used materials into new products."],
  ["Which is an example of reducing?", "Using a refillable water bottle", ["Buying lots of plastic bottles", "Leaving the lights on", "Printing extra paper"], "Reducing means using less of a resource."],
  ["Which natural resource do people use to build houses?", "Trees (wood)", ["Wind", "Sunlight", "Air"], "Wood from trees is used for building."],
  ["How do people use wind as a resource?", "To turn wind turbines and make electricity", ["To grow rocks", "To make soil", "To make oil"], "Texas makes lots of electricity from wind turbines."],
  ["Which action can pollute water?", "Dumping trash into a river", ["Picking up litter", "Planting trees", "Recycling cans"], "Trash and chemicals in water hurt plants, animals, and people."],
  ["What is soil made of?", "Bits of rock, decayed plants and animals, water, and air", ["Only sand", "Only water", "Plastic"], "Soil is a mix of weathered rock and once-living material."],
  ["Which kind of soil holds the most water?", "Clay", ["Sand", "Gravel", "Pebbles"], "Clay has tiny, tightly packed particles that hold water."],
  ["What can a landslide do to buildings on a hill?", "Damage or move them", ["Make them taller", "Paint them", "Nothing at all"], "Fast-moving soil and rock can destroy roads and houses."],
  ["Waves move sand along a Texas beach. This is an example of…", "erosion", ["a volcano", "melting", "recycling"], "Moving water carries sand to new places."],
  ["Which resource can be used again and again because it is always being replaced?", "Wind", ["Coal", "Oil", "Natural gas"], "Wind keeps blowing, so it is renewable."],
  ["Which is a way to conserve electricity?", "Turn off lights when you leave a room", ["Leave the TV on all night", "Open the fridge for a long time", "Keep every light on"], "Using less electricity saves resources."],
  ["A huge flood rushes through a valley. How can it change the land?", "It can wash away soil quickly", ["It builds a mountain", "It plants trees", "It makes rocks grow"], "Floods are rapid changes to Earth’s surface."],
 ]},
 {id:'c7',ch:'Chapter 7',nm:'Weather and Space',qs:[
  ['Which tool measures how much rain fell?','Rain gauge',['Thermometer','Wind vane','Hand lens'],'A rain gauge collects and measures precipitation.'],
  ['Which tool shows the direction the wind is blowing?','Wind vane',['Rain gauge','Thermometer','Pan balance'],'A wind vane points to show where the wind comes from.'],
  ['Which is a kind of precipitation?','Snow',['Fog','Wind','Sunshine'],'Precipitation is water falling from clouds: rain, snow, sleet, or hail.'],
  ['It is sunny in El Paso and raining in Houston at the same time. What does this show?','Weather can be different in different places at the same time',['Weather is the same everywhere','The thermometer is broken','It is nighttime in both cities'],'Weather changes from place to place.'],
  ['How long does it take Earth to orbit the Sun one time?','About one year',['One day','One week','One hour'],'Earth takes about 365 days to travel around the Sun.'],
  ['What causes day and night?','Earth spinning (rotating) once every day',['The Sun moving around Earth','The Moon blocking the Sun','Clouds covering the sky'],'As Earth rotates, one side faces the Sun (day) and the other side faces away (night).'],
  ['What does the Moon orbit?','Earth',['The Sun only','Mars','It does not move'],'The Moon travels around Earth about once a month.'],
  ['Which planet is closest to the Sun?','Mercury',['Earth','Mars','Neptune'],'The order is Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.'],
  ['Earth is which planet from the Sun?','Third',['First','Fifth','Eighth'],'Mercury, Venus, then Earth. Earth is third.'],
  ['Which is the largest planet in our solar system?','Jupiter',['Earth','Mercury','Mars'],'Jupiter is the biggest planet. It comes after Mars.'],
  ['The Sun is a…','star',['planet','moon','comet'],'The Sun is the star at the center of our solar system.'],
  ['What tool helps scientists observe comets far away in space?','A telescope',['A rain gauge','A pan balance','A thermometer'],'Telescopes make faraway objects look closer and clearer.'],
  ["Which tool measures wind speed?", "Anemometer", ["Rain gauge", "Thermometer", "Wind vane"], "An anemometer has cups that spin faster in stronger wind."],
  ["What is weather?", "What the air outside is like at a certain time and place", ["The shape of the land", "The type of rocks", "A planet"], "Weather includes temperature, wind, clouds, and precipitation."],
  ["The thermometer outside reads 35 °C. What should you wear?", "Shorts and a T-shirt", ["A heavy coat", "Snow boots", "Mittens"], "35 °C is about 95 °F, which is hot."],
  ["Which clouds usually bring rain?", "Dark gray clouds", ["Thin, wispy white clouds", "No clouds at all", "Small puffy clouds on a sunny day"], "Thick, dark clouds are full of water drops."],
  ["What is precipitation?", "Water that falls from clouds to the ground", ["Water flowing in a river", "Water in a swimming pool", "Wind blowing leaves"], "Rain, snow, sleet, and hail are all precipitation."],
  ["Why is it helpful to know the weather forecast?", "To plan what to wear and stay safe", ["To change the weather", "To move the Sun", "To grow taller"], "Forecasts help people prepare for rain, heat, or storms."],
  ["Which planet is known as the red planet?", "Mars", ["Jupiter", "Venus", "Neptune"], "Mars looks red because of rusty dust on its surface."],
  ["Which planet is farthest from the Sun?", "Neptune", ["Mercury", "Earth", "Mars"], "Neptune is the eighth and last planet."],
  ["Which planet has large, bright rings?", "Saturn", ["Mercury", "Mars", "Earth"], "Saturn’s rings are made of ice and rock."],
  ["Which planet comes right after Earth, moving away from the Sun?", "Mars", ["Venus", "Jupiter", "Mercury"], "Earth is third and Mars is fourth."],
  ["How many planets are in our solar system?", "8", ["9", "7", "10"], "Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune."],
  ["Why does the Moon shine at night?", "It reflects light from the Sun", ["It makes its own light", "It is on fire", "It has lamps on it"], "The Moon has no light of its own."],
  ["Which is closest to Earth?", "The Moon", ["The Sun", "Mars", "Jupiter"], "The Moon is Earth’s nearest neighbor in space."],
  ["What is a comet made of?", "Ice, rock, and dust", ["Only fire", "Only metal", "Only water"], "When a comet gets near the Sun, its ice melts and makes a glowing tail."],
  ["A streak of light in the night sky from a space rock burning up in Earth’s air is a…", "meteor", ["planet", "star", "cloud"], "Meteors are often called shooting stars, but they are not stars."],
  ["What is the solar system?", "The Sun and all the planets and objects that orbit it", ["Only Earth and the Moon", "All the stars in the sky", "Only the planets near Earth"], "Everything that travels around our Sun is part of the solar system."],
  ["Which is the largest object in our solar system?", "The Sun", ["Jupiter", "Earth", "The Moon"], "The Sun is much bigger than all the planets."],
  ["Which describes most Texas summer days?", "Hot", ["Snowy", "Freezing", "Icy"], "Texas summers are usually very hot."],
 ]},
 {id:'c8',ch:'Chapter 8',nm:'Living Things and Their Environment',qs:[
  ['There has been very little rain for months. What will most likely happen to the plants?','They wilt and grow less',['They grow taller and greener','They turn into rocks','Nothing changes'],'Plants need water. A drought makes them wilt or die.'],
  ['A pond dries up. What might happen to the frogs that lived there?','They must move to find water or they may die',['They turn into fish','They grow bigger','Nothing happens to them'],'When the environment changes, animals must move, adapt, or may not survive.'],
  ['How do some animals survive a very cold winter?','They hibernate or migrate',['They melt','They grow leaves','They stop needing food forever'],'Some animals sleep through winter. Others travel to warmer places.'],
  ['A bean plant is kept in a dark closet. How will it most likely grow?','Pale and weak',['Tall and dark green','It grows flowers faster','It grows the same as one in sunlight'],'Plants need light to make food and grow healthy.'],
  ['What is the correct order of a plant’s life cycle?','Seed → seedling → adult plant → flowers and seeds',['Flower → seed → adult → seedling','Adult → seed → seedling → flower','Seedling → seed → flower → adult'],'A plant starts as a seed, grows, then makes flowers and new seeds.'],
  ['What is the correct order of a frog’s life cycle?','Egg → tadpole → froglet → adult frog',['Tadpole → egg → adult → froglet','Adult → tadpole → egg → froglet','Egg → adult → tadpole → froglet'],'Frogs change form as they grow. This is called metamorphosis.'],
  ['What is the stage of a butterfly’s life cycle inside a chrysalis called?','Pupa',['Egg','Larva','Adult'],'Egg → larva (caterpillar) → pupa (chrysalis) → adult butterfly.'],
  ['What can fossils tell us?','What plants and animals lived long ago and what their environment was like',['What the weather will be tomorrow','How fast a car is going','How much a rock weighs today'],'Fossils are evidence of past life and past environments.'],
  ['A fossil of a fish is found in a dry desert. What does this tell us?','The area was once covered by water',['Fish can live in deserts','The fossil fell from the sky','Deserts have always been dry'],'Fish lived in water, so that place was once wet.'],
  ['A flood covers a field for many days. What might happen to the animals living there?','Some move away to find dry land',['They all grow gills','They stop needing food','Nothing changes'],'Big changes in an environment affect where animals can live.'],
  ["What do plants need to survive?", "Water, air, sunlight, and nutrients", ["Only candy", "Only darkness", "Only rocks"], "Plants need these things to make food and grow."],
  ["What do animals need to survive?", "Food, water, air, and shelter", ["Only toys", "Only sunlight", "Only sleep"], "Animals depend on their environment for these needs."],
  ["A very hot summer dries up a stream. What will most likely happen to the fish?", "They may not survive", ["They grow legs", "They turn into birds", "They fly away"], "Fish need water. Losing their habitat is a big danger."],
  ["Lima bean seeds are kept in a warm place and a cold refrigerator. Which will most likely sprout first?", "The seeds in the warm place", ["The seeds in the refrigerator", "Both at exactly the same time", "Neither will ever sprout"], "Seeds need the right temperature to germinate."],
  ["Why do some trees lose their leaves in the fall?", "To save water when it gets cold and dry", ["They are dying forever", "Birds eat all the leaves", "Magnets pull them off"], "Dropping leaves helps trees survive winter."],
  ["Some birds fly south when winter comes. What is this called?", "Migration", ["Hibernation", "Pollination", "Germination"], "Migration is moving to a new place for food and warmth."],
  ["Some bears sleep through most of the winter. What is this called?", "Hibernation", ["Migration", "Pollination", "Evaporation"], "Hibernation saves energy when food is hard to find."],
  ["What is the correct order of a chicken’s life cycle?", "Egg → chick → adult chicken", ["Chick → egg → adult chicken", "Adult chicken → chick → egg", "Egg → adult chicken → chick"], "A chicken hatches from an egg, grows up, then lays eggs."],
  ["A caterpillar is which stage of a butterfly’s life cycle?", "Larva", ["Egg", "Pupa", "Adult"], "The caterpillar (larva) eats and grows before becoming a pupa."],
  ["What happens during germination?", "A seed begins to sprout and grow", ["A plant loses its leaves", "A seed turns into stone", "A butterfly lays eggs"], "Germination is the start of a plant’s life cycle."],
  ["What is a fossil?", "The remains or traces of a living thing from long ago, kept in rock", ["A rock made yesterday", "An animal that is alive today", "A kind of cloud"], "Fossils give clues about life long ago."],
  ["Which could become a fossil?", "A shell buried in mud", ["A cloud", "A rainbow", "A sound"], "Hard parts buried in mud or sand can harden into fossils over a long time."],
  ["A fossil palm tree is found in a very cold place. What does this tell us?", "That place was once warm", ["Palm trees love snow", "The fossil walked there", "It was always cold there"], "Palm trees grow in warm places, so the environment has changed."],
  ["Dinosaur footprints pressed into rock are a kind of…", "fossil", ["planet", "mineral water", "seed"], "Footprints are trace fossils that show where animals walked."],
  ["A rainy year makes grass grow tall. What happens to animals that eat grass?", "They have more food, and their numbers may grow", ["They have less food", "They turn into plants", "Nothing happens to them"], "More food can help more animals survive."],
  ["People build a parking lot over a field. What happens to the rabbits living there?", "They lose their home and must move", ["They get more space", "They turn into birds", "Nothing happens"], "Changing a habitat affects the animals that live in it."],
  ["Which animal changes completely as it grows (metamorphosis)?", "A frog", ["A dog", "A horse", "A cat"], "A frog changes from egg to tadpole to adult."],
  ["What is a seedling?", "A young plant", ["A grown tree", "A kind of seed bag", "A flower petal"], "A seedling has just sprouted from a seed."],

 teeth", ["Leave the hose running", "Take very long baths", "Pour water on the sidewalk"], "Saving water helps make sure there is enough for everyone."], ["What falls from clouds when it rains?", "Drops of water", ["Rocks", "Leaves", "Sand"], "Rain is water falling from clouds."], ["Which one is NOT a season?", "Monday", ["Spring", "Summer", "Winter"], "Monday is a day of the week, not a season."], ["How do people use rocks?", "To build walls and roads", ["To eat", "To drink", "To sleep on as a pillow"], "Rocks are strong building materials."], ["What shapes can the Moon look like?", "A circle or a thin curve", ["A square", "A triangle", "A star shape"], "The Moon looks different on different nights."], ["When is it usually the coldest outside?", "Winter", ["Summer", "Spring", "Fall"], "Winter has the coldest days of the year."], ["What are the bright flashes in the sky during a storm?", "Lightning", ["Rainbows", "Sunsets", "Fog"], "Lightning comes with thunderstorms. Go inside!"], ["When can you see a rainbow?", "When the Sun shines while it rains", ["At midnight", "Inside a closet", "When it is dark"], "Sunlight shining through raindrops makes a rainbow."], ["Which tool shows which way the wind blows?", "A windsock", ["A ruler", "A spoon", "A cup"], "A windsock points the way the wind is blowing."], ["Rivers, lakes, and oceans hold…", "water", ["candy", "toys", "sand only"], "Water is a natural resource."], ["What gives us light during the day?", "The Sun", ["The Moon", "The stars", "A rainbow"], "The Sun lights up the day."], ["Which is a good way to keep Earth clean?", "Put trash in a trash can", ["Drop trash on the ground", "Leave lights on", "Waste water"], "Keeping trash where it belongs helps Earth."], ["What is the weather like on a day when you need sunglasses and a hat?", "Sunny", ["Snowy", "Rainy", "Stormy"], "Sunny days are bright."]]}];
const S2=[{id:"s2a",ch:"Physical Science",nm:"Matter and Its Properties",qs:[["Which object is flexible (it bends)?", "A rubber band", ["A rock", "A brick", "A glass marble"], "Flexible things can bend without breaking."], ["Which object is absorbent (it soaks up water)?", "A paper towel", ["A plastic cup", "A metal spoon", "A glass plate"], "Absorbent things soak up liquids."], ["Which object is hard?", "A rock", ["A pillow", "A sponge", "A cotton ball"], "Hard things do not squish when you press them."], ["Which material would make the best raincoat?", "Plastic", ["Paper", "Cotton", "Tissue"], "Plastic does not let water through. We pick materials by their properties."], ["Which one is a solid?", "A wooden block", ["Apple juice", "Air", "Steam"], "A solid keeps its own shape."], ["What happens when you heat ice?", "It melts", ["It freezes", "It gets bigger", "It turns into rock"], "Heating changes solid ice into liquid water."], ["You put a cup of water in the freezer. What happens?", "It freezes into ice", ["It melts", "It boils", "It turns into air"], "Cooling changes liquid water into solid ice."], ["Butter is put in a hot pan. What happens?", "It melts", ["It freezes", "It gets harder", "Nothing"], "Heat melts butter."], ["You cut a sheet of paper into pieces. What changed?", "Its size and shape", ["It is not paper anymore", "It turned into wood", "It turned into water"], "Cutting changes size and shape, but it is still paper."], ["You fold paper into an airplane. What is the airplane made of?", "Still paper", ["Wood", "Metal", "Water"], "Folding changes the shape, not what it is made of."], ["Why are windows made of glass?", "You can see through glass", ["Glass is soft", "Glass soaks up water", "Glass bends easily"], "Glass is clear, so light comes in and we can see out."], ["You mix sand and water. How can you get the sand back?", "Let the water dry up", ["You can never get it back", "Freeze it", "Use a magnet"], "When water evaporates, the sand is left behind."], ["Which object is stiff (it does not bend)?", "A brick", ["A rubber band", "A pipe cleaner", "A ribbon"], "Stiff objects keep their shape when you push on them."], ["Which object is NOT absorbent?", "A plastic plate", ["A sponge", "A paper towel", "A cotton towel"], "Plastic does not soak up water."], ["Which is best for soaking up a spill?", "A sponge", ["Plastic wrap", "Foil", "A glass plate"], "A sponge is very absorbent."], ["Which material would make the strongest wall?", "Bricks", ["Paper", "Cotton", "Jelly"], "Bricks are hard and strong."], ["Which object is the heaviest?", "A bowling ball", ["A balloon", "A feather", "A leaf"], "Weight is a property we can measure."], ["Which change can be undone?", "Freezing water, then melting the ice", ["Baking a cake", "Burning paper", "Cooking an egg"], "Ice can melt back into water, so freezing can be undone."], ["Which change CANNOT be undone?", "Cooking an egg", ["Freezing water", "Melting ice", "Folding paper"], "A cooked egg can never become raw again."], ["Chocolate melted in a warm car. How can it get hard again?", "Put it somewhere cold", ["Heat it more", "Add sand", "Shake it"], "Cooling turns melted chocolate back into a solid."], ["Which one is a liquid?", "Water", ["Ice", "A rock", "Wood"], "Liquids flow and take the shape of their container."], ["Which one is a gas?", "The air in a balloon", ["Milk", "A rock", "Juice"], "Gases spread out to fill their container."], ["Why is a mirror useful?", "It is shiny and reflects light", ["It soaks up water", "It is soft", "It bends easily"], "A mirror reflects, so you can see yourself."], ["Why are cooking pots made of metal?", "Metal heats up well to cook food", ["Metal is soft", "Metal soaks up water", "Metal is clear"], "We pick materials by their properties."], ["Which object is soft?", "A pillow", ["A rock", "A brick", "A metal spoon"], "Soft things squish when you press them."]]},{id:"s2b",ch:"Physical Science",nm:"Forces and Motion",qs:[["You push a toy ve less friction."], ["Why is it hard to pull a wagon up a hill?", "Gravity pulls it back down", ["Magnets pull it", "Light pushes it", "Sound stops it"], "Going uphill, you work against gravity."], ["Why does a ball you throw up come back down?", "Gravity", ["Wind only", "Magnets", "Light"], "Gravity pulls things toward Earth."], ["A bowling ball hits the pins. What happens to the pins?", "They get pushed and fall over", ["Nothing", "They float", "They grow"], "The moving ball pushes the pins."], ["How can you make a paper airplane go farther?", "Throw it with more force", ["Throw it very softly", "Drop it", "Leave it on the table"], "More force gives more motion."], ["You stop pedaling a bike on flat ground. What happens?", "It slows down and stops", ["It speeds up", "It flies", "It goes backward"], "Friction slowly stops the bike."], ["Which force slows down a box sliding across the floor?", "Friction", ["Magnetism", "Light", "Sound"], "Friction happens when surfaces rub together."], ["Which is easier to push across the floor?", "An empty laundry basket", ["A basket full of clothes", "A basket full of books", "A basket full of rocks"], "Lighter things need less force."], ["You stretch a rubber band and let go of a paper ball. What made the paper move?", "The rubber band pushed it", ["Gravity pushed it up", "A magnet pulled it", "Sound moved it"], "The stretched band snaps back and pushes."], ["Where is it easier to pull a sled?", "On snow", ["On a dry road", "On rocks", "On a carpet"], "Snow is smooth and slippery, so there is less friction."], ["Two kids pull a rope with the same force in opposite directions. What happens?", "The rope does not move", ["It moves left fast", "It flies up", "It moves right fast"], "Equal forces in opposite directions are balanced."], ["What can a force change?", "An object’s speed, direction, or shape", ["An object’s name", "An object’s smell", "An object’s age"], "Forces change how things move or their shape."], ["A dog pulls on a leash. Which way does the force pull you?", "Toward the dog", ["Away from the dog", "Straight up", "Nowhere"], "A pull brings things toward the one pulling."]]},{id:"s2c",ch:"Physical Science",nm:"Sound and Energy",qs:[["Sound is made by…", "vibrations", ["shadows", "magnets", "colors"], "Things vibrate, or shake back and forth, to make sound."], ["You pluck a rubber band. What happens?", "It vibrates and makes a sound", ["It melts", "It glows", "It gets colder"], "The fast shaking makes sound."], ["You tap a drum softly. What kind of sound does it make?", "A soft, quiet sound", ["A very loud sound", "No sound", "A light"], "Small vibrations make soft sounds."], ["A short guitar string makes a ___ sound than a long string.", "higher", ["lower", "louder for sure", "colder"], "Shorter strings vibrate faster and make higher sounds."], ["Which one makes a high sound?", "A bird chirping", ["A lion roaring", "Thunder", "A tuba"], "High sounds are like squeaks and chirps."], ["Which one makes a low sound?", "Thunder", ["A bird chirping", "A whistle", "A mouse squeaking"], "Low sounds are deep and rumbly."], ["How does sound get to your ears?", "It travels through the air", ["It travels through light", "It jumps from magnets", "It does not move"], "Vibrations move through the air to your ears."], ["You cover your ears. Sounds seem…", "quieter", ["louder", "brighter", "hotter"], "Covering your ears blocks some of the sound."], ["What does the Sun give us?", "Light and heat", ["Sound and music", "Rain only", "Magnets"], "The Sun warms Earth and lights up the day."], ["A lamp changes electricity into…", "light", ["water", "sound only", "food"], "A lamp uses electricity to make light."], ["How high or low a sound is is called its…", "pitch", ["volume", "color", "speed"], "A bird chirp has a high pitch. A tuba has a low pitch."], ["How loud or soft a sound is is called its…", "volume", ["pitch", "weight", "shape"], "Turning up a radio raises the volume."], ["A big drum usually er measures wind speed."]]},{id:"s2e",ch:"Earth and Space",nm:"Earth Materials and Changes",qs:[["Rocks, soil, and water are all…", "Earth materials", ["toys", "machines", "animals"], "These natural materials come from Earth."], ["Which soil is best for growing plants?", "Dark soil with bits of old plants", ["Only rocks", "Only sand", "Gravel"], "Old plants add nutrients that help new plants grow."], ["Wind and water move soil from one place to another. This is called…", "erosion", ["melting", "freezing", "growing"], "Erosion moves soil and rock to new places."], ["Rain keeps washing soil down a hill. How can people help?", "Plant grass and trees", ["Pull out all the plants", "Pour more water", "Dig more holes"], "Plant roots hold soil in place."], ["Rocks can break into smaller pieces because of…", "water, wind, and ice", ["magnets", "sound", "shadows"], "Over time, water, wind, and ice wear rocks down."], ["What is sand made of?", "Tiny pieces of rock", ["Sugar", "Salt", "Plastic"], "Sand is rock that broke into very small pieces."], ["What do people use water for?", "Drinking, cooking, and growing food", ["Building fires", "Making magnets", "Nothing"], "Water is an important natural resource."], ["Which is a way to reuse something?", "Use an old jar to hold crayons", ["Throw the jar away", "Break the jar", "Bury the jar"], "Reusing means using something again."], ["Which is a way to recycle?", "Put cans in the recycling bin", ["Throw cans in a river", "Leave cans on the ground", "Burn the cans"], "Recycled cans can be made into new things."], ["Which change to land happens fast?", "A big flood washing away soil", ["A river slowly carving a canyon", "Wind slowly wearing down a rock", "A mountain slowly getting shorter"], "Floods can change land in just hours."], ["Which one is a rock?", "A pebble", ["A pinecone", "A leaf", "A feather"], "Pebbles are small, smooth rocks."], ["Which Earth material do people need to drink?", "Water", ["Sand", "Rocks", "Soil"], "We ne function g4Money(){const n=pick(NAMES),v=rnd(0,4);
  if(v===0){const fixed=Math.random()<.5;if(fixed)return {...strChoices(pick(FIXEDX),shuffle(VARX).slice(0,3)),q:'Which is a fixed expense?',e:'A fixed expense costs the same amount every time. A variable expense can change.'};
    return {...strChoices(pick(VARX),shuffle(FIXEDX).slice(0,3)),q:'Which is a variable expense?',e:'A variable expense can change from month to month. A fixed expense stays the same.'}}
  if(v===1){const p=pick([25,50,75,100,150,200,250]),k=rnd(10,60),rev=p*k;let cost;do{cost=rnd(2,Math.floor(rev/100)-1)*100+pick([0,25,50,75])}while(cost>=rev||cost<=0);const it=pick(['cups of lemonade','bracelets','cookies','bookmarks']);
    return {...numChoices(rev-cost,[rev,cost,rev+cost],usd),q:`${n} sells ${it} for ${usd(p)} each. ${n} sells ${k} and spends ${usd(cost)} on supplies. What is the profit?`,e:`Income: ${k} × ${usd(p)} = ${usd(rev)}. Profit = income − expenses: ${usd(rev)} − ${usd(cost)} = ${usd(rev-cost)}.`}}
  if(v===2||v===4){const [q,a,w,e]=pick(BANKQ);return {...strChoices(a,w),q,e}}
  const A=pick([10,12,15,20,25,30]);let s,sv;do{s=rnd(2,A-3);sv=rnd(1,A-s-1)}while(A-s-sv<1);const sh=A-s-sv;
  return {...numChoices(sh,[s+sv,A-s,A-sv],x=>`$${x}`),q:`${n} gets $${A} allowance each week. ${n} spends $${s} and saves $${sv} for college. ${n} shares the rest with a food bank. How much does ${n} share?`,e:`Spending + saving = $${s} + $${sv} = $${s+sv}. The rest is shared: $${A} − $${s+sv} = $${sh}.`}}

function g4Factors(){const v=rnd(0,4);
  if(v===0){const N=pick([12,16,18,20,24,28,30,32,36,40,42,45,48,54,56,60,63,64,72,80,84,90,96]),fs=[];for(let i=2;i<N;i++)if(N%i===0)fs.push(i);const f=pick(fs.filter(x=>x<=12)),nf=[];for(let i=2;i<=12;i++)if(N%i)nf.push(i);
    return {...strChoices(String(f),shuffle(nf).slice(0,3).map(String)),q:`Which number is a factor of ${N}?`,e:`${N} ÷ ${f} = ${N/f} with no remainder, so ${f} is a factor of ${N}. (${f} × ${N/f} = ${N})`}}
  if(v===1){const k=rnd(3,9),ans=k*rnd(3,12),nm=[];for(let x=ans-9;x<=ans+9;x++)if(x>1&&x%k)nm.push(x);
    return {...strChoices(String(ans),shuffle(nm).slice(0,3).map(String)),q:`Which number is a multiple of ${k}?`,e:`${ans} = ${k} × ${ans/k}, so ${ans} is a multiple of ${k}.`}}
  if(v===2){const N=rnd(2,60),fs=[];for(let i=1;i<=N;i++)if(N%i===0)fs.push(i);const prime=fs.length===2;
    return {a:prime?'Prime':'Composite',choices:['Prime','Composite'],q:`Is ${N} prime or composite?`,e:prime?`${N} has exactly two factors, 1 and ${N}, so it is prime.`:`${N} has more than two factors (${fs.join(', ')}), so it is composite.`}}
  if(v===3){const N=pick([12,16,18,20,24,28,30,32,36,40]),pr=[];for(let i=1;i*i<=N;i++)if(N%i===0)pr.push([i,N/i]);const show=p=>p.map(([a,b])=>`${a} × ${b}`).join(', ');
    const miss=pr.filter((_,i)=>i!==pr.length-1),bad=pr.map(([a,b],i)=>i===1?[a,b+1]:[a,b]),k=[2,3,4,5,6,7,8,9].find(x=>N%x),extra=pr.concat([[k,Math.round(N/k)]]);
    return {...strChoices(show(pr),[show(miss),show(bad),show(extra)]),q:`Which list shows ALL the factor pairs of ${N}?`,e:`Check each number from 1 up: ${show(pr)}. Each pair multiplies to ${N}.`}}
  const a=rnd(2,9),s=rnd(1,9),seq=[0,1,2,3].map(i=>s+a*i),alt=a%2===1,same=s%2===0?'All the numbers are even.':'All the numbers are odd.',ans=alt?'The numbers go odd, even, odd, even (or even, odd, even, odd).':same;
  return {...strChoices(ans,[alt?same:'The numbers go odd, even, odd, even (or even, odd, even, odd).',s%2===0?'All the numbers are odd.':'All the numbers are even.',`Each number is ${a+1} more than the one before.`]),q:`Rule: add ${a}. Start at ${s}. The pattern is ${seq.join(', ')}, … Which statement is true?`,
    e:alt?`Adding an odd number (${a}) changes odd to even and even to odd, so the numbers switch back and forth.`:`Adding an even number (${a}) keeps the numbers ${s%2===0?'even':'odd'}.`}}
