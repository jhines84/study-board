function confetti(from){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let cv=document.getElementById('confetti');if(!cv){cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv)}
  const d=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*d;cv.height=H*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);
  const cs=getComputedStyle(document.body),cols=['--math','--sci','--shade','--pop','--good'].map(k=>cs.getPropertyValue(k).trim());
  let ox=W/2,oy=H*0.35;if(from){const r=from.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2}
  const n=from?70:160,ps=Array.from({length:n},()=>{const a=-Math.PI/2+(Math.random()-.5)*(from?2.2:3.4),v=4+Math.random()*(from?7:10);
    return {x:from?ox:Math.random()*W,y:from?oy:-10,vx:from?Math.cos(a)*v:(Math.random()-.5)*3,vy:from?Math.sin(a)*v:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],round:Math.random()<.3}});
  const t0=performance.now(),life=from?1400:2600;
  (function f(now){const k=now-t0;x.clearRect(0,0,W,H);for(const p of ps){p.vy+=0.22;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k/life);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
    if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,6.28);x.fill()}else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    if(k<life)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})(t0);
}

const ANIMAL_KEYS=Object.keys(ANIMALS);
function avatar(k,size=64){const a=ANIMALS[k]||ANIMALS.cat;return `<svg class="ava" viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${a[0]}"><circle cx="50" cy="50" r="50" fill="${a[1]}"/>${a[2]}</svg>`}
let players=[],player=null;
try{players=JSON.parse(localStorage.getItem(PKEY)||'[]')||[]}catch(e){players=[]}
/* Players made before school books existed: 3rd graders keep the McGraw Hill chapter order they had. */
players.forEach(p=>{if(p&&!p.book)p.book={sci:p.grade===3?'mh':'',math:''}});
if(!Array.isArray(players))players=[];
function savePlayers(){try{localStorage.setItem(PKEY,JSON.stringify(players))}catch(e){}}
function savePlayer(){if(player)savePlayers()}
/* Guest uses the device's shared settings */
let guest={kid:'neutral',sound:true,pencil:false};
try{guest.sound=localStorage.getItem('studyboard-sound')!=='off';guest.pencil=localStorage.getItem('studyboard-pencil')==='1'}catch(e){}
const GUESTICON='<svg class="ava" viewBox="0 0 100 100" width="40" height="40" role="img" aria-label="Guest"><circle cx="50" cy="50" r="50" fill="#c9d2d8"/><circle cx="50" cy="40" r="16" fill="#6b7780"/><path d="M22 82c4-16 15-24 28-24s24 8 28 24" fill="#6b7780"/></svg>';
function usePlayer(p){
  player=p||null;const s=p||guest;
  document.body.dataset.kid=s.kid||'neutral';soundOn=s.sound!==false;pencilOnly=!!s.pencil;

  home();
}
function who(){
  stopSpeech();app.classList.remove('fit');document.body.dataset.kid='neutral'; /* player pages always use Everyone colors */

    <p>Tap your animal to start.</p></header>
  <div class="players">
    ${players.map(p=>`<div class="ptile"><button class="pbtn" data-id="${p.id}">${avatar(p.animal,96)}<b>${esc(p.name)}</b></button><button class="pedit" data-id="${p.id}" aria-label="Edit ${esc(p.name)}">Edit</button></div>`).join('')}

}

    </div>
    <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn primary" id="psave" style="--accent:var(--math)">${isNew?'Add player':'Save'}</button><button class="btn" id="pcancel">Cancel</button>

      <div class="row" style="justify-content:flex-start"><button class="btn danger" id="pyes">Yes, delete</button><button class="btn" id="pno">Keep</button></div></div>
  </div>`;

  const prev=document.getElementById('pprev'),nm=document.getElementById('pname');

  nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nm.blur()}});
  app.querySelectorAll('.abtn').forEach(b=>b.onclick=()=>{d.animal=b.dataset.a;app.querySelectorAll('.abtn').forEach(x=>x.setAttribute('aria-pressed',x===b));prev.innerHTML=avatar(d.animal,110)});
  app.querySelectorAll('.kp').forEach(b=>b.onclick=()=>{d.kid=b.dataset.k;app.querySelectorAll('.kp').forEach(x=>x.setAttribute('aria-pressed',x===b));document.body.dataset.kid=d.kid});
  document.getElementById('psave').onclick=()=>{const name=document.getElementById('pname').value.trim().slice(0,20);
    if(!name){document.getElementById('perr').hidden=false;document.getElementById('pname').focus();return}
    if(isNew){players.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,animal:d.animal,kid:d.kid,sound:true,pencil:false,grade:1,std:'tx',book:{sci:'',math:''}})}

    savePlayers();if(soundOn)sfxRight(true);who()};
  const del=document.getElementById('pdel');
  if(del){const conf=document.getElementById('pconf');del.onclick=()=>{conf.hidden=false};document.getElementById('pno').onclick=()=>{conf.hidden=true};
    document.getElementById('pyes').onclick=()=>{players=players.filter(x=>x.id!==p.id);savePlayers();if(player&&player.id===p.id)player=null;who()}}
  if(isNew)setTimeout(()=>{try{document.getElementById('pname').focus({preventScroll:true})}catch(e){}},50);
  window.scrollTo(0,0);
}

  app.innerHTML=`<div class="bar"><button class="back" id="bk">← Back</button></div>

    <section id="lg-about"><h3>About Study Board</h3>
    <p>Study Board is a free practice tool for families with children in 1st through 5th grade. It offers multiple-choice math and science questions, a whiteboard for working out problems, and short review lessons. It is meant to be used with a parent or guardian’s permission.</p>
    <p>The questions and lessons were written for this app. They are not copied from any textbook, test, or other published material.</p></section>

    <section id="lg-privacy"><h3>Privacy Notice</h3>
    <p><b>We do not collect personal information.</b> Study Board has no accounts, no sign-ups, no ads, no analytics, and no tracking. It does not use cookies, and it does not send anything you or your child types or taps to us or to anyone else.</p>
    <p><b>What is saved on your device.</b> If you add players, their names, chosen animals, color themes, grade, standards, and sound and Pencil only settings are saved in this browser’s storage on this device only. Guest sound and Pencil only settings are saved the same way. This information never leaves the device. We cannot see it, and it does not sync between devices. Scores and answers are never saved.</p>
    <p><b>Children’s privacy.</b> Study Board is designed for children and does not knowingly collect any personal information from children, as described in the U.S. Children’s Online Privacy Protection Act (COPPA). Because nothing is collected, there is nothing for us to review, share, sell, or delete on our side.</p>
    <p><b>Services your device or browser provides.</b> “Read to me” uses your device’s own text-to-speech voice. Some browsers and devices use an online voice service from their maker, which receives only the question text being read. Fonts are stored with the app, so no font service is contacted. To work offline, your browser keeps a copy of the app’s own files on this device; that copy contains no personal information. The website host (GitHub Pages) keeps standard server logs, which include IP addresses, to run its service. We do not use any of this to identify or track anyone.</p>
    <p><b>Feedback.</b> Sending feedback is optional and happens on a separate form outside the app. That form does not ask for names or email addresses. Please do not include personal information about yourself or your child.</p>
    <p><b>Changes.</b> If this notice changes, the date at the top will change too.</p>${contact}</section>

    <section id="lg-terms"><h3>Terms of Use</h3>
    <p><b>Practice only.</b> Study Board is an educational practice tool. It is not an official test, does not predict test scores, and is not a replacement for a teacher, school, or tutor.</p>
    <p><b>Accuracy.</b> We work to keep questions and lessons correct and age-appropriate, but mistakes can happen and standards change over time. If something looks wrong, please tell us through the feedback form.</p>
    <p><b>Supervision.</b> Parents and guardians decide whether and how their children use Study Board and should supervise use as they see fit.</p>
    <p><b>No warranty.</b> Study Board is provided free of charge, “as is” and “as available,” without warranties of any kind, express or implied, including warranties of accuracy, fitness for a particular purpose, or uninterrupted availability.</p>

    <p><b>Changes.</b> Study Board may be changed, paused, or discontinued at any time without notice. These terms are governed by the laws of the State of Texas, United States.</p></section>

    <section id="lg-credits"><h3>Not Affiliated &amp; Credits</h3>
    <p>Study Board is an independent project. It is not affiliated with, sponsored by, or endorsed by any publisher, school district, state education agency, or standards organization.</p>

    </ul></section>

    <section id="lg-feedback"><h3>Send Feedback</h3>
    ${CONFIG.feedbackUrl?`<p>Found a mistake or have an idea? The feedback form is anonymous. It does not ask for names or emails.</p>

      <a class="btn primary" id="fblink" href="${esc(CONFIG.feedbackUrl)}" target="_blank" rel="noopener noreferrer" hidden>Open the feedback form</a></div>`

    <section id="lg-delete"><h3>Delete Data on This Device</h3>

    <p id="wiped" class="wiped" hidden>Done. All Study Board data on this device was deleted.</p></section>
  </article>`;
  document.getElementById('bk').onclick=()=>home();
  app.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.querySelector(a.getAttribute('href'));if(t)t.scrollIntoView({behavior:'smooth',block:'start'})});

/* Press feedback only on a real tap, not while scrolling */
(function(){
  const SEL='.choice,.topic,.subject,.kp,.gp,.sp,.pbtn,.abtn,.pedit,.btn,.next,.review,.back,.tool,.speak,.sound,.marker';
  let el=null,timer=0,sx=0,sy=0;
  const clear=()=>{clearTimeout(timer);timer=0;if(el)el.classList.remove('pressed');el=null};
  document.addEventListener('pointerdown',e=>{clear();const t=e.target.closest&&e.target.closest(SEL);if(!t||t.disabled)return;el=t;sx=e.clientX;sy=e.clientY;
    if(e.pointerType==='mouse'){t.classList.add('pressed');return}
    timer=setTimeout(()=>{timer=0;el&&el.classList.add('pressed')},110)},true);
  document.addEventListener('pointermove',e=>{if(el&&Math.hypot(e.clientX-sx,e.clientY-sy)>8)clear()},true);
  document.addEventListener('pointerup',()=>{if(!el)return;const t=el;clearTimeout(timer);timer=0;el=null;t.classList.add('pressed');setTimeout(()=>t.classList.remove('pressed'),120)},true);
  document.addEventListener('pointercancel',clear,true);
  document.addEventListener('scroll',clear,true);
})();
home();
})();
