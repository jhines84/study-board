const N5=[{"id":"n5matter","ch":"NGSS 5-PS1","nm":"Matter and Its Interactions","qs":[["What is all matter made of?","Tiny particles too small to see",["Water","Air only","Nothing at all"],"All matter is made of particles far too small to see."],["When you blow up a balloon, what fills it?","Particles of air",["Nothing","Water","Light"],"Air is matter made of particles. They fill the balloon."],["Why does a balloon get bigger when you blow more air into it?","More air particles take up more space inside it",["The balloon makes new air","Air has no mass","The rubber turns into air"],"Adding particles of air takes up more space."],["You can smell cookies baking from another room. What does this show?","Tiny particles from the cookies move through the air",["Smells travel through walls as light","Cookies make sound","Air has no particles"],"Particles spread out through the air and reach your nose."],["A sealed plastic bag of air is squeezed. What happens to the air particles?","They are pushed closer together",["They disappear","They turn into water","They get larger"],"Gas particles have space between them, so they can be squeezed closer."],["Which shows that air is matter?","A ball pumped full of air has more mass than the same ball when it is flat",["Air is invisible","Air feels cold","Wind can blow"],"Air has mass and takes up space, so it is matter."],["A student dissolves 20 g of sugar in 200 g of water. What is the mass of the solution?","220 g",["200 g","180 g","20 g"],"Matter is conserved: 200 g + 20 g = 220 g."],["How can you show that salt is still in the water after it dissolves?","Let the water evaporate and look for salt left behind",["Pour it through a filter","Use a magnet","Shake it"],"When the water evaporates, the salt crystals are left."],["Which substance is soluble in water?","Salt",["Sand","Pebbles","Iron filings"],"Salt dissolves in water. Sand, pebbles, and iron filings do not."],["Which material is a good conductor of electricity?","Copper",["Rubber","Plastic","Wood"],"Metals like copper let electricity flow easily."],["Which object would a magnet attract?","A steel paper clip",["An aluminum can","A copper penny","A glass marble"],"Magnets attract iron and steel. Aluminum, copper, and glass are not magnetic."],["A student wants to sort objects into conductors and insulators of electricity. Which tool is most useful?","A simple circuit with a battery and a bulb",["A balance","A magnet","A thermometer"],"If the bulb lights when an object closes the circuit, the object is a conductor."],["Baking soda and vinegar are mixed, and bubbles form. What does this show?","A new substance (a gas) formed",["Nothing changed","The baking soda melted","The vinegar froze"],"Bubbles of a new gas are a sign of a chemical change."],["Which is evidence that a new substance has formed?","A color change, gas bubbles, or a change in temperature",["A change in shape","Cutting something in half","Melting ice"],"These signs show that substances reacted to make something new."],["Over time, an iron nail left outside turns reddish-brown and flaky. What happened?","A new substance, rust, formed",["The nail melted","The nail turned into a magnet","Nothing happened"],"Iron reacts with water and air to make rust."],["Baking soda and vinegar are sealed in a bag and react. How does the bag’s mass after the reaction compare to before?","It is the same",["It is greater","It is less","It becomes zero"],"In a closed bag, no matter can escape, so the total mass stays the same."],["Water freezes into ice. Is ice a new substance?","No, it is still water in a different state",["Yes, ice is a new substance","Yes, ice is made of salt","No, ice is a gas"],"Freezing is a physical change."],["Which is a physical change?","Cutting paper into pieces",["Burning wood","Rusting iron","Baking a cake"],"Cutting changes the size and shape, but the paper is still paper."],["Which is a chemical change?","Burning wood",["Melting butter","Breaking a glass","Folding paper"],"Burning makes new substances, like ash and smoke."],["Sand and salt are mixed together. Does a new substance form?","No, it is a mixture of sand and salt",["Yes, they become one new substance","Yes, they turn into glass","No, the salt disappears forever"],"Each substance keeps its own properties."],["A balloon is placed in a hot car and gets bigger. Why?","The air particles inside move faster and spread out",["New air is made inside","The rubber turns into air","The air particles disappear"],"Heating makes gas particles move faster and take up more space."],["Which property could help you tell salt from sugar without tasting them?","How the crystals look under a hand lens",["Their color only","Whether they are solids","Whether they are matter"],"Salt crystals are cube-shaped and look different from sugar crystals."]]},{"id":"n5ecosystems","ch":"NGSS 5-PS3 · 5-LS1 · 5-LS2","nm":"Energy and Matter in Ecosystems","qs":[["Decomposers break down a dead deer. What happens to the matter in the deer?","Nutrients return to the soil for plants to use",["The matter disappears","It turns into sunlight","It becomes a new deer"],"Matter cycles back into the ecosystem."],["What would happen if all the decomposers in an ecosystem disappeared?","Dead matter would pile up, and nutrients would not return to the soil",["Plants would grow faster","Animals would never die","Nothing would change"],"Decomposers recycle nutrients."],["Which organism is at the start of almost every food web?","A producer, like a plant",["A hawk","A mushroom","A wolf"],"Producers capture energy from the Sun."],["Where does the energy in a food web come from, and where does it go?","It comes from the Sun and moves from producers to consumers",["It comes from consumers and goes to the Sun","It comes from rocks and goes to plants","It comes from decomposers and goes to the Moon"],"Energy flows from the Sun through producers to consumers."],["How does matter cycle in an ecosystem?","Plants use nutrients, animals eat plants, and decomposers return nutrients to the soil",["Matter is used once and then disappears","Matter comes only from the Sun","Only animals use matter"],"The same matter is used again and again."],["In a food chain, grass → rabbit → hawk. A disease kills most of the rabbits. What will most likely happen to the hawks?","Their numbers may drop because they have less food",["Their numbers will grow","Nothing will change","They will start eating grass"],"Fewer rabbits means less food for hawks."],["A drought kills many plants in an ecosystem. How does this affect the food web?","Less energy is available for all the consumers",["Consumers get more food","Nothing changes","Only plants are affected"],"Every food web depends on producers."],["Snakes eat mice, and hawks eat snakes. What could happen if all the hawks were removed?","The number of snakes may increase, and the number of mice may decrease",["The number of snakes will drop","Mice will disappear right away","Nothing will change"],"Without hawks, more snakes survive and eat more mice."],["Plants use sunlight to make food. Which energy change happens?","Light energy → chemical energy",["Chemical energy → light energy","Sound energy → light energy","Thermal energy → sound energy"],"Plants store the Sun’s energy as chemical energy in food."],["Food on your plate has stored chemical energy. Where did that energy first come from?","The Sun",["The refrigerator","The plate","The stove"],"Plants captured the Sun’s energy, and it passed through the food chain."],["Where does the energy in an animal’s food first come from?","The Sun",["The soil","The water","The animal itself"],"Plants capture sunlight, and the energy moves to animals that eat them."],["Plants get most of the materials they need to grow from…","Air and water",["Soil only","Rocks","Other animals"],"Plants build their bodies mostly from carbon dioxide in the air and from water."],["A tiny seed grows into a huge oak tree. Where did most of the tree’s mass come from?","Carbon dioxide from the air and water",["The soil in the pot","Sunlight turning into wood","Rain only"],"Plants use carbon dioxide and water to make sugars that build their bodies."],["How do animals use the energy in their food?","To grow, repair their bodies, move, and stay warm",["To make sunlight","To grow roots","Animals do not use energy"],"Food gives animals energy for everything they do."],["A plant grows in a pot for a year. The plant gains 2 kilograms, but the soil loses only a few grams. What does this show?","Plants get most of their mass from air and water, not from soil",["Soil turns into plants","The plant ate the pot","Plants have no mass"],"The soil barely changed, so the plant’s mass came from somewhere else."],["Which gas do plants take in from the air to make food?","Carbon dioxide",["Oxygen","Helium","Smoke"],"Plants use carbon dioxide, water, and sunlight to make food."],["What do decomposers, like fungi and bacteria, use for food?","Dead plants and animals",["Sunlight","Rocks","Air only"],"Decomposers break down dead matter."],["How does a rabbit get energy?","By eating plants that stored energy from the Sun",["By making food from sunlight","By eating rocks","By breathing only"],"Rabbits are consumers."],["Why are plants called producers?","They make their own food using sunlight",["They eat other animals","They break down dead things","They produce rocks"],"Producers make food from sunlight, water, and air."],["A fox eats a rabbit that ate grass. Where did the fox’s energy start?","The Sun",["The fox’s den","The rabbit’s burrow","The soil"],"Energy flows Sun → grass → rabbit → fox."],["A terrarium is sealed with plants, soil, and insects. How can the plants keep growing?","Matter cycles among the plants, insects, decomposers, soil, and air",["New soil appears every day","The plants eat the glass","The insects make sunlight"],"In a closed system, the same matter is used again and again."]]},{"id":"n5space","ch":"NGSS 5-PS2 · 5-ESS1","nm":"Gravity, Stars, and Shadows","qs":[["What causes day and night?","Earth rotating on its axis",["Earth orbiting the Sun","The Moon blocking the Sun","The Sun moving around Earth"],"As Earth spins, each place turns toward and then away from the Sun."],["Why does the Sun seem to move across the sky during the day?","Earth rotates",["The Sun orbits Earth each day","Clouds push the Sun","The Moon pulls the Sun"],"The Sun only looks like it moves because Earth is turning."],["When are shadows the shortest?","Around noon, when the Sun is highest in the sky",["Early in the morning","Late in the afternoon","At sunset"],"A high Sun makes short shadows."],["When are shadows the longest?","Early in the morning and late in the afternoon",["At noon","At midnight","Shadows never change"],"When the Sun is low in the sky, shadows stretch out."],["In the morning, the Sun is in the east. Which way does a flagpole’s shadow point?","West",["East","Up","It has no shadow"],"Shadows point away from the Sun."],["A student measures a tree’s shadow at 9 a.m., noon, and 3 p.m. What pattern will she see?","The shadow gets shorter until about noon, then longer, and it changes direction",["The shadow stays exactly the same","The shadow only gets longer","The shadow disappears at 3 p.m."],"As Earth rotates, the Sun’s position changes, so the shadow changes."],["Which model best shows how day and night happen?","Spinning a globe in front of a lamp",["Holding a globe still in a dark room","Moving a lamp around a table","Shaking a globe up and down"],"The lamp lights one side of the spinning globe at a time."],["In which direction does Earth’s gravity pull objects?","Down, toward the center of Earth",["Up, toward space","Sideways, toward the ocean","Toward the Sun only"],"Gravity pulls everything toward Earth’s center."],["People in Australia don’t fall off Earth. Why?","Gravity pulls everyone toward the center of Earth",["Australia is on top of Earth","People in Australia wear heavy shoes","There is no gravity in Australia"],"“Down” means toward Earth’s center everywhere on the planet."],["A student drops a ball and a book at the same time. Why do both fall?","Earth’s gravity pulls them down",["Air pushes them down","Magnets pull them","They want to stop moving"],"Gravity pulls all objects toward Earth."],["Why does the Sun look so much brighter than other stars?","It is much closer to Earth",["It is the biggest star in the universe","It is the only star that makes light","Other stars are turned off during the day"],"The Sun is the closest star to Earth."],["Some stars are bigger and brighter than the Sun. Why do they look like tiny points of light?","They are much farther away",["They are smaller than the Sun","They do not make light","They are behind clouds"],"Distance makes stars look dim and small."],["Why can’t we see other stars during the day?","The Sun’s bright light makes them hard to see",["Stars move away during the day","Stars only exist at night","Clouds always cover them"],"The stars are still there, but sunlight outshines them."],["Orion is easy to see on winter evenings but not on summer evenings. Why?","As Earth orbits the Sun, the night side faces different parts of space",["Orion moves away in summer","Orion turns off in summer","Clouds always block Orion in summer"],"Different stars are visible in different seasons."],["Which object in the sky is the closest star to Earth?","The Sun",["The North Star","The Moon","Mars"],"The Sun is a star, and it is the closest one."],["Two flashlights are the same brightness. One is near and one is far away. Which looks brighter?","The near flashlight",["The far flashlight","They look the same","Neither gives light"],"This models why nearby stars look brighter."],["A pattern of stars that forms a picture in the sky is called…","A constellation",["A planet","A comet","A moon"],"Constellations are star patterns, like the Big Dipper."],["What would happen to a ball thrown up into the ai nd bells send messages."], ["You put rice on a drum and tap it. Why does the rice jump?", "The drum vibrates", ["The rice is alive", "Light pushes it", "The drum is a magnet"], "Vibrations make sound and can make things move."], ["You hum with your fingers on your throat. What do you feel?", "Vibrations", ["Cold air", "A magnet", "Nothing"], "Sound is made by vibrations."], ["Can you see anything in a room that is completely dark?", "No, we need light to see", ["Yes, everything looks the same", "Only red things", "Only shiny things"], "Our eyes need light to see objects."]]},{id:"n1parts",ch:"NGSS 1-LS1",nm:"Plant and Animal Parts",qs:[["Which part of a plant takes in water from the soil?", "Roots", ["Flower", "Leaf", "Fruit"], "Roots grow under the ground and drink up water."], ["Which part of a plant holds it up?", "Stem", ["Root", "Seed", "Flower"], "The stem holds the plant up and carries water to the leaves."], ["Which part of a plant uses sunlight to make food?", "Leaves", ["Roots", "Seeds", "Soil"], "Leaves catch sunlight and make food for the plant."], ["Which part of a plant makes seeds?", "Flower", ["Root", "Stem", "Soil"], "Flowers make seeds. Seeds grow into new plants."], ["Where do roots grow?", "Under the ground", ["In the sky", "On the leaves", "Inside the flowers"], "Roots grow down into the soil."], ["Which plant part is often colorful and smells sweet?", "The flower", ["The root", "The stem", "The soil"], "Bright flowers help bring bees and butterflies."], ["A tree trunk is a kind of…", "stem", ["root", "leaf", "flower"], "A trunk is a big, strong stem that holds the tree up."], ["What helps a plant stay in the ground on a windy day?", "Its roots", ["Its flowers", "Its fruit", "Its leaves"], "Roots hold the plant in place."], ["Which animal has feathers?", "A bird", ["A dog", "A fish", "A frog"], "Birds are the only animals with feathers."], ["Which animal has fur?", "A rabbit", ["A snake", "A fish", "A turtle"], "Fur keeps rabbits warm."], ["What do fish use to breathe underwater?", "Gills", ["Feathers", "Wings", "Fur"], "Gills take in air from the water."], ["What does a duck use its webbed feet for?", "Swimming", ["Climbing trees", "Digging holes", "Catching bugs in the air"], "Webbed feet work like paddles in the water."], ["Which animal has wings to fly?", "A butterfly", ["A dog", "A fish", "A snail"], "Butterflies, birds, and bats use wings to fly."], ["Which animal has a shell to protect it?", "A turtle", ["A cat", "A horse", "A bird"], "A turtle can pull into its hard shell."], ["Which animal hops?", "A kangaroo", ["A snake", "A fish", "A worm"], "Kangaroos and rabbits hop on strong back legs."], ["Which body part helps a fish swim?", "Fins", ["Feathers", "Wings", "Fur"], "Fish move their fins and tails to swim."], ["How do many birds find food?", "They use their beaks", ["They use fins", "They use roots", "They use shells"], "Beaks help birds pick up seeds and catch bugs."], ["Why does a duck have webbed feet?", "To help it swim", ["To help it climb trees", "To help it dig", "To help it see"], "Webbed feet push water like paddles."], ["How does thick fur help some animals?", "It keeps them warm in cold places", ["It helps them breathe underwater", "It helps them see at night", "It makes them faster swimmers"], "Fur traps body heat."], ["Where does a cactus store water?", "In its thick stem", ["In its spines", "In the sand", "In its flowers only"], "A cactus stem holds water so it can live in the dry desert."], ["Which animal has a long neck to reach leaves high in trees?", "A giraffe", ["A pig", "A frog", "A snake"], "A long neck helps giraffes eat."], ["Why do some animals have colors that match where they live?", "To hide from other animals", ["To look fancy", "To stay wet", "To make noise"], "Blending in is called camouflage."], ["A cactus has sharp spines. How do they help it?", "They keep animals from eating it", ["They help it swim", "They make it taller", "They help it sing"], "Spines protect the cactus."], ["Why do rabbits have big ears?", "To hear danger coming", ["To swim", "To dig holes", "To carry food"], "Good hearing helps rabbits stay safe."], ["A bike helmet protects your head the way a turtle’s ___ protects the turtle.", "shell", ["tail", "feet", "eyes"], "People copy ideas from animals to solve problems."], ["Why do eagles have sharp eyes?", "To spot food from high in the sky", ["To see in the ocean", "To smell flowers", "To hear better"], "Sharp eyes help eagles find food."]]},{id:"n1parents",ch:"NGSS 1-LS1 \u00b7 1-LS3",nm:"Parents and Babies",qs:[["What is a baby frog called?", "A tadpole", ["A puppy", "A chick", "A calf"], "Frogs hatch from eggs as tadpoles that live in water."], ["Baby animals grow up to look like their…", "parents", ["houses", "food", "toys"], "Young animals look like their parents when they grow up."], ["What is a baby cow called?", "A calf", ["A puppy", "A kitten", "A chick"], "Baby cows are calves."], ["What is a baby dog called?", "A puppy", ["A calf", "A cub", "A chick"], "Baby dogs are puppies."], ["What do baby birds hatch from?", "Eggs", ["Seeds", "Flowers", "Rocks"], "Birds lay eggs. Chicks hatch out."], ["Which one can have babies?", "A dog", ["A ball", "A book", "A bike"], "Living things make more living things. Dogs have puppies."], ["Which one grows from a baby into an adult?", "A duck", ["A ball", "A rock", "A cloud"], "Ducklings grow up into ducks."], ["How do bird parents help their babies?", "They bring them food", ["They teach them to read", "They give them toys", "They leave them alone"], "Many animal parents feed and protect their young."], ["Where does a baby kangaroo stay safe?", "In its mother’s pouch", ["In a nest of rocks", "Under the water", "In a cave alone"], "The pouch keeps the baby, called a joey, warm and safe."], ["Why does a baby bird chirp loudly?", "To tell its parents it is hungry", ["To scare the Sun", "To make it rain", "To call a fish"], "Baby animals use sounds to get help from t ung survive."], ["A young sunflower grows from a sunflower seed. What will its flowers look like?", "Like sunflowers", ["Like roses", "Like tulips", "It will have no flowers"], "Plants look like the plants they came from."]]},{id:"n1sky",ch:"NGSS 1-ESS1",nm:"Patterns in the Sky",qs:[["When can we see the Sun?", "During the day", ["Only at night", "Never", "Only when it rains"], "The Sun lights up the sky in the daytime."], ["What can we often see in the night sky?", "The Moon and stars", ["The Sun", "Rainbows only", "Butterflies"], "At night we often see the Moon and stars."], ["Why do we have day and night?", "Earth spins around", ["The Sun turns off", "The Moon blocks the Sun", "Clouds cover the Sun"], "As Earth spins, our side faces the Sun (day) and then turns away (night)."], ["What shapes can the Moon look like?", "A circle or a thin curve", ["A square", "A triangle", "A star shape"], "The Moon looks different on different nights."], ["What gives us light during the day?", "The Sun", ["The Moon", "The stars", "A rainbow"], "The Sun lights up the day."], ["What is the Sun?", "A star", ["A planet", "The Moon", "A cloud"], "The Sun is the star closest to Earth."], ["A full moon looks like…", "a whole circle", ["a thin line", "nothing at all", "a square"], "During a full moon, we see the whole lit-up side."], ["Where are the stars during the day?", "Still in the sky, but the Sun is too bright to see them", ["They fall to Earth", "They turn off", "They hide behind the Moon"], "Stars are always there. Daylight hides them."], ["Where does the Sun seem to rise in the morning?", "In the east", ["In the west", "In the north", "In the south"], "The Sun rises in the east and sets in the west."], ["Where does the Sun seem to set in the evening?", "In the west", ["In the east", "In the north", "In the south"], "The Sun sets in the west."], ["Why does the Sun seem to move across the sky?", "Earth is spinning", ["The Sun walks", "Clouds push it", "The Moon pulls it"], "Earth const N2=[{id:"n2matter",ch:"NGSS 2-PS1",nm:"Matter and Its Properties",qs:[["Which object is flexible (it bends)?", "A rubber band", ["A rock", "A brick", "A glass marble"], "Flexible things can bend without breaking."], ["Which object is absorbent (it soaks up water)?", "A paper towel", ["A plastic cup", "A metal spoon", "A glass plate"], "Absorbent things soak up liquids."], ["Which object is hard?", "A rock", ["A pillow", "A sponge", "A cotton ball"], "Hard things do not squish when you press them."], ["Which material would make the best raincoat?", "Plastic", ["Paper", "Cotton", "Tissue"], "Plastic does not let water through. We pick materials by their properties."], ["Which one is a solid?", "A wooden block", ["Apple juice", "Air", "Steam"], "A solid keeps its own shape."], ["What happens when you heat ice?", "It melts", ["It freezes", "It gets bigger", "It turns into rock"], "Heating changes solid ice into liquid water."], ["You put a cup of water in the freezer. What happens?", "It freezes into ice", ["It melts", "It boils", "It turns into air"], "Cooling changes liquid water into solid ice."], ["Butter is put in a hot pan. What happens?", "It melts", ["It freezes", "It gets harder", "Nothing"], "Heat melts butter."], ["You cut a sheet of paper into pieces. What changed?", "Its size and shape", ["It is not paper anymore", "It turned into wood", "It turned into water"], "Cutting changes size and shape, but it is still paper."], ["You fold paper into an airplane. What is the airplane made of?", "Still paper", ["Wood", "Metal", "Water"], "Folding changes the shape, not what it is made of."], ["Why are windows made of glass?", "You can see through glass", ["Glass is soft", "Glass soaks up water", "Glass bends easily"], "Glass is clear, so light comes in and we can see out."], ["You mix sand and water. How can you get the sand back?", "Let the water dry up", ["You can never get it back", "Freeze it", "Use a magnet"], "When water evaporates, the sand is left behind."], ["Which object is stiff (it does not bend)?", "A brick", ["A rubber band", "A pipe cleaner", "A ribbon"], "Stiff objects keep their shape when you push on them."], ["Which object is NOT absorbent?", "A plastic plate", ["A sponge", "A paper towel", "A cotton towel"], "Plastic does not soak up water."], ["Which is best for soaking up a spill?", "A sponge", ["Plastic wrap", "Foil", "A glass plate"], "A sponge is very absorbent."], ["Which material would make the strongest wall?", "Bricks", ["Paper", "Cotton", "Jelly"], "Bricks are hard and strong."], ["Which object is the heaviest?", "A bowling ball", ["A balloon", "A feather", "A leaf"], "Weight is a property we can measure."], ["Which change can be undone?", "Freezing water, then melting the ice", ["Baking a cake", "Burning paper", "Cooking an egg"], "Ice can melt back into water, so freezing can be undone."], ["Which change CANNOT be undone?", "Cooking an egg", ["Freezing water", "Melting ice", "Folding paper"], "A cooked egg can never become raw again."], ["Chocolate melted in a warm car. How can it get hard again?", "Put it somewhere cold", ["Heat it more", "Add sand", "Shake it"], "Cooling turns melted chocolate back into a solid."], ["Which one is a liquid?", "Water", ["Ice", "A rock", "Wood"], "Liquids flow and take the shape of their container."], ["Which one is a gas?", "The air in a balloon", ["Milk", "A rock", "Juice"], "Gases spread out to fill their container."], ["Why is a mirror useful?", "It is shiny and reflects light", ["It soaks up water", "It is soft", "It bends easily"], "A mirror reflects, so you can see yourself."], ["Why are cooking pots made of metal?", "Metal heats up well to cook food", ["Metal is soft", "Metal soaks up water", "Metal is clear"], "We pick materials by their properties."], ["Which object is soft?", "A pillow", ["A rock", "A brick", "A metal spoon"], "Soft things squish when you press them."], ["Many small blocks can build a big castle. What does this show?", "Big things can be made from small pieces", ["Blocks are alive", "Castles are made of water", "Small pieces cannot be used"], "Many objects are built from smaller parts."], ["You take apart a block tower and build a boat with the same blocks. What changed?", "The shape", ["What the blocks are made of", "How many blocks there are", "Nothing"], "The pieces stayed the same; only the shape changed."]]},{id:"n2plants",ch:"NGSS 2-LS2 \u00b7 2-LS4",nm:"Plants, Animals, and Habitats",qs:[["How do roots help a plant?", "They take in water and hold the plant in the ground", ["They make flowers", "They catch sunlight", "They make the plant fly"], "Roots grow down into the soil."], ["What do leaves do?", "Use sunlight to make food", ["Hold the plant in the ground", "Make seeds", "Drink from the soil"], "Leaves are the plant’s food makers."], ["How do bees help plants?", "They carry pollen from flower to flower", ["They eat the roots", "They water the plants", "They make the leaves green"], "Moving pollen helps flowers make seeds."], ["How can seeds move to new places?", "Wind, water, and animals carry them", ["They walk", "They fly like birds on purpose", "They never move"], "Seeds spread so new plants can grow in new places."], ["A sticky seed gets stuck in a dog’s fur. How does this help the plant?", "The seed travels to a new place", ["The dog eats the plant", "The seed turns into a dog", "It does not help"], "When the seed falls off, it may grow in a new spot."], ["Where does a cactus store water?", "In its thick stem", ["In its spines", "In the sand", "In its flowers only"], "A cactus stem holds water so it can live in the dry desert."], ["What is a habitat?", "The place where an animal lives and gets what it needs", ["A kind of food", "A type of weather", "A tool for measuring"], "Ponds, forests, deserts, and oceans are habitats."], ["Which animal lives in a pond habitat?", "A frog", ["A camel", "A polar bear", "A mountain goat"], "Frogs live in and near ponds."], ["Plants make their own food. Which one is a plant?", "A tree", ["A rabbit", "A hawk", "A worm"], "Trees use sunlight to make food."], ["What does a seed need to sprout?", "Water, warmth, and air", ["Darkness and ice", "Only sand", "Only candy"], "Seeds sprout when they are warm and wet."], ["Which animal has a long neck to reach leaves high in trees?", "A giraffe", ["A pig", "A frog", "A snake"], "A long neck helps giraffes eat."], ["Which part of a plant turns into a fruit?", "The flower", ["The root", "The stem", "The leaf"], "After a flower is pollinated, it grows into a fruit with seeds."], ["Why do birds build nests?", "To lay eggs and keep babies safe", ["To store toys", "To catch fish", "To make rain"], "A nest is a bird’s shelter."], ["A plant is kept in a dark closet. What will happen?", "It will not grow well", ["It will grow faster", "It will turn into a tree", "Nothing will change"], "Plants need light to make food and grow."], ["A plant’s leaves are droopy and dry. What does it most likely need?", "Water", ["Candy", "A blanket", "A song"], "Plants droop when they do not get enough water."], ["Which habitat has lots of trees?", "A forest", ["A desert", "An ocean", "An icy tundra"], "Forests are full of trees."], ["Which habitat is hot and dry with very little rain?", "A desert", ["A rain forest", "A pond", "An ocean"], "Deserts get very little rain."], ["Which habitat is very cold and icy?", "The Arctic", ["A desert", "A rain forest", "A grassland in summer"], "Polar bears live in the icy Arctic."], ["Which animal lives in an ocean habitat?", "An octopus", ["A camel", "A squirrel", "A cow"], "Octopuses live in salt water."], ["Which animal lives in a rain forest?", "A monkey", ["A polar bear", "A penguin", "A camel"], "Rain forests are warm and wet with lots of trees."], ["Why do different habitats have different plants and animals?", "Each habitat has what those living things need", ["Animals pick habitats by color", "All habitats are exactly the same", "Plants can walk to new habitats"], "Living things live where they can meet their needs."], ["Which habitat has the most kinds of plants and animals?", "A rain forest", ["A parking lot", "A sandy road", "A frozen ice sheet"], "Rain forests are full of life."], ["How can a squirrel help an oak tree?", "It buries acorns that grow into new trees", ["It eats all the leaves", "It waters the tree", "It paints the bark"], "Animals help spread seeds."], ["A bird eats berries and drops the seeds far away. How does this help the plant?", "New plants can grow in new places", ["The plant gets taller", "The berries turn into rocks", "It does not help"], "Animals help plants spread."], ["You give one seed water and one seed none. Which will most likely grow?", "The seed with water", ["The seed with no water", "Both the same", "Neither"], "Plants need water to grow."]]},{id:"n2earth",ch:"NGSS 2-ESS1 \u00b7 2-ESS2",nm:"Changes to Earth\u2019s Land",qs:[["Wind and water move soil from one place to another. This is called…", "erosion", ["melting", "freezing", "growing"], "Erosion moves soil and rock to new places."], ["Rain keeps washing soil down a hill. How can people help?", "Plant grass and trees", ["Pull out all the plants", "Pour more water", "Dig more holes"], "Plant roots hold soil in place."], ["Rocks can break into smaller pieces because of…", "water, wind, and ice", ["magnets", "sound", "shadows"], "Over time, water, wind, and ice wear rocks down."], ["Which change to land happens fast?", "A big flood washing away soil", ["A river slowly carving a canyon", "Wind slowly wearing down a rock", "A mountain slowly getting shorter"], "Floods can change land in just hours."], ["How does a river change land over a long time?", "It wears away rock and carries soil", ["It builds mountains overnight", "It turns rocks into trees", "It does nothing"], "Moving water slowly changes land."], ["What can strong wind carry?", "Sand and dust", ["Whole mountains", "Rivers", "Houses full of rocks"], "Wind can aint them", "Nothing at all"], "Fast-moving soil and rock can destroy roads and houses."], ["A huge flood rushes through a valley. How can it change the land?", "It can wash away soil quickly", ["It builds a mountain", "It plants trees", "It makes rocks grow"], "Floods are rapid changes to Earth’s surface."], ["Which happens very quickly?", "An earthquake", ["A canyon forming", "A mountain wearing down", "A river slowly getting wider"], "Earthquakes happen in seconds."], ["Which takes a very long time?", "A river carving a canyon", ["A volcano erupting", "A landslide", "An earthquake"], "Rivers carve canyons over thousands of years."], ["How can people stop wind from blowing soil away?", "Plant rows of trees or grass", ["Pour sand on it", "Remove all the plants", "Put up a flag"], "Plants block wind and hold soil."], ["Why might people build a wall along a beach?", "To keep waves from washing the land away", ["To make more waves", "To keep the Sun away", "To catch fish"], "Walls can slow erosion by water."]]},{id:"n2water",ch:"NGSS 2-ESS2",nm:"Land and Water on Earth",qs:[["What do people use water for?", "Drinking, cooking, and growing food", ["Building fires", "Making magnets", "Nothing"], "Water is an important natural resource."], ["Which Earth material do people need to drink?", "Water", ["Sand", "Rocks", "Soil"], "We need clean water to live."], ["Rivers, lakes, and oceans hold…", "water", ["candy", "toys", "sand only"], "Water is a natural resource."], ["What does a map show?", "Where places and things are", ["Tomorrow’s weather", "How much a rock weighs", "What time it is"], "Maps show the shape and location of land and water."], ["On most maps, what does blue show?", "Water", ["Mountains", "Roads", "Cities"], "Blue usually means oceans, lakes, and rivers."], ["On most maps, what do green and brown show?", "Land", ["Water", "Sky", "Clouds"], "Green and brown usually mean land."], ["Where is most of Earth’s water?", "In the oceans", ["In lakes", "In rivers", ing goes lower", "Nothing changes"], "A bigger push gives a bigger change in motion."], ["What can change when a force acts on an object?", "Its speed, direction, or position", ["Its color", "Its name", "Its smell"], "Forces change how objects move."], ["Two kids push a box from opposite sides with the same force. What happens?", "The box does not move", ["It zooms to the left", "It zooms to the right", "It flies up"], "Equal pushes in opposite directions are balanced, so the box stays still."], ["A magnet pulls a paper clip through a sheet of paper. What does this show?", "Magnetic force can act through some materials", ["Paper is magnetic", "Paper clips are made of paper", "The magnet stopped working"], "Magnetic force can pass through thin materials like paper."], ["Which object would a magnet NOT attract?", "A wooden pencil", ["A steel paper clip", "An iron nail", "A steel safety pin"], "Wood is not magnetic."], ["What are the two ends of a magnet called?", "Poles", ["Sides", "Corners", "Wheels"], "Every magnet has a north pole and a south pole."], ["Where is a bar magnet’s pull the strongest?", "At its poles", ["In the middle", "The same everywhere", "Far away from the magnet"], "The force of a magnet is strongest at its ends, the poles."], ["Which design uses magnets to solve a problem?", "A refrigerator door that stays closed", ["A wooden chair", "A paper kite", "A glass window"], "Magnets in the door seal keep the fridge shut."], ["A box is pushed with equal force from both sides. The forces are…", "balanced", ["unbalanced", "magnetic", "invisible"], "Balanced forces do not change an object’s motion."], ["Mia pushes a box to the right harder than Leo pushes it to the left. Which way does it move?", "To the right", ["To the left", "It stays still", "Straight up"], "Unbalanced forces move an object toward the stronger push."], ["A ball rolls across a level floor and no one touches it. What happens?", "It slowly stops because of friction", ["It speeds up forever", "It turns into a magnet", "It rolls uphill"], "Friction from the floor and air slows it down."], ["You rub a balloon on your hair and it sticks to the wall. What causes this?", "Static electricity", ["Gravity", "Friction only", "Magnet poles"], "Rubbing builds up a static charge."], ["After rubbing a balloon on your hair, your hair lifts toward the balloon. What does this show?", "Static electricity can pull without touching", ["Hair is magnetic", "Balloons are heavy", "Gravity stopped"], "Electric forces can act at a distance, like magnets."], ["A swing moving back and forth is an example of…", "a pattern of motion you can predict", ["no motion", "a magnet", "static electricity"], "Some motions repeat, so we can predict them."], ["How does the pull between two magnets change when they get closer together?", "It gets stronger", ["It gets weaker", "It stays the same", "It disappears"], "Magnetic force is stronger at shorter distances."], ["Which problem could magnets help solve?", "Keeping a cabinet door closed", ["Making a cake rise", "Making water boil", "Growing a plant"], "Magnets can hold things in place."], ["A ball rolls down a ramp the same way every time. What can you predict?", "Where it will stop next time", ["The ball’s color", "What it will smell like", "Nothing at all"], "Repeated motion follows a pattern you can measure."]]},{id:"n3life",ch:"NGSS 3-LS1 \u00b7 3-LS3",nm:"Life Cycles and Traits",qs:[["What is the correct order of a plant’s life cycle?", "Seed → seedling → adult plant → flowers and seeds", ["Flower → seed → adult → seedling", "Adult → seed → seedling → flower", "Seedling → seed → flower → adult"], "A plant starts as a seed, grows, then makes flowers and new seeds."], ["What is the correct order of a frog’s life cycle?", "Egg → tadpole → froglet → adult frog", ["Tadpole → egg → adult → froglet", "Adult → tadpole → egg → froglet", "Egg → adult → tadpole → froglet"], "Frogs change form as they grow. This is called metamorphosis."], ["Wha n with inherited traits."], ["Which trait is caused by the environment?", "A plant growing short because it got little water", ["A flower’s color from its parent plant", "A cat’s number of legs", "A dog’s ear shape from its parents"], "The environment can change how a living thing grows."], ["Kittens in the same litter look a little different. Why?", "Each kitten gets a different mix of traits from its parents", ["They are different animals", "They live in different places", "They eat different toys"], "Brothers and sisters inherit different mixes of traits."], ["A dog learns to sit when told. Is that inherited?", "No, it is learned", ["Yes, all dogs are born knowing it", "Yes, it comes from the weather", "Yes, it comes from food"], "Learned behaviors are not passed down from parents."], ["A plant in the shade grows tall and thin. The same kind in the sun grows full and bushy. What caused the difference?", "The amount of light", ["The plant’s parents", "Magnets", "Sound"], "Light is part of the environment."], ["What do all life cycles include?", "Birth, growth, reproduction, and death", ["Only birth", "Only growing", "Only flying"], "Every living thing goes through a life cycle."], ["Why do plants make seeds?", "To make new plants", ["To make soil", "To make rain", "To scare animals"], "Seeds carry the plant’s life cycle forward."], ["Flamingos turn pink from the food they eat. Where does this trait come from?", "Their environment", ["Their parents only", "The Moon", "Static electricity"], "Food is part of the environment."], ["Which of these is a learned behavior?", "Riding a bike", ["Having brown eyes", "Having curly hair from birth", "Being tall like your parents"], "You learn skills; you inherit traits."]]},{id:"n3survive",ch:"NGSS 3-LS2 \u00b7 3-LS4",nm:"Groups, Fossils, and Survival",qs:[["There has been very little rain for months. What will most likely happen to the plants?", "They wilt and grow less", ["They grow taller and greener", "They turn into rocks" omes a frog."]],["s2g",["Which baby animal does NOT look like its parents?","A caterpillar",["A puppy","A kitten","A foal"],"A caterpillar looks very different from the butterfly it will become."]],["s2g",["What is the order of a frog’s life cycle?","Egg → tadpole → froglet → frog",["Tadpole → egg → frog → froglet","Frog → froglet → egg → tadpole","Egg → frog → tadpole → froglet"],"A frog starts as an egg, hatches as a tadpole, grows legs as a froglet, then becomes an adult frog."]],["s2g",["Where does a caterpillar change into a butterfly?","Inside a chrysalis",["Inside an egg","In a nest","Under the water"],"A caterpillar makes a chrysalis. Inside it, the caterpillar changes into a butterfly."]],["s2g",["What does a young tadpole use to swim?","Its tail",["Its legs","Its wings","Its shell"],"A tadpole swims with its tail. Later it grows legs and its tail goes away."]],["s2g",["A butterfly lays eggs on a leaf. What hatches from the eggs?","Caterpillars",["Butterflies","Tadpoles","Chicks"],"Butterfly eggs hatch into caterpillars, which eat leaves and grow."]],["c8",["Fossil seashells are found in many places in North Texas. What does this tell us?","An ocean once covered that land",["The land was always dry","Seashells grow on land","Birds dropped them there"],"Sea animal fossils on dry land show that the area was under the ocean long ago."]],["c8",["Dinosaur tracks are in the riverbed at Dinosaur Valley State Park in Glen Rose, Texas. What do they show?","Dinosaurs once walked there",["Dinosaurs live there now","The river made the shapes","People carved them for fun"],"The tracks are trace fossils. They show that dinosaurs walked in that mud long ago."]],["c8",["How do most fossils form?","A dead plant or animal is buried and slowly turns to rock",["A living animal turns to stone","Rocks grow into animals","Plants freeze in ice cubes"],"Mud and sand bury the remains. Over a very long time, minerals turn them into rock."]],["c8",["Which one can tell us about animals that lived long ago?","A fossil",["A cloud","A puddle","A rainbow"],"Fossils are clues left in rock by living things from long ago."]],["c8",["How do sharp claws help an eagle survive?","They help it catch and hold food",["They keep it warm","They help it swim","They help it hear"],"An eagle grabs fish and small animals with its sharp claws, called talons."]],["c8",["How does a turtle’s hard shell help it survive?","It protects the turtle’s soft body",["It helps the turtle fly","It keeps the turtle cool","It helps the turtle see"],"A turtle can pull into its hard shell to stay safe from predators."]],["c8",["How does a frog’s long, sticky tongue help it?","It helps the frog catch insects",["It helps the frog breathe","It helps the frog hop","It keeps the frog warm"],"A frog flicks out its sticky tongue to catch insects to eat."]],["c8",["A polar bear has thick fur and a layer of fat. How does this help it?","It keeps the bear warm in the cold",["It helps the bear climb trees","It helps the bear hide in grass","It makes the bear run faster"],"Thick fur and fat hold in body heat in the icy Arctic."]],["c8",["How do hard, bony plates help an armadillo survive?","They protect it from predators",["They help it fly","They help it swim fast","They keep it cool"],"An armadillo’s bony plates work like armor against animals that try to eat it."]],["s1g",["It is very windy outside. What might you see?","Leaves blowing around",["Puddles freezing","Stars in the sky","Snow melting"],"Wind is moving air. It can push leaves, kites, and flags."]],["s1g",["It is snowing outside. What should you wear?","A warm coat and gloves",["Shorts and sandals","A swimsuit","Sunglasses only"],"Snow means the air is cold. A coat and gloves keep you warm."]],["s1g",["Which animal makes its home in the soil?","An earthworm",["A shark","An eagle","A goldfish"],"Earthworms live and tunnel in soil."]],["s1g",["What is a good way to use less water outside?","Water plants in the cool morning",["Water the sidewalk","Leave the hose running","Water plants at hot noon"],"Morning water soaks into the soil instead of drying up in the hot sun."]],["s1g",["Which one is water that flows from place to place?","A river",["A puddle","A pond","A lake"],"A river flows. Ponds and lakes stay in one place."]],["s2e",["Strong wind blows across a sandy beach. What happens to the sand?","It moves to a new place",["It turns into rock","It melts","It grows taller"],"Wind can pick up sand and carry it to new places."]],["s2e",["Ocean waves hit a beach every day. What happens over time?","The waves move sand and change the beach",["The beach turns into soil","The waves make the beach freeze","Nothing ever changes"],"Waves carry sand away and drop it in new places, slowly changing the beach."]],["s2e",["Rain falls on bare soil with no plants. What can happen?","The soil washes away",["The soil turns to sand","The soil gets heavier","The soil floats up"],"Without plant roots to hold it, rain can wash soil away."]],["c8",["In winter, some plants stop growing until spring. What is this called?","Dormancy",["Migration","Hibernation","Germination"],"Dormancy is a resting time when a plant stops growing, often during cold weather."]],["c8",["Monarch butterflies fly through Texas to Mexico every fall. Why?","To find warmer weather for winter",["To find snow","To lay eggs in ice","To hibernate in Texas"],"Monarchs migrate to warm places to survive the winter."]],["s2g",["A bird eats berries from a bush. What does the bird depend on?","The bush for food",["The wind for food","Rocks for food","Clouds for food"],"Animals depend on plants and other living things for food."]],["s2g",["Which animal depends on trees for its home?","A squirrel",["A fish","A whale","A crab"],"Squirrels build nests in trees and eat the seeds and nuts trees make."]],["s2g",["Grass → rabbit → hawk. Which one is the producer?","Grass",["Rabbit","Hawk","The rock"],"A producer makes its own food from sunlight. Grass is a plant,
