const S4=[{"id":"s4a","ch":"TEKS 4.1–4.5","nm":"Thinking Like a Scientist","qs":[["You want to find out if the amount of sunlight changes how tall bean plants grow. What should you change in your test?","Only the amount of sunlight",["The soil and the amount of water too","Everything at once","Nothing at all"],"In a fair test, you change only the one thing you are testing and keep everything else the same."],["In the bean plant test, what should stay the same for every plant?","The water, soil, and kind of seed",["The amount of sunlight","How tall the plants grow","The results"],"Keeping everything else the same makes it a fair test, so only sunlight could cause a difference."],["Which tool measures the volume of a liquid most exactly?","A graduated cylinder",["A beaker","A hand lens","A magnet"],"A graduated cylinder has small, exact milliliter marks. A beaker only gives a rough amount."],["Which tool would you use to find the mass of a rock in grams?","A balance",["A meter stick","A thermometer","A graduated cylinder"],"A balance (or a digital scale) measures mass in grams."],["What does a Celsius thermometer measure?","Temperature",["Mass","Length","Volume"],"A thermometer measures how hot or cold something is, in degrees Celsius (°C)."],["Why do scientists repeat an investigation several times?","To make sure the results are reliable",["To make the test take longer","To change the question","To use up materials"],"If the results come out the same again and again, scientists can trust them."],["What is a prediction?","A statement about what you think will happen, based on what you know",["A list of materials","The final answer after the test","A drawing of the setup"],"A prediction uses what you already know to say what might happen. The test shows if it was right."],["Which is the best way to show how a plant’s height changed each week?","A line graph",["A list of plant names","A map","A single photo"],"Line graphs show how something changes over time."],["A student measures the temperature of water every 5 minutes. Where should she record her measurements?","In a data table",["Only in her memory","On a scrap she throws away","In a drawing of the beaker"],"A data table keeps measurements organized so you can look for patterns."],["In claim, evidence, and reasoning, what is evidence?","Data or observations that support the claim",["A guess with no facts","The title of the investigation","The list of materials"],"Evidence is what you measured or observed. It backs up your claim."],["What do engineers do first in the engineering design process?","Define the problem they need to solve",["Build the final product","Sell the solution","Skip the testing"],"Engineers start by stating the problem and what a good solution must do."],["Engineers test a model bridge, and it breaks. What should they do next?","Improve the design and test it again",["Give up","Hide the results","Build the same bridge again with no changes"],"Testing shows what to fix. Engineers improve a design and test again."],["Why do scientists use models, like a globe or a water cycle diagram?","To study things that are too big, too small, or too slow to see directly",["Because models are always exactly like the real thing","So they don’t have to think","Because models have no limits"],"Models help us study and explain things, but every model has limits."],["What is one limitation of a solar system model made of foam balls?","The sizes and distances are not to scale",["It shows the planets in order","It shows the Sun in the center","It helps you learn the planet names"],"Real distances in space are so huge that most models can’t show them correctly."],["Which safety rule matters most when heating water on a hot plate?","Wear safety goggles and keep hands away from the hot surface",["Taste the water to check it","Run near the hot plate","Leave it on when you are done"],"Goggles protect your eyes, and a hot plate can burn skin."],["A plant grew 2 cm, then 4 cm, then 6 cm, then 8 cm tall in four weeks. What pattern do you see?","It grew 2 cm taller each week",["It grew 4 cm taller each week","It got shorter each week","It grew a different amount each week"],"Each week it was 2 cm taller than the week before."],["Which of these is an observation?","The leaf is green and 5 cm long",["The leaf is the prettiest one","The plant is probably happy","Leaves might taste good"],"An observation describes what is really there, using your senses or tools."],["Which question can be answered with an investigation?","Does salt water freeze faster than fresh water?",["Which color is the best?","What is your favorite planet?","Are cats nicer than dogs?"],"A testable question can be answered by measuring or observing."],["Which units measure length in the metric system?","Meters and centimeters",["Pounds and ounces","Liters and milliliters","Degrees"],"Meters and centimeters are metric units of length."],["Why should scientists share their results?","So others can check the work and learn from it",["So no one else can test it","To keep the results secret","Because results never matter"],"Sharing lets other scientists repeat the test and build on it."],["A student’s results are very different from everyone else’s. What should she do?","Check her steps and repeat the test",["Change her data to match","Throw away her data","Ignore the other results"],"Repeating a test can show if a mistake was made."],["What is a variable in an investigation?","Something that can change in a test",["Something that never changes","The name of the scientist","The title of the report"],"Scientists change one variable and measure how it affects the results."],["Which tool helps you see tiny details on an insect’s wing?","A hand lens",["A ruler","A thermometer","A balance"],"A hand lens makes small things look bigger."],["A scientist says, “Plants need light, because the plants kept in a dark closet turned yellow and stopped growing.” Which part is the evidence?","The plants in the dark turned yellow and stopped growing",["Plants need light","The word “because”","The closet"],"Evidence is what was observed. The claim is the idea it supports."],["Which job uses science and math to design safer bridges?","Engineer",["Baker","Poet","Cashier"],"Engineers design solutions like strong, safe bridges."]]},{"id":"s4b","ch":"TEKS 4.6A","nm":"Properties of Matter","qs":[["What is mass?","The amount of matter in an object",["How hot an object is","How much space a liquid fills","The color of an object"],"Mass is how much matter something has. We measure it in grams or kilograms."],["A wooden block floats in water. What does this tell you?","The block is less dense than water",["The block is more dense than water","The block has no mass","The block is magnetic"],"Things that are less dense than water float. Things that are more dense sink."],["A metal key sinks in water. Compared to water, the key is…","More dense",["Less dense","The same density","Not made of matter"],"Objects that are more dense than water sink."],["Which object would a magnet attract?","An iron nail",["A plastic spoon","A copper penny","A rubber band"],"Magnets attract things made of iron, nickel, or cobalt. A penny is not magnetic."],["Which state of matter has its own shape and its own volume?","Solid",["Liquid","Gas","Steam"],"A solid keeps its shape and volume, even when you move it."],["Which state of matter takes the shape of its container but keeps the same volume?","Liquid",["Solid","Gas","Ice"],"A liquid flows to fit its container, but the amount stays the same."],["Which state of matter spreads out to fill any container?","Gas",["Solid","Liquid","Wood"],"Gas particles spread out to fill all the space they can."],["Water boils at 100 °C. What state is water at 105 °C?","Gas (water vapor)",["Solid (ice)","Liquid","It disappears completely"],"Above its boiling point, water is a gas called water vapor."],["Water freezes at 0 °C. What state is water at −5 °C?","Solid (ice)",["Liquid","Gas","It all evaporates"],"Below 0 °C, water freezes into ice."],["A thermometer in a cup of water shows 25 °C. The water is most likely…","Liquid",["Ice","Steam","Boiling"],"25 °C is between freezing (0 °C) and boiling (100 °C), so the water is liquid."],["Which property can you measure with a balance?","Mass",["Color","Texture","Magnetism"],"A balance measures mass."],["Two boxes are the same size. One is full of feathers and one is full of sand. Which has more mass?","The box of sand",["The box of feathers","They have the same mass","Neither has mass"],"Sand packs more matter into the same space, so it has more mass."],["Which object will most likely float in water?","A cork",["A marble","A steel bolt","A rock"],"Cork is less dense than water, so it floats."],["Oil floats on top of water. What does this show?","Oil is less dense than water",["Oil is more dense than water","Oil has no mass","Oil is a solid"],"A less dense liquid floats on a more dense one."],["Which property tells whether an object is attracted to a magnet?","Magnetism",["Mass","Temperature","State of matter"],"Magnetism is the property of being pulled by a magnet."],["How could you sort objects into magnetic and nonmagnetic groups?","Test each object with a magnet",["Weigh each object","Put each object in water","Measure each object’s temperature"],"Only magnetic objects are pulled by the magnet."],["You pour 100 mL of juice from a tall glass into a wide bowl. What happens to the volume of juice?","It stays 100 mL",["It gets bigger","It gets smaller","It turns into a gas"],"A liquid changes shape but keeps the same volume."],["How do we know that air has mass?","A balloon full of air has more mass than an empty balloon",["Air is invisible","Air feels cold","Air moves around"],"Air is matter, so it has mass and takes up space."],["Which unit is used to measure temperature in science class?","Degrees Celsius (°C)",["Grams","Milliliters","Centimeters"],"Scientists measure temperature in degrees Celsius."],["Which shows water from coldest to warmest?","Ice → liquid water → water vapor",["Water vapor → ice → liquid water","Liquid water → ice → water vapor","Ice → water vapor → liquid water"],"Ice melts into liquid water, and liquid water boils into water vapor as it warms."],["Which object is more dense than water?","A metal spoon",["A foam cup","A wooden craft stick","A beach ball"],"A metal spoon sinks, so it is more dense than water."],["What is the same about all solids, liquids, and gases?","They are all matter, so they have mass and take up space",["They all have their own shape","They all flow","They are all invisible"],"Every state of matter has mass and takes up space."],["Which object is both a solid and magnetic?","A steel paper clip",["Water","A plastic button","Air"],"A steel paper clip is a solid that a magnet attracts."],["An ice cube melts in a warm room. Which property changes?","Its state of matter",["Its mass becomes zero","It becomes magnetic","It turns into a gas right away"],"Melting changes a solid into a liquid. The mass stays the same."],["Which object has the greatest mass?","A bowling ball",["A ping-pong ball","A feather","A paper clip"],"A bowling ball has much more matter than the others."]]},{"id":"s4c","ch":"TEKS 4.6B–C","nm":"Mixtures and Solutions","qs":[["What is a mixture?","Two or more kinds of matter put together that keep their own properties",["Only one kind of matter","Matter that has disappeared","A new substance that can never be separated"],"In a mixture, each part keeps its own properties."],["Which is a solution?","Salt dissolved in water",["Sand and water","Rocks in a bucket","Oil and water"],"In a solution, one substance dissolves evenly into another, so you can’t see the pieces."],["Sugar is stirred into warm water and can’t be seen anymore. What happened?","The sugar dissolved",["The sugar turned into a gas","The sugar was destroyed","The sugar turned into water"],"The sugar is still there. It broke into pieces too tiny to see."],["How could you separate sand from water?","Pour it through a filter",["Use a magnet","Stir it faster","Freeze the sand"],"The filter lets water through but catches the sand."],["How could you separate iron filings from sand?","Use a magnet",["Use a filter","Add salt","Shake it"],"The magnet pulls out the iron and leaves the sand."],["How could you get the salt back out of salt water?","Let the water evaporate",["Pour it through a screen","Use a magnet","Shake it"],"When the water evaporates, the salt is left behind."],["Which is a mixture of a liquid in a liquid?","Lemon juice mixed into water",["Sand in water","Rocks and soil","Salt and pepper"],"Lemon juice and water are both liquids."],["Which is a solution of a solid dissolved in a liquid?","Drink powder dissolved in water",["Pebbles in water","Oil in water","Ice cubes in a cup"],"The powder is a solid that dissolves in the water."],["Oil and water are poured into a jar. What happens?","The oil floats on top in its own layer",["They mix together completely","The oil disappears","The water floats on top of the oil"],"Oil does not dissolve in water. It is less dense, so it floats."],["100 g of soil is mixed with 200 g of water. What is the mass of the mixture?","300 g",["200 g","100 g","Less than 300 g, because the soil sinks"],"Matter is conserved: 100 g + 200 g = 300 g."],["A cup of water has a mass of 250 g. 10 g of salt is dissolved in it. What is the total mass?","260 g",["250 g","240 g","10 g"],"The salt seems to disappear, but its mass is still there: 250 g + 10 g = 260 g."],["50 g of oil is mixed with 100 g of water. What is the total mass?","150 g",["100 g","50 g","200 g"],"The total mass of a mixture equals the masses of its parts added together."],["What does “matter is conserved” mean when you make a mixture?","The total mass stays the same",["The mass disappears","The mass doubles","Only the solids have mass"],"No matter is lost or added when things are mixed."],["Which mixture can you separate by picking out the pieces by hand?","Trail mix",["Salt water","Sugar water","Lemonade"],"The pieces of trail mix are big enough to pick apart."],["Which of these dissolves in water?","Sugar",["Sand","Pebbles","Plastic beads"],"Sugar dissolves in water. The others do not."],["Which of these does NOT dissolve in water?","Sand",["Salt","Sugar","Drink powder"],"Sand settles to the bottom instead of dissolving."],["How can you make sugar dissolve faster in water?","Stir it and use warm water",["Use ice-cold water and don’t stir","Add sand","Keep it in the dark"],"Stirring and warmth help sugar dissolve faster."],["A student mixes 30 g of sand with 70 g of water. She filters out the sand and dries it. What is the mass of the dry sand?","30 g",["70 g","100 g","0 g"],"The sand keeps its own mass, so it is still 30 g."],["Why is a salad a mixture?","Each part keeps its own properties and can be separated",["All the parts turn into one new thing","It is only one kind of matter","It can never be separated"],"You can still see and pick out each part of a salad."],["Which mixture is a solution?","Salt water",["Cereal and milk","Sand and gravel","Oil and vinegar"],"Salt dissolves evenly in water, so salt water is a solution."],["Why does muddy water look cloudy?","Tiny bits of soil are spread through the water but did not dissolve",["The soil turned into water","The water turned into soil","The soil disappeared"],"The soil pieces float around in the water until they settle."],["A student weighs water and salt separately, then mixes them. The mixture has the same mass as the two parts added together. What does this show?","Matter is conserved",["Salt has no mass","Water loses mass","Mixing makes new matter"],"Mixing does not create or destroy matter."],["Which tool would best separate pebbles from sand?","A sieve (a screen with small holes)",["A magnet","A thermometer","A hand lens"],"Sand falls through the holes, and pebbles stay on top."],["Which is a liquid mixed with a liquid?","Water and food coloring",["Water and sand","Rice and beans","Salt and sugar"],"Food coloring is a liquid that mixes into water."],["Muddy water is poured through a coffee filter. What stays in the filter?","The soil",["The water","Nothing","Dissolved salt"],"The filter catches the soil and lets the water through."]]},{"id":"s4d","ch":"TEKS 4.7A","nm":"Forces","qs":[["What force pulls objects toward the center of Earth?","Gravity",["Friction","Magnetism","Wind"],"Gravity pulls everything toward Earth’s center."],["Which force slows down a sled sliding across snow?","Friction",["Gravity","Magnetism","Electricity"],"Friction happens when surfaces rub. It slows moving objects."],["On which surface will a toy car have the most friction?","Carpet",["Ice","Smooth tile","A waxed floor"],"Rough surfaces like carpet cause more friction."],["A book is pushed across a table and stops. Why?","Friction between the book and the table slowed it down",["Gravity pushed it sideways","Magnetism pulled it back","The book was too heavy to move"],"Friction works against motion until the book stops."],["Which force can act on an object without touching it?","Magnetism",["Friction","A push from your hand","A kick"],"Magnets can pull iron objects without touching them."],["Gravity and magnetism are both forces that can act…","At a distance, without touching",["Only when objects touch","Only under water","Only on living things"],"Gravity and magnetism don’t need contact. Friction does."],["Two magnets are placed with their north poles facing. What happens?","They push apart (repel)",["They pull together (attract)","Nothing happens","They lose their magnetism"],"Like poles repel each other."],["A north pole is placed near a south pole. What happens?","They pull together (attract)",["They push apart","Nothing happens","They both become south poles"],"Opposite poles attract."],["A magnet is moved farther and farther from a paper clip. What happens to its pull?","It gets weaker",["It gets stronger","It stays the same","It turns into a push"],"Magnetic force gets weaker with distance."],["You drop a pencil, a book, and an apple. What pattern do you notice?","They all fall down toward Earth",["They float in the air","They fall sideways","Only the apple falls"],"Gravity pulls all objects down toward Earth."],["Why is it easier to slide a box across a smooth floor than across grass?","The smooth floor has less friction",["The smooth floor has more gravity","Grass has no friction","The box is lighter on the floor"],"Smoother surfaces usually cause less friction."],["How do bike brakes slow a bike down?","They rub the wheels and create friction",["They add more gravity","They make the bike magnetic","They remove friction"],"Brake pads press on the wheels, and friction slows them."],["What helps a soccer player’s shoes grip the grass?","Cleats that increase friction",["Smooth soles with no friction","Magnets in the shoes","Less gravity"],"Cleats dig into the grass and increase friction."],["A ramp is covered with sandpaper instead of smooth plastic. How will a toy car roll down it?","Slower, because sandpaper causes more friction",["Faster, because sandpaper is smooth","At the same speed","It will roll up the ramp"],"The rough sandpaper adds friction."],["Which is a contact force?","Friction",["Gravity","Magnetism","A magnet pulling a nail from across the room"],"Friction only happens when surfaces touch."],["A magnet picks up 5 paper clips through one sheet of paper but only 2 through a thick book. What pattern does this show?","The magnetic force gets weaker as the distance gets bigger",["Magnets get stronger through books","Paper clips are not magnetic","Books are magnetic"],"A thick book puts more distance between the magnet and the clips."],["A ball rolls down a hill. Which force pulls it down?","Gravity",["Friction","Magnetism","Light"],"Gravity pulls the ball downhill."],["Why does a ball rolling on grass stop sooner than one rolling on a gym floor?","Grass causes more friction",["Grass has less gravity","The gym floor is magnetic","The ball is heavier on grass"],"More friction slows the ball faster."],["Which change would make it easier to push a heavy box?","Put it on wheels to reduce friction",["Put sand under it","Push it on carpet","Make the box heavier"],"Wheels roll instead of sliding, so there is less friction."],["A compass needle turns to point north. Which force moves it?","Magnetism (Earth acts like a giant magnet)",["Friction","Gravity from the Moon","Wind"],"The magnetic needle lines up with Earth’s magnetic field."],["Which object will a magnet NOT attract?","An aluminum can",["A steel nail","An iron key","A steel paper clip"],"Aluminum is a metal, but it is not magnetic."],["A block slides on wood, sandpaper, and ice with the same push. On which will it slide farthest?","Ice",["Sandpaper","Wood","It slides the same on all three"],"Ice has the least friction."],["In which direction does gravity pull objects on Earth?","Down, toward Earth’s center",["Up","Sideways","Away from Earth"],"Gravity always pulls toward the center of Earth."],["Why does rubbing your hands together warm them up?","Friction makes heat",["Gravity makes heat","Magnetism makes heat","It removes friction"],"When surfaces rub, friction turns motion into heat."],["Which pattern describes friction?","Rougher surfaces usually cause more friction",["Smoother surfaces always cause more friction","Friction only happens in space","Friction makes objects speed up"],"Rough surfaces grip and slow objects more."]]},{"id":"s4e","ch":"TEKS 4.8A","nm":"Energy on the Move","qs":[["A rolling bowling ball hits the pins, and they fall. What happened to the energy?","Energy moved from the ball to the pins",["The energy disappeared","The pins made new energy","The energy went only into the floor"],"A moving object can transfer energy to what it hits."],["How does sound energy travel from a drum to your ears?","As vibrations moving through the air",["As light","Through a magnet","It does not travel"],"The drum vibrates and makes the air vibrate, carrying sound to your ears."],["A wave in a pond reaches a floating leaf and makes it bob up and down. What does this show?","Waves carry energy",["Waves carry the water far away","The leaf made the wave","Waves have no energy"],"Water waves transfer energy from place to place."],["A soccer player kicks a ball. What kind of energy does the moving ball have?","Mechanical energy (energy of motion)",["Sound energy only","Electrical energy","No energy"],"Moving objects have mechanical energy."],["Which shows sound energy being transferred?","A loud speaker makes a window rattle",["A rock sitting still","A cold glass of water","A closed book"],"Sound waves carry energy that can shake objects."],["A moving marble hits a marble that is sitting still. What happens?","The still marble starts moving because energy was transferred",["Both marbles stop forever","The still marble moves backward","Nothing happens"],"The moving marble passes energy to the one it hits."],["Big ocean waves crash on a beach and move sand around. What do the waves transfer to the sand?","Energy",["Magnetism","Gravity","Light"],"Waves carry energy that can move sand."],["Which has more energy: a fast-moving baseball or a slow-rolling baseball?","The fast-moving baseball",["The slow-rolling baseball","They have the same energy","Neither has energy"],"The faster an object moves, the more energy of motion it has."],["When you pluck a guitar string, what does the string do to make sound?","It vibrates",["It melts","It glows","It stops moving"],"Sound is made by vibrations."],["Wind pushes the blades of a wind turbine. What is transferred?","Energy from the moving air to the blades",["Water to the blades","Light to the air","Nothing"],"Moving air has energy that can turn the blades."],["Which example shows a moving object transferring energy?","A hammer pushing a nail into wood",["A hammer lying on a table","A nail in a box","A board on the floor"],"The moving hammer transfers energy to the nail."],["Thunder makes windows shake. Why?","Sound waves carry energy that makes the windows vibrate",["Lightning is magnetic","Rain hits the windows","Thunder has no energy"],"Loud sounds carry enough energy to shake objects."],["You toss a pebble into a pond, and ripples spread out. What do the ripples carry outward?","Energy",["Pebbles","Fish","Sand"],"Ripples are waves, and waves carry energy."],["Which sound has more energy?","A loud sound",["A soft sound","They have the same","Loudness has nothing to do with energy"],"Louder sounds have more energy."],["A swinging bat hits a baseball. Which way does energy move?","From the bat to the ball",["From the ball to the ground only","From the ground to the bat","It does not move"],"The bat transfers energy to the ball, which flies away."],["A row of dominoes falls one after another. What is passed from domino to domino?","Energy",["Magnetism","Light","Water"],"Each falling domino transfers energy to the next one."],["Why can you hear a friend calling from another room?","Sound energy travels through the air and even through walls",["Light bends around the corners","Your friend’s voice is magnetic","Sound does not need anything to travel through"],"Sound travels through matter: gases, liquids, and solids."],["A ball rolls slower and slower on grass until it stops. Where did its energy go?","Into the grass and air, mostly as heat from friction",["It disappeared","It turned into a new ball","Into the Sun"],"Energy is not lost. Friction changes it to heat."],["A ringing tuning fork is touched to water, and the water splashes. What does this show?","Sound comes from vibrations that carry energy",["Water makes sound","Tuning forks are magnetic","Sound has no energy"],"The vibrating fork transfers energy to the water."],["A surfer is carried toward the shore by a wave. What moves the surfer?","Energy carried by the wave",["The sand","Magnetism","The Moon’s light"],"Waves carry energy that can move objects."]]},{"id":"s4f","ch":"TEKS 4.8B–C","nm":"Conductors, Insulators, and Circuits","qs":[["Which material is a good conductor of electricity?","Copper wire",["Rubber","Plastic","Wood"],"Metals like copper let electricity flow easily."],["Which material is a good insulator of electricity?","Rubber",["Copper","Aluminum foil","A steel nail"],"Insulators like rubber block electricity."],["Why are electric wires covered in plastic?","Plastic is an insulator that keeps the electricity inside the wire",["Plastic carries electricity better","Plastic makes the wire hotter","Plastic makes the wire magnetic"],"The plastic covering protects people from shocks."],["Why do many pots have plastic or wooden handles?","Plastic and wood are insulators, so the handle stays cool",["They carry heat to your hand","They make the food cook faster","They are magnetic"],"Insulators slow the flow of thermal energy."],["Which is a good conductor of thermal energy (heat)?","A metal spoon",["A wooden spoon","A plastic spoon","A foam cup"],"Metals carry heat quickly."],["Which would keep a drink cold the longest?","A foam cooler",["A metal pan","A thin glass","An open plate"],"Foam is an insulator, so heat moves into it slowly."],["What is a closed circuit?","A complete path that electricity can flow through",["A path with a gap in it","A circuit with no battery","A broken wire"],"Electricity flows only when the path is complete."],["A bulb, a battery, and wires are connected, but one wire has a gap. What happens?","The bulb does not light because the circuit is open",["The bulb lights brighter","The wire melts","The bulb lights for a second"],"A gap opens the circuit, so electricity can’t flow."],["What does a switch do in a circuit?","It opens or closes the path for electricity",["It makes the battery bigger","It turns electricity into water","It adds more wires"],"Turning a switch on closes the circuit. Turning it off opens it."],["In a flashlight, electrical energy changes into…","Light and thermal energy",["Sound and magnetism","Only motion","Water"],"The bulb gives off light and also some heat."],["Which part of a simple circuit is the energy source?","The battery",["The wire","The bulb","The switch"],"The battery supplies the electrical energy."],["What happens when you close the switch in a working circuit?","Electricity flows and the bulb lights",["Electricity stops","The bulb turns off","The battery comes loose"],"Closing the switch completes the path."],["Which object could close a gap in a circuit and make a bulb light?","A steel paper clip",["A rubber band","A wooden stick","A plastic straw"],"Steel is a conductor, so it completes the circuit."],["A toaster changes electrical energy into…","Thermal energy (heat)",["Sound only","Magnetism only","Water"],"A toaster uses electricity to make heat that toasts bread."],["Why should you never touch a fallen power line?","Your body can conduct electricity, which is very dangerous",["Power lines are insulators","Power lines are cold","Power lines have no electricity"],"Electricity can flow through your body and hurt you."],["Which material would be best for the outside of an oven mitt?","Thick cloth",["Aluminum foil","A thin metal sheet","Copper"],"Thick cloth is an insulator, so it protects your hand from heat."],["In a circuit, electricity flows from the battery, through the wires and bulb, and then…","Back to the battery",["Out into the air","Into the switch, where it stops forever","Into the ground"],"A circuit is a closed loop."],["A string of holiday lights won’t turn on, and one bulb is loose. Why might that matter?","The loose bulb can open the circuit so electricity can’t flow",["Loose bulbs make more light","The other bulbs are insulators","Batteries hate loose bulbs"],"In many light strings, one break stops the whole path."],["Which list has only conductors?","Copper, aluminum, steel",["Rubber, glass, wood","Copper, rubber, plastic","Wood, foam, cloth"],"Metals are good conductors."],["Which list has only insulators?","Rubber, plastic, wood",["Copper, iron, silver","Aluminum, rubber, steel","Gold, copper, plastic"],"Rubber, plastic, and wood block electricity and heat."],["A metal spoon left in hot soup gets hot. Why?","Metal conducts thermal energy from the soup",["The spoon makes its own heat","Metal is an insulator","Heat moves from the spoon into the soup"],"Thermal energy moves from the hot soup through the metal."],["Thermal energy moves from…","Warmer objects to cooler objects",["Cooler objects to warmer objects","Only solids to gases","Nowhere"],"Heat always flows from warmer to cooler."],["Which device is used to change electrical energy into light?","A lamp",["A fan","A doorbell","A blender"],"A lamp turns electricity into light."],["Which device changes electrical energy into thermal energy to cook food?","An electric stove",["A flashlight","A radio","A fan"],"An electric stove heats up to cook food."],["What does a simple circuit need to work?","An energy source, wires, and a closed path",["Only a bulb","A magnet and water","Wires with a gap"],"Electricity needs a source and a complete loop."]]},{"id":"s4g","ch":"TEKS 4.9","nm":"Seasons and Moon Phases","qs":[["In Texas, which season has the longest days (the most hours of daylight)?","Summer",["Winter","Fall","Spring"],"In summer, the Sun is up for more hours each day."],["In Texas, which season has the shortest days?","Winter",["Summer","Spring","Fall"],"In winter, the Sun is up for fewer hours each day."],["What is the order of the seasons?","Spring, summer, fall, winter",["Spring, fall, summer, winter","Summer, spring, winter, fall","Winter, summer, spring, fall"],"The seasons repeat in this order every year."],["A table shows daylight getting longer each week from January to June. What will most likely happen from July to December?","Daylight will get shorter",["Daylight will keep getting longer forever","Daylight will stay the same","There will be no daylight"],"Daylight follows a yearly pattern. It grows until June, then shrinks until December."],["As the days get longer in spring, what usually happens to the temperature?","It gets warmer",["It gets colder","It stays exactly the same","It drops below freezing"],"More hours of sunlight usually means warmer days."],["About how long does it take the Moon to go through all of its phases?","About a month (29 and a half days)",["One day","One week","One year"],"The Moon’s phases repeat about every 29.5 days."],["Why does the Moon seem to change shape?","As it orbits Earth, we see different amounts of its sunlit side",["Earth’s shadow covers different parts each night","The Moon grows and shrinks","Clouds cover parts of it"],"Half of the Moon is always lit by the Sun. We see more or less of that half as it orbits."],["What is the phase called when we can’t see the Moon at all?","New moon",["Full moon","First quarter","Waxing gibbous"],"At new moon, the lit side faces away from Earth."],["What is the phase called when we see the whole lit side of the Moon?","Full moon",["New moon","Crescent","Third quarter"],"At full moon, the whole sunlit half faces Earth."],["After a new moon, the lit part of the Moon gets bigger each night. This is called…","Waxing",["Waning","Shrinking","Eclipsing"],"Waxing means growing."],["After a full moon, the lit part gets smaller each night. This is called…","Waning",["Waxing","Growing","Rising"],"Waning means shrinking."],["Which phase comes right after a full moon?","Waning gibbous",["Waxing crescent","New moon","First quarter"],"After full moon, the Moon begins to wane. Gibbous means more than half is lit."],["Which phase comes after a waxing crescent?","First quarter",["Full moon","Waning crescent","New moon"],"The order is new moon, waxing crescent, first quarter, waxing gibbous, full moon."],["Tonight there is a full moon. About how long until the next full moon?","About 29 or 30 days",["About 7 days","About 365 days","About 2 days"],"One full cycle of phases takes about 29.5 days."],["Tonight there is a full moon. About how long until the new moon?","About 2 weeks",["About 1 day","About 2 months","About 1 year"],"New moon is halfway through the cycle, about 15 days later."],["What does a first quarter moon look like?","Half of the Moon looks lit",["The whole Moon is lit","None of the Moon is lit","Only a thin sliver is lit"],"At first quarter, we see half of the Moon’s face lit up."],["Which pattern describes summer in Texas?","Longer days and warmer temperatures",["Shorter days and colder temperatures","No daylight at all","The Sun never sets"],"Summer brings more daylight and higher temperatures."],["A student writes down sunset times each week from June to December. What pattern will she see?","The Sun sets earlier",["The Sun sets later","Sunset stays the same","The Sun stops setting"],"Days get shorter from summer to winter, so sunset comes earlier."],["In which season are noon shadows the longest in Texas?","Winter",["Summer","Spring","Fall"],"In winter, the Sun is lower in the sky, so shadows are longer."],["In which month does summer begin in Texas?","June",["December","March","September"],"Summer begins around June 20 or 21."],["On the first day of winter, in December, Texas has…","The shortest day of the year",["The longest day of the year","No sunrise at all","Exactly 24 hours of daylight"],"The first day of winter has the fewest hours of daylight."],["Tonight you see a waning crescent moon. Which phase is coming next?","New moon",["Full moon","First quarter","Waxing gibbous"],"The waning crescent is the last phase before the new moon."],["Does the Moon make its own light?","No, it reflects light from the Sun",["Yes, it glows like the Sun","Yes, but only at night","No, it reflects light from city lights"],"Moonlight is sunlight bouncing off the Moon."],["About how long does it take for the seasons to repeat?","About one year",["One day","One month","One week"],"The seasons repeat each time Earth goes around the Sun, about once a year."],["A table shows Texas daylight: December 10 hours, March 12 hours, June 14 hours. About how much daylight would September have?","About 12 hours",["About 9 hours","About 15 hours","About 20 hours"],"September is between June and December, so its daylight is in between, like March."]]},{"id":"s4h","ch":"TEKS 4.10A, C","nm":"Water Cycle, Weather, and Climate","qs":[["What is the main source of energy for the water cycle?","The Sun",["The Moon","Wind turbines","Earth’s core"],"The Sun’s heat makes water evaporate and keeps the cycle moving."],["The Sun heats a lake, and some water turns into water vapor. What is this called?","Evaporation",["Condensation","Precipitation","Collection"],"Evaporation changes liquid water into a gas."],["Water vapor cools high in the sky and forms tiny droplets that make clouds. What is this called?","Condensation",["Evaporation","Precipitation","Runoff"],"Condensation changes water vapor back into liquid drops."],["Rain, snow, sleet, and hail are all kinds of…","Precipitation",["Evaporation","Condensation","Erosion"],"Precipitation is water falling from clouds."],["Rainwater that flows over the land into streams and rivers is called…","Runoff",["Evaporation","Condensation","Climate"],"Runoff is water moving over the ground."],["Which shows the water cycle in order?","Evaporation → condensation → precipitation → collection",["Precipitation → evaporation → collection → condensation","Condensation → evaporation → collection → precipitation","Collection → condensation → evaporation → precipitation"],"Water evaporates, condenses into clouds, falls as precipitation, and collects."],["Why does a puddle dry up faster on a hot, sunny day?","The Sun’s heat makes the water evaporate faster",["The puddle soaks into the clouds","Cold air makes water disappear","The Moon pulls the water away"],"More heat means faster evaporation."],["Drops of water form on the outside of a cold glass of lemonade. Where did they come from?","Water vapor in the air condensed on the cold glass",["The lemonade leaked through the glass","Ice melted through the glass","Rain fell inside the room"],"Warm, moist air cools when it touches the glass, and the vapor condenses."],["Where does most of the water that evaporates on Earth come from?","The oceans",["Puddles","Swimming pools","Clouds"],"Oceans cover most of Earth, so most evaporation happens there."],["Water that soaks into the ground and is stored underground is called…","Groundwater",["Precipitation","Water vapor","Condensation"],"Groundwater fills spaces between soil and rock underground."],["What is the difference between weather and climate?","Weather is day to day; climate is the usual pattern over many years",["Weather is the pattern over many years; climate is day to day","They mean the same thing","Climate only means rain"],"Climate describes what weather is usually like in a place."],["“It is raining in Dallas today.” This sentence describes…","Weather",["Climate","Erosion","A season"],"Today’s conditions are weather."],["“El Paso is usually hot and dry, with little rain each year.” This sentence describes…","Climate",["Weather","Precipitation for one day","A forecast"],"The usual pattern over many years is climate."],["Which Texas city has a climate with the most rain each year?","Houston",["El Paso","Midland","Lubbock"],"Houston gets about 50 inches of rain a year. West Texas cities get much less."],["A forecast says, “Tomorrow will be sunny with a high of 95 °F.” This is information about…","Weather",["Climate","Erosion","Groundwater"],"A forecast predicts the weather."],["Which tool measures how much rain fell?","A rain gauge",["A thermometer","A wind vane","A compass"],"A rain gauge collects and measures rain."],["Which describes the climate of a desert?","Dry, with little rain most years",["Rainy almost every day","Always covered in snow","Wet and stormy all year"],"Deserts get very little precipitation."],["Plants give off water vapor through their leaves. Where does this water go?","Into the air",["Into rocks","To the bottom of the ocean","Into the Sun"],"This is part of the water cycle. The vapor joins the air and can later form clouds."],["Snow on a mountain melts in spring. Where does the water most likely go next?","It flows downhill into streams and rivers",["It flies to the Moon","It turns into rock","It stays as snow forever"],"Melted snow becomes runoff that flows downhill."],["What happens to water vapor when it cools?","It condenses into tiny liquid drops",["It evaporates more","It turns into salt","It disappears"],"Cooling turns water vapor back into liquid."],["Does the water cycle ever stop?","No, water keeps moving in a cycle",["Yes, every winter","Yes, every night","Yes, whenever it rains"],"The water cycle is continuous."],["Which sentence is about climate?","Texas summers are usually hot.",["It snowed in Amarillo last night.","A storm is passing through today.","It is 70 °F right now."],"“Usually” describes a long-term pattern, which is climate."],["Why do clouds form?","Water vapor cools and condenses into tiny drops or ice crystals",["Smoke rises into the sky","The Sun makes cotton","Wind blows dust together"],"Clouds are made of tiny water drops or ice crystals."],["Rain falls on a parking lot. What happens to most of the water?","It runs off into drains and streams",["It all soaks into the pavement","It turns into ice","It goes straight back into the cloud"],"Pavement doesn’t soak up water, so most of it runs off."],["Which part of the water cycle brings water from clouds back to Earth’s surface?","Precipitation",["Evaporation","Condensation","Runoff"],"Precipitation falls from clouds to the ground."]]},{"id":"s4i","ch":"TEKS 4.10B","nm":"Weathering, Erosion, and Deposition","qs":[["What is weathering?","Breaking rock into smaller pieces",["Moving rock pieces to a new place","Dropping sediment in a new place","Making new rock from lava"],"Weathering breaks rock down where it is."],["What is erosion?","Moving weathered rock and soil from one place to another",["Breaking rock without moving it","Dropping sediment","Melting rock"],"Water, wind, and ice carry pieces away."],["What is deposition?","Dropping sediment in a new place",["Breaking rocks apart","Picking up soil","Melting ice"],"Deposition is when moving water, wind, or ice drops what it carried."],["Water freezes in a crack in a rock, expands, and splits the rock. This is an example of…","Weathering by ice",["Deposition","A volcano","Condensation"],"Ice takes up more space than water, so it pushes the rock apart."],["A river drops sand where it flows into a lake, building a delta. Dropping the sand is…","Deposition",["Weathering","Evaporation","Condensation"],"When water slows down, it drops sediment."],["Which can cause erosion?","Water, wind, and ice",["Only sunlight","Only the Moon","Only clouds"],"Moving water, wind, and ice all carry sediment."],["Wind blows sand across a desert and piles it into dunes. Piling up the sand is…","Deposition",["Weathering","Melting","Condensation"],"The wind drops the sand, building dunes."],["Palo Duro Canyon in the Texas Panhandle was carved over a very long time by a river. Which process carved it?","Erosion by water",["A volcano erupting","An earthquake","Deposition by wind"],"Moving water slowly wore away and carried off rock."],["Glaciers move slowly, scrape the land, and carry huge rocks. This is erosion by…","Ice",["Wind","Sunlight","Plants"],"Moving ice can carve valleys and move boulders."],["Do weathering and erosion usually happen fast or slow?","Usually slowly, over many years",["Always in a few seconds","Always in one day","They never happen"],"These changes usually take a very long time."],["How do plant roots help prevent erosion?","They hold soil in place",["They make soil wash away faster","They melt the soil","They make the wind stronger"],"Roots grip the soil so water and wind can’t carry it off as easily."],["Tree roots grow into cracks in a sidewalk and break it apart. This is…","Weathering",["Deposition","Condensation","Precipitation"],"Growing roots can break rock and concrete."],["Ocean waves pound a rocky shore for many years. What happens to the rocks?","They slowly break down and become smoother",["They grow larger","They turn into water","Nothing ever happens"],"Waves weather and erode rock over time."],["A river drops sediment where it reaches the ocean. Which landform can form there?","A delta",["A volcano","A glacier","A mountain"],"Deltas form where rivers deposit sediment."],["In a model, sand sits on a tilted tray and water is poured at the top. Where will most of the sand end up?","At the bottom of the tray",["At the top","In the air","It will not move"],"The water erodes the sand and deposits it at the bottom."],["Which is an example of weathering by wind?","Blowing sand slowly wears away a rock",["A river drops mud","Ice melts in a cup","Rain fills a lake"],"Wind-blown sand acts like sandpaper on rock."],["Which shows these changes in the usual order?","Weathering → erosion → deposition",["Deposition → weathering → erosion","Erosion → deposition → weathering","Deposition → erosion → weathering"],"Rock breaks down, the pieces are carried away, then they are dropped."],["Smooth, rounded pebbles in a stream were most likely shaped by…","Moving water rubbing them over a long time",["A factory","A volcano","Wind in one day"],"Tumbling in water wears off the sharp edges."],["Which would most likely slow erosion on a hillside?","Planting grass and trees",["Removing all the plants","Pouring more water on it","Digging the soil loose"],"Plant roots hold soil in place."],["Which is a SLOW change to Earth’s surface?","A canyon forming from erosion",["An earthquake","A landslide","A volcanic eruption"],"Canyons take thousands to millions of years to form."]]},{"id":"s4j","ch":"TEKS 4.11","nm":"Natural Resources","qs":[["Which resource is renewable?","Wind",["Coal","Oil","Natural gas"],"Wind keeps blowing, so it won’t run out."],["Which resource is nonrenewable?","Coal",["Sunlight","Wind","Moving water"],"Coal takes millions of years to form, so it can run out."],["What is one advantage of using wind to make electricity?","Wind will not run out",["Wind blows the same amount all the time","Wind turbines take up no space","Wind power makes a lot of smoke"],"Wind is renewable and doesn’t pollute the air."],["What is one disadvantage of solar energy?","It does not work well at night or on very cloudy days",["Sunlight will run out soon","It makes a lot of smoke","It is nonrenewable"],"Solar panels need sunlight to make electricity."],["What is one disadvantage of burning coal, oil, or natural gas?","They can pollute the air, and they will run out",["They are renewable","They never pollute","They are made from sunlight today"],"Fossil fuels are nonrenewable and give off pollution when burned."],["What is one advantage of oil and natural gas?","They give off a lot of energy and are easy to store and move",["They never run out","They make no pollution","They form very quickly"],"That is why they are used so much, even though they can run out."],["West Texas has many wind farms. Why is that a good place for them?","It is windy and has lots of open land",["It has no wind","It is covered by forests","It is under water"],"Steady wind and open space are good for wind turbines."],["Which is a fossil fuel?","Natural gas",["Wind","Sunlight","Water in a river"],"Coal, oil, and natural gas are fossil fuels."],["Why are fossil fuels nonrenewable?","They take millions of years to form",["They form in one day","Wind makes them","Farmers grow them each year"],"We use them much faster than they can form."],["Why are energy resources important to modern life?","They power homes, cars, hospitals, and factories",["They are only used for toys","People don’t need energy","They only make noise"],"Almost everything we do uses energy."],["Which is a way to conserve energy at home?","Turn off the lights when you leave a room",["Leave the TV on all night","Open the refrigerator often","Run hot water when you’re not using it"],"Using less energy helps resources last longer."],["How does recycling aluminum cans help the environment?","It saves resources and energy and makes less trash",["It makes more trash","It uses up more resources","It has no effect"],"Making new cans from old ones takes much less energy."],["What can happen when trash is not thrown away properly?","It can pollute land and water and harm animals",["It turns into new soil right away","It helps fish grow","Nothing happens"],"Litter can wash into rivers and oceans."],["Oil and natural gas are often found inside rocks deep underground. Which property lets these rocks hold them?","The rocks have tiny spaces (pores) that can hold liquids and gases",["The rocks are magnetic","The rocks are shiny","The rocks are made of ice"],"Porous rock has small spaces between its grains."],["Which rock is most likely to store groundwater or oil?","Sandstone, which has many tiny spaces between its grains",["Solid granite with no cracks","Glass","A steel bar"],"Sandstone is porous, so it can hold fluids."],["What does it mean if a rock is permeable?","Liquids can flow through it",["It is very heavy","It is magnetic","It glows"],"Permeable rocks have connected spaces that let water or oil move through."],["Which resource is renewable if people take care of it?","Trees",["Coal","Oil","Natural gas"],"New trees can be planted and grown."],["Plants are a natural resource. How do people use cotton plants?","To make cloth for clothing",["To make gasoline","To make coal","To make magnets"],"Cotton fibers are spun into thread and woven into cloth."],["A dam uses moving water to spin turbines. What does it make?","Electricity",["Coal","Oil","Natural gas"],"This is called hydroelectric power."],["What is one disadvantage of building a dam?","It can flood land and change river habitats",["It makes smoke","Water will run out tomorrow","It cannot make electricity"],"A dam blocks a river and floods the land behind it."],["Which choice uses fewer nonrenewable resources?","Riding a bike instead of riding in a car",["Driving to a friend’s house next door","Leaving the lights on","Using more plastic bags"],"Biking doesn’t burn gasoline."],["Using an old glass jar to store crayons is an example of…","Reusing",["Recycling","Polluting","Wasting"],"Reusing means using something again instead of throwing it away."],["Which energy resource uses sunlight directly?","Solar panels",["Coal","Natural gas","Oil"],"Solar panels change sunlight into electricity."],["Why is it important to use natural resources like soil and water wisely?","So there will be enough for people in the future",["So they run out faster","So they get more polluted","Because they are not useful"],"Conserving resources keeps them available."],["Why is it important to recycle paper?","It saves trees and reduces waste",["It cuts down more trees","It makes more trash","It fills up landfills"],"Recycled paper can be made into new paper."]]},{"id":"s4k","ch":"TEKS 4.12A–B","nm":"Producers and Food Webs","qs":[["What do producers, like plants, need to make their own food?","Sunlight, water, and carbon dioxide",["Soil, sugar, and oxygen only","Meat and water","Darkness and cold air"],"Plants use sunlight to turn water and carbon dioxide into food."],["Where do plants get carbon dioxide?","From the air",["From the soil","From the Sun","From rocks"],"Leaves take in carbon dioxide from the air."],["What do plants make when they use sunlight to make food?","Sugar (food) and oxygen",["Carbon dioxide and smoke","Water and salt","Meat and sugar"],"Plants make sugar for food and give off oxygen."],["Which part of a plant takes in most of the sunlight to make food?","The leaves",["The roots","The flowers","The seeds"],"Leaves are where most food is made."],["How do roots help a plant make food?","They take in water from the soil",["They take in sunlight","They make carbon dioxide","They catch insects"],"Plants need water to make food, and roots soak it up."],["In a food web, what do the arrows show?","The direction energy flows, from the food to the eater",["Which animal is biggest","Where animals sleep","Which way animals walk"],"Arrows point from what is eaten to what eats it."],["What is the source of energy for almost every food web?","The Sun",["Water","Soil","Decomposers"],"Producers capture the Sun’s energy, and it flows to consumers."],["Which is a decomposer?","A mushroom",["Grass","A hawk","A rabbit"],"Mushrooms break down dead things."],["What do decomposers do?","Break down dead plants and animals and return nutrients to the soil",["Make food from sunlight","Hunt other animals","Make oxygen"],"Decomposers recycle matter so plants can use it again."],["Grass → grasshopper → mouse → snake → hawk. Which one is the producer?","Grass",["Grasshopper","Mouse","Hawk"],"Grass makes its own food from sunlight."],["Grass → grasshopper → mouse → snake → hawk. What would most likely happen if all the snakes disappeared?","There would be more mice",["There would be more hawks","The grass would stop growing","Nothing would change"],"Snakes eat mice, so with no snakes, more mice would survive."],["A coyote eats rabbits and mice. What is a coyote?","A consumer",["A producer","A decomposer","A nonliving thing"],"Consumers get energy by eating other living things."],["How is a food web different from a food chain?","A food web shows many food chains connected together",["A food web has only one animal","A food chain has more paths","They are exactly the same"],"Most animals eat more than one thing, so food chains link into webs."],["Which animal is an herbivore?","A deer",["A hawk","A snake","A coyote"],"Herbivores eat only plants."],["Which animal is an omnivore?","A raccoon",["A deer","A cow","A grasshopper"],"Raccoons eat both plants and animals."],["A leaf falls on the forest floor. What happens to it over time?","Decomposers break it down into nutrients that plants can use again",["It disappears without a trace","It turns into a rock","It flies back onto the tree"],"Matter cycles through the ecosystem."],["Why do consumers need producers?","Consumers can’t make their own food, and energy starts with producers",["Producers hunt consumers","Consumers make food from sunlight","Producers are decomposers"],"All food energy begins with producers."],["Algae → small fish → heron. Where did the heron’s energy first come from?","The Sun",["The pond water","The heron made it","The mud"],"The algae captured the Sun’s energy, which passed up the food chain."],["Which gas do plants give off that animals need to breathe?","Oxygen",["Carbon dioxide","Smoke","Steam"],"Plants release oxygen when they make food."],["What would happen to a food web if all the producers disappeared?","The consumers would run out of food",["The consumers would have more food","Nothing would change","Decomposers would make sunlight"],"Every food web depends on producers."],["An owl eats a mouse. The owl is the ___, and the mouse is the ___.","Predator; prey",["Prey; predator","Producer; decomposer","Decomposer; producer"],"A predator hunts, and prey is what gets eaten."],["Which animal is a scavenger that eats dead animals?","A vulture",["A cow","A rabbit","An oak tree"],"Vultures eat animals that have already died."],["In a food web, energy flows from…","Producers to consumers",["Consumers to the Sun","Decomposers to the Sun","Animals to plants only"],"Energy moves from plants to the animals that eat them."],["Earthworms eat dead leaves and make the soil rich. What role do they play?","Decomposer",["Producer","Predator","Herbivore"],"Earthworms help break down dead material."],["Which of these do plants NOT need to make food?","Meat",["Sunlight","Water","Carbon dioxide"],"Plants make their own food. They don’t eat other living things."]]},{"id":"s4l","ch":"TEKS 4.12C","nm":"Fossils and Past Environments","qs":[["Fossils of sea animals and shells are found in rocks in the Texas Hill Country. What was this area like long ago?","It was covered by a shallow sea",["It was a frozen glacier","It was always a desert","It was a big city"],"Sea fossils show that ocean water once covered the land."],["Petrified wood is found in parts of Texas. What does this tell us?","Trees once grew there",["The area was always an ocean","Rocks grow like trees","People planted stone trees"],"Petrified wood is wood that slowly turned to stone."],["Dinosaur tracks are found in the riverbed at Dinosaur Valley State Park in Glen Rose, Texas. What do they tell us?","Dinosaurs walked in soft mud there long ago",["Dinosaurs live there today","People carved them","The area was always solid rock"],"Tracks are trace fossils left in mud that later hardened."],["What is a fossil?","The remains or traces of a living thing from long ago, kept in rock",["A rock with no history","A living animal","A crystal"],"Fossils can be bones, shells, footprints, or imprints."],["Which is a trace fossil?","A footprint",["A bone","A shell","A tooth"],"Trace fossils show what an animal did, like walking."],["A fossil palm tree is found in a very cold place. What does this show?","The climate there was once warm",["Palm trees grow best in snow","The fossil is a fake","The place was always cold"],"Palm trees need warm weather, so the climate must have changed."],["Mammoth fossils were found at the Waco Mammoth National Monument in Texas. What does this show?","Mammoths lived in Texas long ago",["Mammoths live in Texas today","Mammoths lived only in oceans","Fossils move by themselves"],"Fossils show which animals lived in a place."],["In which kind of rock are most fossils found?","Sedimentary rock, made from layers of sediment",["Lava","Ice","Metal"],"Sediment buries remains and slowly hardens into rock."],["In rock layers that have not been disturbed, where are the oldest fossils usually found?","In the bottom layers",["In the top layers","Only in the middle","Fossils are in no order"],"Lower layers formed first, so they are older."],["A fossil of coral is found in a rock layer on dry land. What was the environment like when the coral lived?","A warm, shallow ocean",["A cold desert","A snowy mountain","A dry cave"],"Coral grows in warm, shallow seas."],["Ammonites are fossils of sea animals with coiled shells. They are common in North Texas. What does this tell you?","North Texas was once under the sea",["Ammonites lived in deserts","North Texas was always dry","The shells were brought by trucks"],"Sea animal fossils show that an ocean once covered the area."],["How do scientists use fossils?","To learn what living things and environments were like long ago",["To predict tomorrow’s weather","To make new animals","To measure temperature"],"Fossils are clues about the past."],["Which is MOST likely to become a fossil?","A shell buried quickly in mud",["A leaf left on a sidewalk","A jellyfish drying on a rock","A worm eaten by a bird"],"Hard parts that are buried quickly have the best chance."],["Fossils of ferns are found in a dry place. Ferns grow in wet places. What can you infer?","The place was once wetter",["Ferns like dry places","The place was always dry","Ferns can walk"],"Fossils can show how a place’s environment has changed."],["A fossil seashell is found high on a mountain. What can you conclude?","The rock was once under water and was later lifted up",["Seashells climb mountains","Birds dropped all the shells","The mountain was never under water"],"Land can rise over millions of years."]]},{"id":"s4m","ch":"TEKS 4.13","nm":"Plant Structures and Traits","qs":[["How do waxy leaves help a cactus survive in the desert?","They help hold in water",["They catch insects","They make the cactus grow taller","They help it float"],"A waxy coating keeps water from escaping."],["Mesquite trees in West Texas have very deep roots. How does this help them?","The roots reach water deep underground",["The roots catch sunlight","The roots hold up flowers","The roots keep the tree warm"],"Deep roots find water when the soil near the top is dry."],["How do the spines on a prickly pear cactus help it survive?","They protect it from animals that might eat it",["They make food from sunlight","They soak up rain","They make seeds"],"Sharp spines keep many animals away."],["Why do many rain forest plants have large, wide leaves?","To catch as much sunlight as possible in the shade",["To store sand","To stay dry","To scare animals away"],"Big leaves capture more light under the tall trees."],["What does a plant’s stem do?","It holds the plant up and carries water and food",["It makes seeds","It catches insects","It attracts bees"],"The stem supports the plant and moves materials."],["Why do some flowers have bright colors and sweet smells?","To attract pollinators like bees",["To make sugar","To keep the plant warm","To hold water"],"Pollinators help flowers make seeds."],["Water lilies have leaves that float. How does this help them?","The leaves get sunlight at the water’s surface",["The leaves stay in the dark","The leaves catch fish","The leaves sink into the mud"],"Floating leaves can reach the sunlight they need to make food."],["Why does a cactus store water in its thick stem?","Deserts get little rain, so the plant saves water",["Deserts flood every day","Cactuses don’t need water","Water keeps insects away"],"Stored water helps the cactus survive dry times."],["What is an inherited trait?","A trait passed from parents to their offspring",["A skill learned from practice","A scar from an injury","A haircut"],"Inherited traits come from parents."],["What is an acquired trait?","A trait that comes from the environment or experiences during life",["A trait passed from parents","Natural eye color","The shape of a flower’s petals"],"Acquired traits are not passed down from parents."],["Which is an inherited trait of a dog?","Its natural fur color",["Knowing how to sit on command","A scar on its leg","Short fur from a haircut"],"Fur color is passed down from the dog’s parents."],["Which is an acquired trait?","A scar from falling off a bike",["Natural eye color","Natural hair color","The shape of your ears"],"A scar comes from something that happened, not from your parents."],["A plant growing in the shade becomes tall and thin as it reaches for light. This is…","An acquired trait caused by its environment",["An inherited trait from its parents","A learned skill","Not a trait at all"],"The plant’s surroundings caused this change."],["The color of a sunflower’s petals is mostly…","An inherited trait",["An acquired trait","A learned behavior","Caused by the weather"],"Petal color is passed down through seeds from parent plants."],["A tree grows bent because strong winds always blow from one direction. The bend is…","An acquired trait",["An inherited trait","A trait from its seed","A learned behavior"],"The wind, part of the environment, caused the bend."],["Which is an inherited trait in people?","Natural eye color",["Knowing how to read","A sunburn","Strong muscles from lifting weights"],"Eye color comes from your parents."],["Bluebonnets, the Texas state flower, have blue petals mainly because of…","Traits inherited from their parent plants",["The color of the soil","How often it rains","Being painted"],"Flower color is passed down in seeds."],["Why do rose bushes have thorns?","To protect them from being eaten",["To make food","To soak up water","To attract bees"],"Thorns keep many animals from eating the plant."],["How do the thick, deep roots of prairie grasses help them survive?","They hold the soil and help the grass grow back after being eaten or burned",["They help the grass fly","They make the grass smell sweet","They catch rainwater in the air"],"Strong roots store food and stay alive underground."],["Some trees drop their leaves in fall. How does this help them survive winter?","It helps them save water and energy during the cold season",["It helps them catch more sunlight","It makes them grow faster in winter","It attracts bees in winter"],"Without leaves, the tree loses less water when the ground is cold."],["Which plant structure takes in water and nutrients from the soil?","Roots",["Leaves","Flowers","Fruit"],"Roots soak up water and nutrients."],["Why do some seeds have tiny hooks, like burrs?","So animals carry them to new places",["So wind can’t move them","To make food","To store water"],"Hooks stick to fur, spreading the seeds."],["A kitten has black fur like its mother. This is an example of…","An inherited trait",["An acquired trait","A learned behavior","Weathering"],"Traits passed from parents are inherited."],["Someone’s hair gets lighter after a summer in the sun. This is…","An acquired trait",["An inherited trait","A trait from parents","A seed trait"],"The sun, part of the environment, caused the change."],["What is the BEST evidence that a trait is inherited?","Parents and their offspring share the trait",["It changed after an injury","It came from practice","It appeared after a haircut"],"Inherited traits are passed from parents to their young."]]}];

const N4=[{"id":"n4energy","ch":"NGSS 4-PS3","nm":"Energy","qs":[["A rolling bowling ball hits the pins, and they fall. What happened to the energy?","Energy moved from the ball to the pins",["The energy disappeared","The pins made new energy","The energy went only into the floor"],"A moving object can transfer energy to what it hits."],["How does sound energy travel from a drum to your ears?","As vibrations moving through the air",["As light","Through a magnet","It does not travel"],"The drum vibrates and makes the air vibrate, carrying sound to your ears."],["Which has more energy: a fast-moving baseball or a slow-rolling baseball?","The fast-moving baseball",["The slow-rolling baseball","They have the same energy","Neither has energy"],"The faster an object moves, the more energy of motion it has."],["Wind pushes the blades of a wind turbine. What is transferred?","Energy from the moving air to the blades",["Water to the blades","Light to the air","Nothing"],"Moving air has energy that can turn the blades."],["A moving marble hits a marble that is sitting still. What happens?","The still marble starts moving because energy was transferred",["Both marbles stop forever","The still marble moves backward","Nothing happens"],"The moving marble passes energy to the one it hits."],["A ball rolls slower and slower on grass until it stops. Where did its energy go?","Into the grass and air, mostly as heat from friction",["It disappeared","It turned into a new ball","Into the Sun"],"Energy is not lost. Friction changes it to heat."],["A row of dominoes falls one after another. What is passed from domino to domino?","Energy",["Magnetism","Light","Water"],"Each falling domino transfers energy to the next one."],["What is a closed circuit?","A complete path that electricity can flow through",["A path with a gap in it","A circuit with no battery","A broken wire"],"Electricity flows only when the path is complete."],["In a flashlight, electrical energy changes into…","Light and ergy","Magnetism"],"Light absorbed by the sidewalk becomes heat."],["A student designs a rubber-band car. When she lets go of the wound-up rubber band, the car moves. What energy change happens?","Stored energy changes into energy of motion",["Light changes into sound","Heat changes into electricity","Nothing changes"],"The twisted rubber band stores energy that becomes motion."],["A ball is dropped from higher up. What happens when it hits the ground?","It hits faster and with more energy",["It hits slower","It has less energy","It floats"],"Falling farther lets it speed up, so it has more energy."],["Which shows energy carried by an electric current?","A battery lighting a bulb through wires",["A rock sitting on a table","A book on a shelf","A cold puddle"],"Electric current carries energy through the wires to the bulb."],["A drum is hit softly, then hard. When does the sound carry more energy?","When it is hit hard",["When it is hit softly","It is the same both times","Sound never has energy"],"A harder hit makes bigger vibrations and a louder sound."],["Which is the best design to keep a cup of cocoa hot the longest?","A cup with a lid and a thick insulated wall",["A thin metal cup with no lid","An open bowl","A paper plate"],"Insulation and a lid slow the transfer of heat."],["What happens to energy when a moving object hits something?","It can be transferred to the other object",["It is always destroyed","It always doubles","Nothing happens"],"Energy moves from one object to another in a collision."]]},{"id":"n4waves","ch":"NGSS 4-PS4","nm":"Waves and Information","qs":[["What is the amplitude of a wave?","How high the wave rises from its resting level",["How far the wave travels in a day","The color of the wave","How cold the water is"],"Amplitude is the height of a wave from its middle (resting) level."],["The distance from the top of one wave to the top of the next is called the…","Wavelength",["Amplitude","Temperature","Speed"],"Wavelength is the distance s"],"Sound travels through matter. It can’t travel through empty space."],["What happens to a sound when its waves have more energy?","It is louder",["It is quieter","It turns into light","It stops"],"More energy makes a louder sound."],["Which is a way to send information using light?","Flashing a flashlight in a code",["Whispering","Tapping a table","Writing in sand"],"Light flashes can follow a pattern, like a code."],["A phone call sends your voice far away. What does the phone change your voice into?","A pattern of signals that can travel far",["Water waves","Rocks","Nothing; your voice travels by itself"],"Phones turn sound into signals and turn them back into sound."],["In a water wave, what does the water mostly do?","Move up and down while the wave moves forward",["Travel all the way across the ocean","Stay perfectly still","Turn into air"],"Waves carry energy forward, not the water itself."],["Light travels in…","Straight lines",["Circles","Zigzags that turn corners","Waves you can hear"],"That is why objects make shadows."],["What do your eyes need in order to see an object?","Light from the object, made or reflected, entering your eyes",["A loud sound","A strong smell","A magnet"],"Eyes detect light."],["Which uses a sound pattern to warn people?","A fire alarm’s beeping pattern",["A painted wall","A quiet library","A closed book"],"Alarms use sound patterns to send a message fast."],["Two waves pass a dock. Wave A is taller than wave B. Which statement is true?","Wave A has a larger amplitude",["Wave B has a larger amplitude","They have the same amplitude","Neither wave has energy"],"A taller wave has a larger amplitude and more energy."],["Why do we see the Moon at night?","Sunlight reflects off the Moon to our eyes",["The Moon makes its own light","Street lights shine on it","The Moon is on fire"],"The Moon reflects sunlight."],["A computer stores a picture as a pattern of numbers. Why is that useful?","The pattern can be copied and sent far away with   return {...ratChoices([a*c,b*d],[[a*c,b+d],[a+c,b*d],[a*d,b*c]]),q:`${a}/${b} × ${c}/${d} = ?`,e:`Multiply the numerators and the denominators: (${a} × ${c})/(${b} × ${d}) = ${a*c}/${b*d}${rf(a*c,b*d)!==`${a*c}/${b*d}`?` = ${rf(a*c,b*d)}`:''}.`}}
function fArea(){const D=[2,3,4,5,6];let a,b,c,d;do{b=pick(D);d=pick(D);a=rnd(1,b-1);c=rnd(1,d-1)}while(gcd(a,b)>1||gcd(c,d)>1);
  return {...ratChoices([a*c,b*d],[[a*c,b+d],[a+c,b*d],[2*a*d+2*c*b,b*d]]),q:`A rectangle is ${a}/${b} foot long and ${c}/${d} foot wide. What is its area, in square feet?`,e:`Area = length × width = ${a}/${b} × ${c}/${d} = ${rf(a*c,b*d)} square foot.`}}
function fScale(){const N=rnd(6,40);let a,b;do{a=rnd(1,9);b=rnd(2,9)}while(a===b||gcd(a,b)>1);const less=a<b;
  return {a:`It is ${less?'less':'greater'} than ${N}.`,choices:[`It is less than ${N}.`,`It is greater than ${N}.`,`It is equal to ${N}.`],q:`Without multiplying, how does ${a}/${b} × ${N} compare with ${N}?`,e:`${a}/${b} is ${less?'less':'greater'} than 1. Multiplying ${N} by a fraction ${less?'less':'greater'} than 1 gives a product ${less?'less':'greater'} than ${N}.`}}
const g5FracMulCC=()=>pick([fDivAsFrac,fShare,fTimesFrac,fArea,fScale,fWholeTimes,fUnitDiv,fWholeDiv])();
